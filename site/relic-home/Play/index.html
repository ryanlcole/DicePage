<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070d">
<title>Shaelvien — RIST MMO / Sandbox</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#05070d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#05070d}body{min-height:100dvh;overflow:hidden}
.screen{position:fixed;inset:0;background:#05070d;overflow:hidden;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(26px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.start-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0}
.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.03) 0%,rgba(0,0,0,.08) 55%,rgba(0,0,0,.70) 100%);pointer-events:none}
.panel{position:relative;z-index:2;width:min(90vw,440px);align-self:end;margin-bottom:clamp(20px,7vh,78px);display:flex;justify-content:center}
.menu,.card{width:100%;display:grid;gap:12px;padding:16px;border:1px solid rgba(215,190,128,.72);border-radius:14px;background:rgba(5,10,14,.78);box-shadow:0 12px 38px rgba(0,0,0,.46);backdrop-filter:blur(4px)}
button,input,select{font:inherit}.menu button,.card button,.anykey{min-height:52px;border:1px solid #8d7440;border-radius:9px;background:rgba(23,36,43,.92);color:#ffe9ad;font-weight:900;cursor:pointer;touch-action:manipulation}.menu button:active,.card button:active,.anykey:active{transform:scale(.985)}
.anykey{width:min(90vw,480px);padding:13px 18px;background:rgba(5,10,14,.65);font-size:clamp(17px,4vw,24px);text-shadow:0 2px 7px #000}
.card h1{margin:0 0 4px;text-align:center;color:#f0d38d;font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,7vw,40px)}
.card label{display:grid;gap:6px;color:#ead9b5;font-weight:800}.card input[type=text]{width:100%;min-height:46px;padding:10px 12px;border:1px solid #725d30;border-radius:8px;background:#0b151a;color:#fff}.agreement{grid-template-columns:auto 1fr!important;align-items:center!important}.agreement input{width:22px;height:22px}.back{background:rgba(10,16,20,.82)!important;color:#c8d1d4!important}.status{position:fixed;z-index:4;left:20px;right:20px;bottom:max(8px,env(safe-area-inset-bottom));margin:0;text-align:center;color:#f3dfaa;font:700 13px/1.35 system-ui;text-shadow:0 2px 7px #000;pointer-events:none}
[hidden]{display:none!important}
@media (orientation:landscape) and (max-height:560px){.panel{margin-bottom:5px;width:min(64vw,500px)}.menu,.card{padding:10px;gap:8px}.menu button,.card button{min-height:42px}.card h1{font-size:24px}.anykey{min-height:44px;font-size:18px}}
</style>
</head>
<body>
<main class="screen" aria-label="Shaelvien startup">
 <img class="start-art" src="/Game/assets/branding/shaelvien-dragon-creation-startup-screen.png" alt="Primordial dragons forming Shaelvien with their breath weapons.">
 <div class="shade" aria-hidden="true"></div>
 <section class="panel" id="panel" aria-live="polite"></section>
</main>
<p id="status" class="status" role="status" aria-live="polite"></p>
<script>
(()=>{
'use strict';
const panel=document.getElementById('panel'),status=document.getElementById('status');
const cookieName='rist_session',profileKey='account/profile.json',signupKey='rist.signup.draft.v1',intentKey='rist.auth.intent';
let api='',busy=false,view='splash';
const say=m=>status.textContent=m||'';
const setCookie=t=>document.cookie=`${cookieName}=${encodeURIComponent(t)}; Path=/; Max-Age=28800; Secure; SameSite=Lax`;
const clean=v=>String(v||'').trim().slice(0,64);
function render(next){view=next;say('');
 if(next==='splash')panel.innerHTML='<button class="anykey" type="button" data-action="continue">Press any key to continue…</button>';
 else if(next==='entry')panel.innerHTML='<nav class="menu" aria-label="Start"><button type="button" data-action="signin">Sign In</button><button type="button" data-action="signup">Sign Up</button><button type="button" data-action="preview">Preview</button></nav>';
 else if(next==='signin')panel.innerHTML='<section class="card"><h1>Sign In</h1><button type="button" data-action="discord">Discord Login</button><button class="back" type="button" data-action="entry">Return</button></section>';
 else if(next==='signup')panel.innerHTML='<form class="card" id="signup"><h1>Sign Up</h1><label>Handle<input name="handle" type="text" maxlength="64" autocomplete="nickname" required></label><label>Plan<input name="plan" type="text" maxlength="64" placeholder="Plan" required></label><label class="agreement"><input name="agreements" type="checkbox" required><span>Agreements</span></label><button type="submit">Continue…</button><button class="back" type="button" data-action="entry">Return</button></form>';
 requestAnimationFrame(()=>panel.querySelector('button,input')?.focus());
}
async function getApi(){if(api)return api;const r=await fetch('./auth-config.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Account service configuration is unavailable.');const c=await r.json();api=(c.apiBaseUrl||'').replace(/\/$/,'');if(!api)throw new Error('Account service configuration is incomplete.');return api}
async function authFetch(base,token,path,opts={}){const h=new Headers(opts.headers||{});h.set('Authorization','Bearer '+token);return fetch(base+path,{...opts,headers:h,cache:'no-store'})}
async function readProfile(base,token){const r=await authFetch(base,token,'/storage/download?key='+encodeURIComponent(profileKey));if(r.status===404)return null;if(!r.ok)throw new Error('Your account could not be checked.');const p=await r.json();if(!p?.url)return null;const f=await fetch(p.url,{cache:'no-store'});if(f.status===404)return null;if(!f.ok)throw new Error('Your account could not be checked.');return f.json()}
async function writeProfile(base,token,data){const prep=await authFetch(base,token,'/storage/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:profileKey,contentType:'application/json'})});if(!prep.ok)throw new Error('Your account could not be prepared.');const post=await prep.json();if(!post?.url||!post?.fields)throw new Error('Account storage is unavailable.');const form=new FormData();Object.entries(post.fields).forEach(([k,v])=>form.append(k,v));form.append('file',new Blob([JSON.stringify(data)],{type:'application/json'}),'profile.json');const u=await fetch(post.url,{method:'POST',body:form});if(!u.ok)throw new Error('Your account could not be prepared.')}
async function ensureAccount(base,token,me){if(await readProfile(base,token))return;const draft=(()=>{try{return JSON.parse(localStorage.getItem(signupKey)||'null')}catch{return null}})();const now=new Date().toISOString();const alias=clean(draft?.handle)||(me?.displayName||me?.DisplayName||'Player').trim().slice(0,32)||'Player';const plan=clean(draft?.plan)||'player';await writeProfile(base,token,{AccountId:crypto.randomUUID(),PlayerAlias:alias,Plan:plan,CreatedAtUtc:now,TermsAcceptedAtUtc:'0001-01-01T00:00:00+00:00',TermsVersion:'',ContentAccess:null})}
function enter(token){sessionStorage.setItem('rist.session',token);sessionStorage.setItem('rist.lastActivity',String(Date.now()));setCookie(token);say('Entering Shaelvien…');location.replace('/Game/index.html')}
async function completeToken(base,token){const r=await authFetch(base,token,'/me');if(!r.ok)throw new Error('Your authenticated session could not be verified.');await ensureAccount(base,token,await r.json());enter(token)}
async function begin(intent='login'){if(busy)return;busy=true;localStorage.setItem(intentKey,intent);try{say('Opening secure Discord login…');location.href=(await getApi())+'/auth/login'}catch(e){busy=false;say(e?.message||'Unable to start authentication.')}}
async function handoff(code){say('Completing secure Discord sign in…');const base=await getApi(),r=await fetch(base+'/auth/session?handoff='+encodeURIComponent(code),{cache:'no-store'});if(!r.ok)throw new Error('The sign-in handoff expired. Please try again.');const p=await r.json();if(!p.sessionToken)throw new Error('The account service returned an invalid session.');await completeToken(base,p.sessionToken)}
panel.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='continue'||a==='entry')render('entry');else if(a==='signin')render('signin');else if(a==='signup')render('signup');else if(a==='discord')begin('login');else if(a==='preview'){sessionStorage.setItem('rist-public-preview','1');say('Public preview will reopen through the game entry once preview access is enabled.')}});
panel.addEventListener('submit',e=>{if(e.target.id!=='signup')return;e.preventDefault();const f=new FormData(e.target);const draft={handle:clean(f.get('handle')),plan:clean(f.get('plan')),agreements:f.get('agreements')==='on'};if(!draft.handle||!draft.plan||!draft.agreements)return;localStorage.setItem(signupKey,JSON.stringify(draft));begin('signup')});
addEventListener('keydown',e=>{if(view==='splash'){e.preventDefault();render('entry')}else if(e.key==='Escape'){if(view==='signin'||view==='signup')render('entry')}});
addEventListener('pointerdown',e=>{if(view==='splash'&&!e.target.closest('button'))render('entry')});
(async()=>{try{const q=new URLSearchParams(location.search),h=q.get('rist_handoff');if(h){history.replaceState(null,'',location.pathname);await handoff(h);return}const saved=sessionStorage.getItem('rist.session');if(saved){await completeToken(await getApi(),saved);return}render('splash')}catch(e){sessionStorage.removeItem('rist.session');sessionStorage.removeItem('rist.lastActivity');busy=false;render('entry');say(e?.message||'Authentication could not be completed.')}})();
})();
</script>
</body>
</html>
