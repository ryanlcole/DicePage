<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="color-scheme" content="dark">
 <meta name="theme-color" content="#05070d">
 <title>Shaelvien — RIST MMO / Sandbox</title>
 <style>
  :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#05070d}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#05070d}
  body{min-height:100dvh;overflow:hidden}
  button,input,select{font:inherit}
  .screen{position:fixed;inset:0;display:grid;place-items:end center;padding:max(22px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(34px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background-image:linear-gradient(to bottom,rgba(1,3,9,.04) 0%,rgba(1,3,9,.08) 48%,rgba(1,3,9,.72) 100%),url('./shaelvien-start.webp'),radial-gradient(circle at 18% 30%,#151333 0,#080914 45%,#1b1008 100%);background-position:center;background-repeat:no-repeat;background-size:cover}
  .entry{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:clamp(28px,8vw,84px);width:100%;padding:10px 0 2px;text-align:center;text-shadow:0 2px 10px #000,0 0 24px #000}
  .entry button{appearance:none;border:0;background:transparent;color:#f4e6bf;font-weight:900;font-size:clamp(20px,4vw,30px);letter-spacing:.06em;padding:14px 8px;cursor:pointer;touch-action:manipulation}
  .entry button:hover,.entry button:focus-visible{color:#fff3c9;text-decoration:underline;text-underline-offset:7px}
  .entry button:focus-visible,.profile button:focus-visible,.profile input:focus-visible,.profile select:focus-visible{outline:3px solid #f0d07d;outline-offset:4px}
  .status{position:fixed;left:50%;bottom:max(96px,calc(env(safe-area-inset-bottom) + 84px));transform:translateX(-50%);z-index:3;width:min(92vw,620px);margin:0;text-align:center;color:#f0e7d0;font-size:14px;font-weight:700;text-shadow:0 2px 8px #000}
  .profile-wrap{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:rgba(2,5,10,.74);backdrop-filter:blur(5px)}
  .profile{width:min(92vw,520px);max-height:90dvh;overflow:auto;padding:24px;border:1px solid rgba(225,199,127,.72);border-radius:14px;background:rgba(7,12,18,.95);box-shadow:0 24px 70px #000b;color:#eee6d2}
  .profile h1{margin:0 0 6px;color:#e4ca83;font-size:26px}.profile p{margin:0 0 18px;color:#b9b1a0;line-height:1.45}.profile label{display:grid;gap:7px;margin:13px 0;color:#d8c78f;font-weight:800}.profile input,.profile select{width:100%;min-height:48px;padding:10px 11px;border:1px solid #65727a;border-radius:8px;background:#091219;color:#f5f5f5}.terms{display:flex!important;grid-template-columns:none!important;align-items:flex-start;gap:10px!important;color:#d5d7d8!important;font-weight:600!important;line-height:1.4}.terms input{width:22px;height:22px;min-height:0;flex:0 0 auto;margin:1px 0 0}.profile button{width:100%;min-height:50px;margin-top:12px;border:1px solid #9d8148;border-radius:8px;background:#17242c;color:#f0ddaa;font-weight:900;cursor:pointer}.profile button:disabled{opacity:.5;cursor:default}.profile small{display:block;margin-top:12px;color:#968d7b;line-height:1.4}.error{color:#ffb8ad!important;font-weight:800}
  [hidden]{display:none!important}
  @media (orientation:portrait){.screen{background-position:center center}.entry{gap:34px}.entry button{font-size:22px}}
  @media (min-width:1200px){.screen{background-size:cover}}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  @media (prefers-contrast:more){.entry button,.profile{border-width:2px}.entry button{text-shadow:0 2px 4px #000}}
 </style>
</head>
<body>
 <main class="screen" aria-label="Shaelvien startup">
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <nav id="entry" class="entry" aria-label="Account access">
   <button id="login" type="button">Login</button>
   <button id="signup" type="button">Sign Up</button>
  </nav>
 </main>

 <section id="profile-wrap" class="profile-wrap" hidden aria-label="Finish profile">
  <form id="profile" class="profile">
   <h1>Finish your profile</h1>
   <p>You are signed in. Set the account details you want to use, then enter Shaelvien.</p>
   <label>Player alias<input id="alias" type="text" maxlength="32" autocomplete="nickname" required></label>
   <label>Plan<select id="plan" required><option value="player">Roleplayer — Free</option><option value="gm-player">GameMaster + Roleplayer — Free</option></select></label>
   <label class="terms"><input id="terms" type="checkbox"><span>I agree to the current Terms and Privacy Policy.</span></label>
   <button id="profile-save" type="submit">Save Profile &amp; Enter Game</button>
   <p id="profile-error" class="error" role="alert" aria-live="assertive"></p>
   <small>Discord is used to authenticate the account. Your RIST profile is stored separately in your private ReLiC account storage.</small>
  </form>
 </section>

 <script src="./launcher.js?v=20260906-direct-auth-1" defer></script>
</body>
</html>
