<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070d">
<title>Shaelvien — RIST MMO / Sandbox</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#05070d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#05070d}body{min-height:100dvh;overflow:hidden}
.screen{position:fixed;inset:0;background:#05070d url('./shaelvien-startup.png?v=1') center center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;padding:max(28px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(48px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}
.screen:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.02) 0%,rgba(0,0,0,.04) 62%,rgba(0,0,0,.72) 100%);pointer-events:none}
.entry{position:relative;z-index:2;display:flex;gap:clamp(38px,12vw,110px);align-items:center;justify-content:center;padding-bottom:clamp(18px,5vh,60px)}
.auth-link{appearance:none;border:0;background:transparent;color:#ffe9ad;font:900 clamp(28px,6vw,46px)/1 system-ui,-apple-system,sans-serif;letter-spacing:.02em;text-shadow:0 2px 12px #000,0 1px 1px #000;cursor:pointer;padding:14px 10px;min-width:120px;touch-action:manipulation}
.auth-link:focus-visible{outline:3px solid #ffe9ad;outline-offset:4px;border-radius:8px}.auth-link:active{transform:scale(.97)}
.status{position:fixed;z-index:3;left:20px;right:20px;bottom:max(10px,env(safe-area-inset-bottom));margin:0;text-align:center;color:#f3dfaa;font:700 13px/1.35 system-ui;text-shadow:0 2px 6px #000;pointer-events:none}
.profile-wrap{position:fixed;z-index:5;inset:0;display:grid;place-items:center;padding:20px;background:rgba(3,7,12,.86);backdrop-filter:blur(6px)}
.profile{width:min(92vw,520px);max-height:86dvh;overflow:auto;padding:24px;border:1px solid #8d7440;border-radius:14px;background:#081016;color:#eee6d2;box-shadow:0 18px 55px #000b}
.profile h1{margin:0 0 8px;color:#e5c878}.profile p{color:#b8b09e;line-height:1.4}.profile label{display:grid;gap:6px;margin:14px 0;color:#d7c58f;font-weight:800}.profile input,.profile select{min-height:46px;padding:9px 10px;border:1px solid #59666d;border-radius:7px;background:#050b10;color:#fff;font:inherit}.terms{display:flex!important;grid-template-columns:none!important;align-items:flex-start;gap:10px!important}.terms input{width:21px;height:21px;min-height:0;margin-top:1px}.save{width:100%;min-height:48px;margin-top:8px;border:1px solid #a68a4b;border-radius:8px;background:#17242b;color:#ffe9ad;font-weight:900}.error{min-height:1.3em;color:#ffb3a6;font-weight:700}
[hidden]{display:none!important}
@media (orientation:landscape) and (max-height:540px){.screen{background-position:center 46%;padding-bottom:max(20px,env(safe-area-inset-bottom))}.entry{padding-bottom:4px}.auth-link{font-size:clamp(24px,4vw,38px)}}
@media (max-width:420px){.entry{gap:28px}.auth-link{min-width:108px;font-size:30px}}
</style>
</head>
<body>
<main class="screen" aria-label="Shaelvien startup">
 <div id="entry" class="entry">
  <button id="login" class="auth-link" type="button">Login</button>
  <button id="signup" class="auth-link" type="button">Sign Up</button>
 </div>
</main>
<p id="status" class="status" role="status" aria-live="polite"></p>
<section id="profile-wrap" class="profile-wrap" hidden aria-label="Create RIST profile">
 <form id="profile" class="profile">
  <h1>Create Profile</h1>
  <p>Discord verified. Finish your RIST profile, then enter the game.</p>
  <label>Player alias<input id="alias" maxlength="32" autocomplete="nickname" required></label>
  <label>Plan<select id="plan"><option value="player">Roleplayer</option><option value="gm-player">GameMaster + Roleplayer</option></select></label>
  <label class="terms"><input id="terms" type="checkbox"><span>I agree to the Terms and Privacy Policy.</span></label>
  <p id="profile-error" class="error" role="alert"></p>
  <button id="profile-save" class="save" type="submit">Save Profile & Enter Game</button>
 </form>
</section>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),status=$('status'),entry=$('entry'),profileWrap=$('profile-wrap'),profile=$('profile');
const authIntentKey='rist.auth.intent',profileKey='account/profile.json',cookieName='rist_session';
let api='',token='',authProfile=null,busy=false;
const say=m=>status.textContent=m||'';
const setCookie=t=>document.cookie=`${cookieName}=${encodeURIComponent(t)}; Path=/; Max-Age=28800; Secure; SameSite=Lax`;
const clearCookie=()=>{document.cookie=`${cookieName}=; Path=/; Max-Age=0; Secure; SameSite=Lax`;document.cookie=`${cookieName}=; Path=/Game/; Max-Age=0; Secure; SameSite=Lax`;};
async function getApi(){if(api)return api;const r=await fetch('./auth-config.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Account service configuration is unavailable.');const c=await r.json();api=(c.apiBaseUrl||'').replace(/\/$/,'');if(!api)throw new Error('Account service configuration is incomplete.');return api;}
async function apiFetch(path,opts={}){const base=await getApi();const h=new Headers(opts.headers||{});if(token)h.set('Authorization','Bearer '+token);return fetch(base+path,{...opts,headers:h,cache:'no-store'});}
async function verify(){if(!token)return false;const r=await apiFetch('/me');if(!r.ok)return false;authProfile=await r.json();return true;}
async function loadProfile(){const r=await apiFetch('/storage/download?key='+encodeURIComponent(profileKey));if(r.status===404)return null;if(!r.ok)throw new Error('Your RIST profile could not be checked.');const p=await r.json();if(!p?.url)return null;const f=await fetch(p.url,{cache:'no-store'});if(f.status===404)return null;if(!f.ok)throw new Error('Your RIST profile could not be checked.');return f.json();}
async function saveProfile(alias,plan){const data={AccountId:crypto.randomUUID(),PlayerAlias:alias,Plan:plan,CreatedAtUtc:new Date().toISOString(),TermsAcceptedAtUtc:new Date().toISOString(),TermsVersion:'2026-08-30',ContentAccess:null};const prep=await apiFetch('/storage/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:profileKey,contentType:'application/json'})});if(!prep.ok)throw new Error('Your RIST profile could not be created.');const post=await prep.json();if(!post?.url||!post?.fields)throw new Error('Profile storage is unavailable.');const form=new FormData();Object.entries(post.fields).forEach(([k,v])=>form.append(k,v));form.append('file',new Blob([JSON.stringify(data)],{type:'application/json'}),'profile.json');const u=await fetch(post.url,{method:'POST',body:form});if(!u.ok)throw new Error('Your RIST profile could not be saved.');}
function enterGame(){if(busy)return;busy=true;setCookie(token);sessionStorage.setItem('rist.session',token);sessionStorage.setItem('rist.lastActivity',String(Date.now()));sessionStorage.setItem('rist.launch.intent','load');sessionStorage.setItem('rist.launch.settings',JSON.stringify({role:'Roleplayer',domain:'Shaelvien MMO'}));localStorage.removeItem(authIntentKey);say('Entering Shaelvien…');location.replace('/Game/index.html');}
function showProfile(){entry.hidden=true;profileWrap.hidden=false;say('');const fallback=(authProfile?.displayName||authProfile?.DisplayName||'').trim().slice(0,32);$('alias').value=fallback;setTimeout(()=>$('alias').focus(),50);}
async function begin(intent){if(busy)return;busy=true;try{say(intent==='signup'?'Opening secure sign up…':'Opening secure login…');sessionStorage.setItem(authIntentKey,intent);localStorage.setItem(authIntentKey,intent);const base=await getApi();location.href=base+'/auth/login';}catch(e){busy=false;say(e?.message||'Unable to start authentication.');}}
async function handoff(code){const intent=sessionStorage.getItem(authIntentKey)||localStorage.getItem(authIntentKey)||'login';say('Completing secure sign in…');const base=await getApi();const r=await fetch(base+'/auth/session?handoff='+encodeURIComponent(code),{cache:'no-store'});if(!r.ok)throw new Error('The sign-in handoff expired. Please try again.');const p=await r.json();if(!p.sessionToken)throw new Error('The account service returned an invalid session.');token=p.sessionToken;sessionStorage.setItem('rist.session',token);sessionStorage.setItem('rist.lastActivity',String(Date.now()));setCookie(token);if(!(await verify()))throw new Error('Your authenticated session could not be verified.');const existing=await loadProfile();if(intent==='signup'){if(existing){sessionStorage.removeItem(authIntentKey);localStorage.removeItem(authIntentKey);entry.hidden=false;profileWrap.hidden=true;busy=false;say('You already have a RIST account. Please Log In.');setTimeout(()=>$('login').focus(),50);return;}showProfile();busy=false;return;}if(!existing){sessionStorage.removeItem(authIntentKey);localStorage.removeItem(authIntentKey);entry.hidden=false;profileWrap.hidden=true;busy=false;say('No RIST profile is connected to this Discord account. Choose Sign Up.');setTimeout(()=>$('signup').focus(),50);return;}enterGame();}
$('login').onclick=()=>begin('login');$('signup').onclick=()=>begin('signup');
profile.onsubmit=async e=>{e.preventDefault();const err=$('profile-error');err.textContent='';const alias=$('alias').value.trim(),plan=$('plan').value==='gm-player'?'gm-player':'player';if(alias.length<1||alias.length>32){err.textContent='Enter a player alias from 1 to 32 characters.';return}if(!$('terms').checked){err.textContent='Accept the Terms and Privacy Policy to create the profile.';return}const b=$('profile-save');b.disabled=true;b.textContent='Saving…';try{const existing=await loadProfile();if(existing){entry.hidden=false;profileWrap.hidden=true;say('You already have a RIST account. Please Log In.');return}await saveProfile(alias,plan);enterGame();}catch(x){err.textContent=x?.message||'Your profile could not be saved.';b.disabled=false;b.textContent='Save Profile & Enter Game';}};
(async()=>{try{const q=new URLSearchParams(location.search),h=q.get('rist_handoff');if(h){history.replaceState(null,'',location.pathname);await handoff(h);return}const saved=sessionStorage.getItem('rist.session');if(saved){token=saved;if(await verify()){const existing=await loadProfile();if(existing){enterGame();return}}sessionStorage.removeItem('rist.session');sessionStorage.removeItem('rist.lastActivity');clearCookie();token='';}}catch(e){clearCookie();sessionStorage.removeItem('rist.session');token='';entry.hidden=false;profileWrap.hidden=true;busy=false;say(e?.message||'Authentication could not be completed.');}})();
})();
</script>
</body>
</html>
