<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070d">
<title>Shaelvien — RIST MMO / Sandbox</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#05070d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#05070d}body{min-height:100dvh;overflow:hidden}
.screen{position:fixed;inset:0;background:#05070d url('./shaelvien-startup.png?v=1') center center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;padding:max(28px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(48px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}
.screen:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.02) 0%,rgba(0,0,0,.04) 62%,rgba(0,0,0,.72) 100%);pointer-events:none}
.entry{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;padding-bottom:clamp(18px,5vh,60px)}
.auth-link{appearance:none;border:0;background:transparent;color:#ffe9ad;font:900 clamp(28px,6vw,46px)/1 system-ui,-apple-system,sans-serif;letter-spacing:.02em;text-shadow:0 2px 12px #000,0 1px 1px #000;cursor:pointer;padding:14px 18px;touch-action:manipulation}
.auth-link:focus-visible{outline:3px solid #ffe9ad;outline-offset:4px;border-radius:8px}.auth-link:active{transform:scale(.97)}
.status{position:fixed;z-index:3;left:20px;right:20px;bottom:max(10px,env(safe-area-inset-bottom));margin:0;text-align:center;color:#f3dfaa;font:700 13px/1.35 system-ui;text-shadow:0 2px 6px #000;pointer-events:none}
.terms-wrap{position:fixed;z-index:5;inset:0;display:grid;place-items:center;padding:20px;background:rgba(3,7,12,.86);backdrop-filter:blur(6px)}
.terms-card{width:min(92vw,520px);max-height:86dvh;overflow:auto;padding:24px;border:1px solid #8d7440;border-radius:14px;background:#081016;color:#eee6d2;box-shadow:0 18px 55px #000b}
.terms-card h1{margin:0 0 8px;color:#e5c878}.terms-card p{color:#b8b09e;line-height:1.45}.terms-check{display:flex;align-items:flex-start;gap:10px;margin:18px 0;color:#d7c58f;font-weight:800}.terms-check input{width:22px;height:22px;flex:0 0 auto;margin-top:1px}.continue{width:100%;min-height:48px;margin-top:8px;border:1px solid #a68a4b;border-radius:8px;background:#17242b;color:#ffe9ad;font-weight:900}.error{min-height:1.3em;color:#ffb3a6;font-weight:700}
[hidden]{display:none!important}
@media (orientation:landscape) and (max-height:540px){.screen{background-position:center 46%;padding-bottom:max(20px,env(safe-area-inset-bottom))}.entry{padding-bottom:4px}.auth-link{font-size:clamp(24px,4vw,38px)}}
@media (max-width:420px){.auth-link{font-size:30px}}
</style>
</head>
<body>
<main class="screen" aria-label="Shaelvien startup">
 <div id="entry" class="entry">
  <button id="discord" class="auth-link" type="button">Continue with Discord</button>
 </div>
</main>
<p id="status" class="status" role="status" aria-live="polite"></p>
<section id="terms-wrap" class="terms-wrap" hidden aria-label="Terms agreement">
 <form id="terms-form" class="terms-card">
  <h1>Before You Play</h1>
  <p>Your Discord account is verified. You can finish or change your player profile inside Shaelvien.</p>
  <label class="terms-check"><input id="terms" type="checkbox"><span>I agree to the Terms and Privacy Policy.</span></label>
  <p id="terms-error" class="error" role="alert"></p>
  <button id="terms-save" class="continue" type="submit">Agree & Enter Shaelvien</button>
 </form>
</section>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),status=$('status'),entry=$('entry'),termsWrap=$('terms-wrap'),termsForm=$('terms-form');
const profileKey='account/profile.json',cookieName='rist_session';
let api='',token='',authProfile=null,busy=false,currentProfile=null;
const say=m=>status.textContent=m||'';
const setCookie=t=>document.cookie=`${cookieName}=${encodeURIComponent(t)}; Path=/; Max-Age=28800; Secure; SameSite=Lax`;
const clearCookie=()=>{document.cookie=`${cookieName}=; Path=/; Max-Age=0; Secure; SameSite=Lax`;document.cookie=`${cookieName}=; Path=/Game/; Max-Age=0; Secure; SameSite=Lax`;};
async function getApi(){if(api)return api;const r=await fetch('./auth-config.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Account service configuration is unavailable.');const c=await r.json();api=(c.apiBaseUrl||'').replace(/\/$/,'');if(!api)throw new Error('Account service configuration is incomplete.');return api;}
async function apiFetch(path,opts={}){const base=await getApi();const h=new Headers(opts.headers||{});if(token)h.set('Authorization','Bearer '+token);return fetch(base+path,{...opts,headers:h,cache:'no-store'});}
async function verify(){if(!token)return false;const r=await apiFetch('/me');if(!r.ok)return false;authProfile=await r.json();return true;}
async function loadProfile(){const r=await apiFetch('/storage/download?key='+encodeURIComponent(profileKey));if(r.status===404)return null;if(!r.ok)throw new Error('Your RIST account could not be checked.');const p=await r.json();if(!p?.url)return null;const f=await fetch(p.url,{cache:'no-store'});if(f.status===404)return null;if(!f.ok)throw new Error('Your RIST account could not be checked.');return f.json();}
async function saveProfile(data){const prep=await apiFetch('/storage/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:profileKey,contentType:'application/json'})});if(!prep.ok)throw new Error('Your agreement could not be saved.');const post=await prep.json();if(!post?.url||!post?.fields)throw new Error('Account storage is unavailable.');const form=new FormData();Object.entries(post.fields).forEach(([k,v])=>form.append(k,v));form.append('file',new Blob([JSON.stringify(data)],{type:'application/json'}),'profile.json');const u=await fetch(post.url,{method:'POST',body:form});if(!u.ok)throw new Error('Your agreement could not be saved.');}
function hasAcceptedTerms(p){return !!(p&&(p.TermsAcceptedAtUtc||p.termsAcceptedAtUtc));}
function enterGame(){if(busy)return;busy=true;setCookie(token);sessionStorage.setItem('rist.session',token);sessionStorage.setItem('rist.lastActivity',String(Date.now()));sessionStorage.setItem('rist.launch.intent','load');sessionStorage.setItem('rist.launch.settings',JSON.stringify({role:'Roleplayer',domain:'Shaelvien MMO'}));say('Entering Shaelvien…');location.replace('/Game/index.html');}
function showTerms(profile){currentProfile=profile||null;entry.hidden=true;termsWrap.hidden=false;say('');setTimeout(()=>$('terms').focus(),50);}
async function continueAuthenticated(){currentProfile=await loadProfile();if(hasAcceptedTerms(currentProfile)){enterGame();return;}showTerms(currentProfile);busy=false;}
async function begin(){if(busy)return;busy=true;try{say('Opening secure Discord login…');const base=await getApi();location.href=base+'/auth/login';}catch(e){busy=false;say(e?.message||'Unable to start authentication.');}}
async function handoff(code){say('Completing secure Discord sign in…');const base=await getApi();const r=await fetch(base+'/auth/session?handoff='+encodeURIComponent(code),{cache:'no-store'});if(!r.ok)throw new Error('The sign-in handoff expired. Please try again.');const p=await r.json();if(!p.sessionToken)throw new Error('The account service returned an invalid session.');token=p.sessionToken;sessionStorage.setItem('rist.session',token);sessionStorage.setItem('rist.lastActivity',String(Date.now()));setCookie(token);if(!(await verify()))throw new Error('Your authenticated session could not be verified.');await continueAuthenticated();}
$('discord').onclick=begin;
termsForm.onsubmit=async e=>{e.preventDefault();const err=$('terms-error');err.textContent='';if(!$('terms').checked){err.textContent='You must agree to the Terms and Privacy Policy before playing.';return;}const b=$('terms-save');b.disabled=true;b.textContent='Saving…';try{const now=new Date().toISOString();const fallback=(authProfile?.displayName||authProfile?.DisplayName||'Player').trim().slice(0,32)||'Player';const existing=currentProfile&&typeof currentProfile==='object'?currentProfile:{};const data={...existing,AccountId:existing.AccountId||existing.accountId||crypto.randomUUID(),PlayerAlias:existing.PlayerAlias||existing.playerAlias||fallback,Plan:existing.Plan||existing.plan||'player',CreatedAtUtc:existing.CreatedAtUtc||existing.createdAtUtc||now,TermsAcceptedAtUtc:now,TermsVersion:existing.TermsVersion||existing.termsVersion||'2026-08-30',ContentAccess:existing.ContentAccess??existing.contentAccess??null};await saveProfile(data);currentProfile=data;enterGame();}catch(x){err.textContent=x?.message||'Your agreement could not be saved.';b.disabled=false;b.textContent='Agree & Enter Shaelvien';}};
(async()=>{try{const q=new URLSearchParams(location.search),h=q.get('rist_handoff');if(h){history.replaceState(null,'',location.pathname);await handoff(h);return;}const saved=sessionStorage.getItem('rist.session');if(saved){token=saved;if(await verify()){await continueAuthenticated();return;}sessionStorage.removeItem('rist.session');sessionStorage.removeItem('rist.lastActivity');clearCookie();token='';}}catch(e){clearCookie();sessionStorage.removeItem('rist.session');token='';entry.hidden=false;termsWrap.hidden=true;busy=false;say(e?.message||'Authentication could not be completed.');}})();
})();
</script>
</body>
</html>
