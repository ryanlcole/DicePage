<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="color-scheme" content="dark">
 <title>Shaelvien — RIST</title>
 <style>
  :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f3ead0;background:#030608}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#030608}
  body{min-height:100dvh;overflow:hidden}
  button,input,select{font:inherit}
  .screen{position:fixed;inset:0;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));background:
   radial-gradient(circle at 18% 26%,rgba(66,112,128,.3),transparent 33%),
   radial-gradient(circle at 82% 72%,rgba(145,61,34,.28),transparent 35%),
   linear-gradient(120deg,#071117 0 49.8%,#160b08 50.2% 100%)}
  .screen::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 48.8%,rgba(238,201,115,.15) 50%,transparent 51.2%);pointer-events:none}
  .screen::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.66) 100%);pointer-events:none}
  .panel{position:relative;z-index:1;width:min(92vw,560px);padding:30px 28px 26px;border:1px solid rgba(193,158,79,.64);border-radius:14px;background:rgba(3,8,11,.86);box-shadow:0 24px 70px rgba(0,0,0,.62),inset 0 1px rgba(255,255,255,.04);text-align:center}
  .panel.title-panel{background:rgba(3,8,11,.36);border-color:rgba(227,201,126,.36);backdrop-filter:blur(3px)}
  .brand{margin:0;color:#e3c97e;font-weight:950;letter-spacing:.2em;font-size:clamp(28px,8vw,58px);text-shadow:0 2px 18px #000}
  .subtitle{margin:5px 0 24px;color:#c7d0d3;font-weight:800;letter-spacing:.12em;font-size:clamp(12px,2.7vw,16px)}
  .prompt{margin:0 0 18px;color:#d7dfe1;line-height:1.5}
  .continue-prompt{display:inline-block;margin-top:32px;padding:12px 18px;border:0;background:transparent;color:#f1dfaa;font-weight:900;letter-spacing:.08em;cursor:pointer;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.56}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.continue-prompt{animation:none}}
  .actions{display:grid;gap:11px;margin-top:18px}
  .actions button{min-height:52px;border:1px solid #9a7b3c;border-radius:8px;background:#152229;color:#f1dfaa;font-weight:900;letter-spacing:.02em;cursor:pointer;touch-action:manipulation}
  .actions button.secondary{border-color:#516069;background:#0d151a;color:#d9e1e4}
  .actions button:disabled{opacity:.45;cursor:default}
  .actions button:focus-visible,input:focus-visible,select:focus-visible,.continue-prompt:focus-visible,.choice:focus-visible{outline:3px solid #f0d07d;outline-offset:3px}
  .signup,.settings{display:grid;gap:14px;text-align:left}
  .signup label:not(.check),.settings fieldset{display:grid;gap:8px;color:#dac681;font-weight:800}
  .signup input[type=text],.signup select{width:100%;min-height:46px;padding:10px 11px;border:1px solid #54646c;border-radius:7px;background:#071015;color:#f1f5f6}
  .check{display:flex;gap:10px;align-items:flex-start;color:#d3dadd;line-height:1.4}.check input{margin-top:4px;transform:scale(1.15)}
  fieldset{margin:0;padding:14px;border:1px solid #44545c;border-radius:8px}
  legend{padding:0 6px;color:#e3c97e}
  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .choice{position:relative;display:grid;place-items:center;min-height:50px;padding:9px;border:1px solid #53636a;border-radius:8px;background:#0d151a;color:#dbe2e5;text-align:center;cursor:pointer}
  .choice input{position:absolute;opacity:0;pointer-events:none}
  .choice:has(input:checked){border-color:#c39a47;background:#1b292f;color:#f1dfaa;box-shadow:inset 0 0 0 1px rgba(227,201,126,.2)}
  .welcome-title,.menu-title{margin:0 0 8px;color:#e3c97e;font-size:clamp(22px,5vw,32px)}
  .menu-meta{margin:0;color:#9fb0b8;font-size:13px}
  .error{min-height:1.4em;margin:14px 0 0;color:#ffb6aa;font-weight:800}
  .status{margin:10px 0 0;color:#9fb0b8;font-size:13px}
  .desktop-back{display:none;position:absolute;z-index:2;left:max(18px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top));min-width:46px;min-height:46px;border:1px solid rgba(227,201,126,.45);border-radius:50%;background:rgba(3,8,11,.7);color:#f1dfaa;font-size:24px;cursor:pointer}
  @media (hover:hover) and (pointer:fine){.desktop-back.visible{display:block}}
  [hidden]{display:none!important}
 </style>
</head>
<body>
 <main class="screen" aria-label="Shaelvien startup">
  <button id="desktop-back" class="desktop-back" type="button" aria-label="Go back">←</button>

  <section id="intro" class="panel title-panel">
   <h1 class="brand">SHAELVIEN</h1>
   <p class="subtitle">RIST MMO / SANDBOX</p>
   <button id="continue" class="continue-prompt" type="button">Press any key to continue…</button>
  </section>

  <section id="launcher" class="panel" hidden>
   <h1 class="brand">SHAELVIEN</h1>
   <p class="subtitle">RIST MMO / SANDBOX</p>

   <div id="entry" hidden>
    <p class="prompt">Sign in or create an account to continue.</p>
    <div class="actions">
     <button id="signin" type="button">Sign In</button>
     <button id="signup-open" type="button" class="secondary">Sign Up</button>
    </div>
   </div>

   <form id="signup" class="signup" hidden>
    <label>Handle<input id="handle" type="text" maxlength="32" autocomplete="nickname" required></label>
    <label>Plan<select id="plan"><option value="player">Roleplayer</option><option value="gm-player">GameMaster + Roleplayer</option></select></label>
    <label class="check"><input id="agreements" type="checkbox"><span>I agree to the current account terms and community agreements.</span></label>
    <div class="actions">
     <button id="signup-back" type="button" class="secondary">Back</button>
     <button type="submit">Continue…</button>
    </div>
   </form>

   <div id="welcome" hidden>
    <h2 class="welcome-title">Welcome to Shaelvien</h2>
    <p id="welcome-copy" class="prompt">Your account is ready.</p>
    <div class="actions"><button id="welcome-continue" type="button">Continue</button></div>
   </div>

   <div id="menu" hidden>
    <h2 class="menu-title">Start</h2>
    <p id="menu-meta" class="menu-meta"></p>
    <div class="actions">
     <button id="new-campaign" type="button">New Campaign</button>
     <button id="load-campaign" type="button">Load Campaign</button>
     <button id="settings-open" type="button" class="secondary">Settings</button>
    </div>
   </div>

   <form id="settings" class="settings" hidden>
    <fieldset>
     <legend>Role</legend>
     <div class="choice-grid">
      <label class="choice"><input type="radio" name="role" value="GameMaster">GameMaster</label>
      <label class="choice"><input type="radio" name="role" value="Roleplayer">Roleplayer</label>
     </div>
    </fieldset>
    <fieldset>
     <legend>Domain</legend>
     <div class="choice-grid">
      <label class="choice"><input type="radio" name="domain" value="Shaelvien MMO">Shaelvien MMO</label>
      <label class="choice"><input type="radio" name="domain" value="RIST">RIST</label>
     </div>
    </fieldset>
    <div class="actions"><button id="settings-back" type="button">Done</button></div>
   </form>

   <p id="error" class="error" role="alert" aria-live="polite"></p>
   <p id="status" class="status" aria-live="polite"></p>
  </section>
 </main>
 <script>
 (()=>{
  'use strict';
  const $=id=>document.getElementById(id);
  const intro=$('intro'),launcher=$('launcher'),entry=$('entry'),signup=$('signup'),welcome=$('welcome'),menu=$('menu'),settings=$('settings');
  const error=$('error'),status=$('status'),desktopBack=$('desktop-back');
  const views={entry,signup,welcome,menu,settings};
  const game='/Game/index.html';
  const cookieName='rist_session';
  const settingsKey='rist.launcher.settings';
  const signupDraftKey='rist.signup.draft';
  const defaultSettings={role:'Roleplayer',domain:'Shaelvien MMO'};
  let api='',authenticated=false,currentView='entry';

  const setCookie=token=>{document.cookie=`${cookieName}=${encodeURIComponent(token)}; Path=/Game/; Max-Age=28800; Secure; SameSite=Lax`};
  const clearCookie=()=>{document.cookie=`${cookieName}=; Path=/Game/; Max-Age=0; Secure; SameSite=Lax`};
  const readSettings=()=>{
   try{
    const value=JSON.parse(localStorage.getItem(settingsKey)||'null');
    return {
     role:value?.role==='GameMaster'?'GameMaster':'Roleplayer',
     domain:value?.domain==='RIST'?'RIST':'Shaelvien MMO'
    };
   }catch{return {...defaultSettings}}
  };
  const writeSettings=value=>localStorage.setItem(settingsKey,JSON.stringify(value));
  const updateMenuMeta=()=>{const s=readSettings();$('menu-meta').textContent=`${s.domain} · ${s.role}`};
  const setView=name=>{
   currentView=name;
   Object.entries(views).forEach(([key,node])=>node.hidden=key!==name);
   desktopBack.classList.toggle('visible',name==='signup'||name==='settings');
   error.textContent='';status.textContent='';
   if(name==='menu')updateMenuMeta();
  };
  const showLauncher=name=>{intro.hidden=true;launcher.hidden=false;setView(name)};
  const advanceIntro=()=>{
   if(intro.hidden)return;
   showLauncher(authenticated?'menu':'entry');
  };

  async function config(){
   if(api)return api;
   const r=await fetch('./auth-config.json',{cache:'no-store'});
   if(!r.ok)throw new Error('Account service configuration is unavailable.');
   const c=await r.json();api=(c.apiBaseUrl||'').replace(/\/$/,'');
   if(!api)throw new Error('Account service configuration is incomplete.');
   return api;
  }
  async function verify(token){
   const base=await config();
   const r=await fetch(base+'/me',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
   return r.ok;
  }
  async function completeHandoff(handoff){
   intro.hidden=true;launcher.hidden=false;setView('entry');status.textContent='Completing secure sign in…';
   const base=await config();
   const r=await fetch(base+'/auth/session?handoff='+encodeURIComponent(handoff),{cache:'no-store'});
   if(!r.ok)throw new Error('The sign-in handoff expired. Please sign in again.');
   const p=await r.json();
   if(!p.sessionToken)throw new Error('The account service returned an invalid session.');
   sessionStorage.setItem('rist.session',p.sessionToken);
   sessionStorage.setItem('rist.lastActivity',String(Date.now()));
   setCookie(p.sessionToken);authenticated=true;
   history.replaceState(null,'',location.pathname);
   const draft=sessionStorage.getItem(signupDraftKey);
   if(draft){
    let handle='';try{handle=JSON.parse(draft)?.handle||''}catch{}
    $('welcome-copy').textContent=handle?`Welcome, ${handle}. Your account is ready.`:'Your account is ready.';
    setView('welcome');
   }else setView('menu');
  }
  async function resume(){
   const token=sessionStorage.getItem('rist.session');
   if(!token)return false;
   try{
    if(await verify(token)){
     setCookie(token);authenticated=true;
     if(intro.hidden&&currentView==='entry')setView('menu');
     return true;
    }
   }catch{}
   sessionStorage.removeItem('rist.session');sessionStorage.removeItem('rist.lastActivity');clearCookie();
   return false;
  }
  async function begin(intent){
   error.textContent='';
   try{
    const base=await config();
    sessionStorage.setItem('rist.auth.intent',intent);
    location.assign(base+'/auth/login');
   }catch(e){error.textContent=e?.message||'Unable to start sign in.'}
  }
  function openSettings(){
   const saved=readSettings();
   settings.querySelector(`input[name="role"][value="${saved.role}"]`).checked=true;
   settings.querySelector(`input[name="domain"][value="${saved.domain}"]`).checked=true;
   setView('settings');
  }
  function saveSettings(){
   const role=settings.querySelector('input[name="role"]:checked')?.value||defaultSettings.role;
   const domain=settings.querySelector('input[name="domain"]:checked')?.value||defaultSettings.domain;
   writeSettings({role,domain});setView('menu');
  }
  function launch(intent){
   if(!authenticated){setView('entry');return}
   const selected=readSettings();
   sessionStorage.setItem('rist.launch.intent',intent);
   sessionStorage.setItem('rist.launch.settings',JSON.stringify(selected));
   sessionStorage.setItem('rist.lastActivity',String(Date.now()));
   location.assign(game);
  }

  $('continue').addEventListener('click',advanceIntro);
  document.addEventListener('keydown',e=>{if(!intro.hidden){e.preventDefault();advanceIntro()}});
  $('signin').addEventListener('click',()=>begin('login'));
  $('signup-open').addEventListener('click',()=>{setView('signup');$('handle').focus()});
  $('signup-back').addEventListener('click',()=>setView('entry'));
  desktopBack.addEventListener('click',()=>currentView==='settings'?setView('menu'):setView('entry'));
  signup.addEventListener('submit',e=>{
   e.preventDefault();
   const handle=$('handle').value.trim();
   if(handle.length<1||handle.length>32){error.textContent='Enter a handle from 1 to 32 characters.';return}
   if(!$('agreements').checked){error.textContent='Accept the agreements before continuing.';return}
   sessionStorage.setItem(signupDraftKey,JSON.stringify({handle,plan:$('plan').value==='gm-player'?'gm-player':'player',agreedAt:new Date().toISOString()}));
   begin('signup');
  });
  $('welcome-continue').addEventListener('click',()=>{sessionStorage.removeItem(signupDraftKey);setView('menu')});
  $('new-campaign').addEventListener('click',()=>launch('new'));
  $('load-campaign').addEventListener('click',()=>launch('load'));
  $('settings-open').addEventListener('click',openSettings);
  $('settings-back').addEventListener('click',saveSettings);
  settings.addEventListener('change',()=>{
   const role=settings.querySelector('input[name="role"]:checked')?.value||defaultSettings.role;
   const domain=settings.querySelector('input[name="domain"]:checked')?.value||defaultSettings.domain;
   writeSettings({role,domain});
  });

  (async()=>{
   try{
    const q=new URLSearchParams(location.search),handoff=q.get('rist_handoff');
    if(handoff){await completeHandoff(handoff);return}
    authenticated=await resume();
   }catch(e){clearCookie();authenticated=false;status.textContent='';error.textContent=e?.message||'Unable to complete sign in.'}
  })();
 })();
 </script>
</body>
</html>
