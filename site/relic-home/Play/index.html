<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#05070d"><title>Shaelvien — RIST MMO / Sandbox</title><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#05070d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#05070d}body{min-height:100dvh;overflow:hidden}.screen{position:fixed;inset:0;background:#05070d;display:flex;align-items:center;justify-content:center;padding:24px}.entry{text-align:center}.entry h1{color:#d7be80;margin:0 0 24px}.auth-link{appearance:none;border:1px solid #8d7440;border-radius:10px;background:#17242b;color:#ffe9ad;font:900 clamp(22px,5vw,34px)/1 system-ui;padding:16px 22px;cursor:pointer}.status{position:fixed;left:20px;right:20px;bottom:max(16px,env(safe-area-inset-bottom));margin:0;text-align:center;color:#f3dfaa;font:700 13px/1.35 system-ui}</style></head><body><main class="screen"><div class="entry"><h1>SHAELVIEN<br><small>RIST MMO / Sandbox</small></h1><button id="discord" class="auth-link" type="button">Continue with Discord</button></div></main><p id="status" class="status" role="status" aria-live="polite"></p><script>(()=>{'use strict';const status=document.getElementById('status'),button=document.getElementById('discord');const cookieName='rist_session',profileKey='account/profile.json';let api='',busy=false;const say=m=>status.textContent=m||'';const setCookie=t=>document.cookie=`${cookieName}=${encodeURIComponent(t)}; Path=/; Max-Age=28800; Secure; SameSite=Lax`;async function getApi(){if(api)return api;const r=await fetch('./auth-config.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Account service configuration is unavailable.');const c=await r.json();api=(c.apiBaseUrl||'').replace(/\/$/,'');if(!api)throw new Error('Account service configuration is incomplete.');return api}async function authFetch(base,token,path,opts={}){const h=new Headers(opts.headers||{});h.set('Authorization','Bearer '+token);return fetch(base+path,{...opts,headers:h,cache:'no-store'})}async function readProfile(base,token){const r=await authFetch(base,token,'/storage/download?key='+encodeURIComponent(profileKey));if(r.status===404)return null;if(!r.ok)throw new Error('Your account could not be checked.');const p=await r.json();if(!p?.url)return null;const f=await fetch(p.url,{cache:'no-store'});if(f.status===404)return null;if(!f.ok)throw new Error('Your account could not be checked.');return f.json()}async function writeProfile(base,token,data){const prep=await authFetch(base,token,'/storage/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:profileKey,contentType:'application/json'})});if(!prep.ok)throw new Error('Your account could not be prepared.');const post=await prep.json();const form=new FormData();Object.entries(post.fields||{}).forEach(([k,v])=>form.append(k,v));form.append('file',new Blob([JSON.stringify(data)],{type:'application/json'}),'profile.json');const u=await fetch(post.url,{method:'POST',body:form});if(!u.ok)throw new Error('Your account could not be prepared.')}async function ensureAccount(base,token,me){if(await readProfile(base,token))return;const now=new Date().toISOString(),alias=(me?.displayName||me?.DisplayName||'Player').trim().slice(0,32)||'Player';await writeProfile(base,token,{AccountId:crypto.randomUUID(),PlayerAlias:alias,Plan:'player',CreatedAtUtc:now,TermsAcceptedAtUtc:'0001-01-01T00:00:00+00:00',TermsVersion:'',ContentAccess:null})}function enter(token){sessionStorage.setItem('rist.session',token);sessionStorage.setItem('rist.lastActivity',String(Date.now()));setCookie(token);say('Entering Shaelvien…');location.replace('/Game/index.html')}async function completeToken(base,token){const r=await authFetch(base,token,'/me');if(!r.ok)throw new Error('Your authenticated session could not be verified.');await ensureAccount(base,token,await r.json());enter(token)}async function begin(){if(busy)return;busy=true;try{say('Opening secure Discord login…');location.href=(await getApi())+'/auth/login'}catch(e){busy=false;say(e?.message||'Unable to start authentication.')}}async function handoff(code){say('Completing secure Discord sign in…');const base=await getApi(),r=await fetch(base+'/auth/session?handoff='+encodeURIComponent(code),{cache:'no-store'});if(!r.ok)throw new Error('The sign-in handoff expired. Please try again.');const p=await r.json();if(!p.sessionToken)throw new Error('The account service returned an invalid session.');await completeToken(base,p.sessionToken)}button.onclick=begin;(async()=>{try{const q=new URLSearchParams(location.search),h=q.get('rist_handoff');if(h){history.replaceState(null,'',location.pathname);await handoff(h);return}const saved=sessionStorage.getItem('rist.session');if(saved){await completeToken(await getApi(),saved)}}catch(e){sessionStorage.removeItem('rist.session');sessionStorage.removeItem('rist.lastActivity');busy=false;say(e?.message||'Authentication could not be completed.')}})()})();</script></body></html>
