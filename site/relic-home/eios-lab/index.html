<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="color-scheme" content="dark">
<title>EIOS Lab</title>
<style>
:root{--bg:#050705;--panel:#0a0e0a;--line:#203620;--fg:#ddffdd;--muted:#7ea37e;--hot:#9dff9d;--warn:#ffd889;--bad:#ff9d9d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
button,input,select{font:inherit}button{background:#0f170f;color:var(--fg);border:1px solid #315331;border-radius:8px;padding:.72rem .85rem}button:active{transform:translateY(1px)}button:disabled{opacity:.55}
input,select{width:100%;background:#020402;color:var(--hot);border:1px solid #315331;border-radius:8px;padding:.75rem;outline:none}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}header{display:flex;gap:.6rem;align-items:center;padding:max(.55rem,env(safe-area-inset-top)) .7rem .55rem;border-bottom:1px solid var(--line);background:#070a07}
.brand{font-weight:700;letter-spacing:.08em}.sub{color:var(--muted);font-size:.8rem}.spacer{flex:1}.pill{font-size:.72rem;border:1px solid var(--line);padding:.25rem .45rem;border-radius:999px;color:var(--muted)}
main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px}#stageWrap{position:relative;overflow:hidden;background:#000}#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#camera{position:absolute;right:.7rem;top:.7rem;width:min(31vw,220px);max-height:28vh;object-fit:cover;border:1px solid var(--line);border-radius:10px;background:#020402;display:none}
#caption{position:absolute;left:.7rem;right:.7rem;bottom:.7rem;max-width:760px;margin:auto;background:rgba(0,0,0,.78);border:1px solid var(--line);border-radius:10px;padding:.65rem .75rem;min-height:2.4rem;backdrop-filter:blur(4px)}
#side{border-left:1px solid var(--line);background:var(--panel);padding:.7rem;overflow:auto}section{border:1px solid var(--line);border-radius:10px;padding:.65rem;margin-bottom:.65rem}.title{color:var(--hot);margin-bottom:.5rem}.kv{display:grid;grid-template-columns:1fr auto;gap:.22rem .6rem;font-size:.78rem}.k{color:var(--muted)}
#results{display:grid;gap:.45rem}.result{border:1px solid #294329;border-radius:8px;padding:.55rem;background:#070b07}.result b{color:var(--hot)}.result small{color:var(--muted)}#log{white-space:pre-wrap;font-size:.72rem;color:#a4c3a4;max-height:180px;overflow:auto;margin:0}
.row{display:flex;gap:.45rem}.row>*{min-width:0}.grow{flex:1}.hidden{display:none!important}.warn{color:var(--warn)}.bad{color:var(--bad)}
footer{display:grid;grid-template-columns:1fr auto;gap:.45rem;padding:.55rem .65rem max(.55rem,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#070a07}#query{font-size:16px}
#ioMeter{height:5px;background:#132013;border-radius:999px;overflow:hidden;margin-top:.45rem}#ioBar{height:100%;width:0;background:var(--hot)}
@media(max-width:760px){main{grid-template-columns:1fr}#side{position:absolute;z-index:5;right:.55rem;top:3.3rem;width:min(88vw,360px);max-height:70vh;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 40px #000;display:none}#side.open{display:block}header .sub{display:none}}
</style>
</head>
<body>
<div id="app">
<header>
  <div><div class="brand">EIOS LAB</div><div class="sub">semantic I/O endpoint · experimental</div></div>
  <span class="pill" id="modePill">BOOT</span>
  <span class="pill" id="netPill">0 B ↕</span>
  <div class="spacer"></div>
  <button id="ioBtn">Start I/O</button>
  <button id="panelBtn">Panel</button>
</header>
<main>
  <div id="stageWrap">
    <canvas id="stage"></canvas>
    <video id="camera" autoplay muted playsinline></video>
    <div id="caption">EIOS loading semantic bridge…</div>
  </div>
  <aside id="side">
    <section>
      <div class="title">INPUT / OUTPUT</div>
      <div class="kv">
        <span class="k">orientation</span><span id="orient">—</span>
        <span class="k">touch</span><span id="touch">—</span>
        <span class="k">camera</span><span id="camState">off</span>
        <span class="k">microphone</span><span id="micState">off</span>
        <span class="k">updates</span><span id="updates">0</span>
      </div>
      <div id="ioMeter"><div id="ioBar"></div></div>
    </section>
    <section>
      <div class="title">INTELLIGENCE</div>
      <div class="kv">
        <span class="k">bridge</span><span id="bridgeState">loading</span>
        <span class="k">provider</span><span id="providerState">—</span>
        <span class="k">model</span><span id="modelState">—</span>
        <span class="k">latency</span><span id="latencyState">—</span>
        <span class="k">last vision</span><span id="visionState">—</span>
      </div>
      <div style="margin-top:.6rem">
        <select id="source">
          <option value="ai">AI · semantic agent</option>
          <option value="ai_search">Public search → AI</option>
          <option value="public">Public search only</option>
          <option value="local">Local EI only</option>
        </select>
      </div>
    </section>
    <section>
      <div class="title">PERCEPTION</div>
      <div id="results"><div class="result"><small>Waiting for semantic input.</small></div></div>
    </section>
    <section>
      <div class="title">PACKETS</div>
      <pre id="log"></pre>
    </section>
  </aside>
</main>
<footer>
  <input id="query" autocomplete="off" enterkeyhint="send" placeholder="Ask EIOS…">
  <button id="sendBtn">Send</button>
</footer>
</div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id), canvas=$('stage'), ctx=canvas.getContext('2d',{alpha:false});
const encoder=new TextEncoder();
let dpr=Math.min(devicePixelRatio||1,2), tilt={a:0,b:0,g:0}, pointer={x:.5,y:.5,down:false};
let bytesOut=0,bytesIn=0,updates=0,stream=null,audioCtx=null,analyser=null,busy=false,bridge=null;
let scene={accent:'#9dff9d',dot:{x:.5,y:.5},marks:[],cards:[]};

function sizeOf(v){try{return encoder.encode(typeof v==='string'?v:JSON.stringify(v)).length}catch{return 0}}
function fmt(n){return n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(1)} MB`}
function logPacket(dir,obj,actualBytes){const n=actualBytes??sizeOf(obj);if(dir==='>')bytesOut+=n;else bytesIn+=n;$('netPill').textContent=`${fmt(bytesOut+bytesIn)} ↕`;let display=obj;if(obj?.frame)display={...obj,frame:`[jpeg ${fmt(sizeOf(obj.frame))}]`};const line=`${new Date().toISOString().slice(11,23)} ${dir} ${typeof display==='string'?display:JSON.stringify(display)}`;$('log').textContent=(line+'\n'+$('log').textContent).slice(0,8000)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setCaption(t){$('caption').textContent=t||''}
function speak(t){if(!t||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).slice(0,500));u.rate=1;speechSynthesis.speak(u)}catch{}}
function resize(){const r=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));draw()}
function lineArrow(x1,y1,x2,y2,label){const w=canvas.width,h=canvas.height,a=x1*w,b=y1*h,c=x2*w,d=y2*h;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();const ang=Math.atan2(d-b,c-a),sz=10*dpr;ctx.beginPath();ctx.moveTo(c,d);ctx.lineTo(c-Math.cos(ang-.55)*sz,d-Math.sin(ang-.55)*sz);ctx.moveTo(c,d);ctx.lineTo(c-Math.cos(ang+.55)*sz,d-Math.sin(ang+.55)*sz);ctx.stroke();if(label)ctx.fillText(label,c+6*dpr,d-6*dpr)}
function drawMark(m){const w=canvas.width,h=canvas.height;ctx.save();ctx.strokeStyle=scene.accent||'#9dff9d';ctx.fillStyle=scene.accent||'#9dff9d';ctx.lineWidth=2*dpr;ctx.font=`${11*dpr}px ui-monospace,monospace`;if(m.kind==='circle'){ctx.beginPath();ctx.arc(m.x*w,m.y*h,(m.r||.06)*Math.min(w,h),0,Math.PI*2);ctx.stroke();if(m.label)ctx.fillText(m.label,m.x*w+8*dpr,m.y*h-8*dpr)}else if(m.kind==='box'){ctx.strokeRect(m.x*w,m.y*h,m.w*w,m.h*h);if(m.label)ctx.fillText(m.label,m.x*w+4*dpr,m.y*h+13*dpr)}else if(m.kind==='arrow'){lineArrow(m.x1,m.y1,m.x2,m.y2,m.label)}ctx.restore()}
function draw(){const w=canvas.width,h=canvas.height;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#020302';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#132213';ctx.lineWidth=dpr;const gap=44*dpr;for(let x=0;x<w;x+=gap){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=gap){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
 const ox=(tilt.g/90)*w*.16,oy=(tilt.b/90)*h*.16,x=Math.max(22*dpr,Math.min(w-22*dpr,(scene.dot?.x??pointer.x)*w+ox)),y=Math.max(22*dpr,Math.min(h-22*dpr,(scene.dot?.y??pointer.y)*h+oy));ctx.shadowBlur=20*dpr;ctx.shadowColor=scene.accent;ctx.fillStyle=scene.accent;ctx.beginPath();ctx.arc(x,y,8*dpr,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;(scene.marks||[]).forEach(drawMark);ctx.fillStyle='#a9cca9';ctx.font=`${12*dpr}px ui-monospace,monospace`;ctx.fillText(`β ${tilt.b.toFixed(1)}°  γ ${tilt.g.toFixed(1)}°`,12*dpr,20*dpr)}
function renderScene(s,meta){if(!s)return;scene={...scene,...s,marks:Array.isArray(s.marks)?s.marks:scene.marks};updates++;$('updates').textContent=updates;if(s.caption)setCaption(s.caption);if(s.speak)speak(s.speak);if(Array.isArray(s.cards)){$('results').innerHTML=s.cards.length?s.cards.slice(0,6).map(c=>`<div class="result"><b>${esc(c.title||'Result')}</b><div>${esc(c.text||'')}</div></div>`).join(''):'<div class="result"><small>No result cards.</small></div>'}if(meta){$('providerState').textContent=meta.provider||'—';$('modelState').textContent=(meta.model||'—').replace('us.amazon.','');$('latencyState').textContent=meta.latencyMs?`${meta.latencyMs} ms`:'—';$('visionState').textContent=meta.vision?'yes':'no'}draw()}
function sensorSnapshot(){return{orientation:{alpha:+tilt.a.toFixed(2),beta:+tilt.b.toFixed(2),gamma:+tilt.g.toFixed(2)},pointer:{x:+pointer.x.toFixed(4),y:+pointer.y.toFixed(4),down:pointer.down},viewport:{w:innerWidth,h:innerHeight,dpr:devicePixelRatio||1}}}
function wantsVision(q,kind){return kind==='interaction'||/(see|look|camera|image|picture|what is this|what am i looking|describe this|in front of me)/i.test(q||'')}
function captureFrame(){const v=$('camera');if(!stream||v.readyState<2||!v.videoWidth)return null;const maxW=480,scale=Math.min(1,maxW/v.videoWidth),w=Math.max(1,Math.round(v.videoWidth*scale)),h=Math.max(1,Math.round(v.videoHeight*scale));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);return c.toDataURL('image/jpeg',.52)}
async function loadBridge(){try{const r=await fetch('/eios-lab/eios-config.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('config '+r.status);bridge=await r.json();const statusUrl=bridge.apiBaseUrl+bridge.statusPath;const sr=await fetch(statusUrl,{cache:'no-store'});if(!sr.ok)throw new Error('status '+sr.status);const s=await sr.json();$('bridgeState').textContent='live';$('providerState').textContent=s.provider||bridge.provider||'—';$('modelState').textContent=(s.model||bridge.model||'—').replace('us.amazon.','');$('modePill').textContent='AI';$('source').value='ai';setCaption('EIOS AI bridge ready. Start I/O, ask a question, or tap the stage to interact.');logPacket('<',{kind:'bridge-ready',provider:s.provider,model:s.model},sizeOf(JSON.stringify(s)))}catch(e){$('bridgeState').textContent='offline';$('bridgeState').classList.add('bad');$('modePill').textContent='LOCAL';$('source').value='public';setCaption('AI bridge is not ready yet. Public search and local I/O still work.');logPacket('<',{kind:'bridge-offline',error:String(e.message||e)})}}
async function startIO(){const statuses=[];try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){statuses.push('orientation:'+await DeviceOrientationEvent.requestPermission())}else statuses.push('orientation:available')}catch{statuses.push('orientation:denied')}
 window.addEventListener('deviceorientation',e=>{tilt={a:e.alpha||0,b:e.beta||0,g:e.gamma||0};$('orient').textContent=`${tilt.b.toFixed(1)}, ${tilt.g.toFixed(1)}`;draw()},{passive:true});
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640}},audio:true});$('camera').srcObject=stream;$('camera').style.display='block';$('camState').textContent='live';$('micState').textContent='live';statuses.push('av:live');startMeter()}catch{statuses.push('av:unavailable');$('camState').textContent='unavailable';$('micState').textContent='unavailable'}
 $('ioBtn').textContent='I/O Live';$('ioBtn').disabled=true;logPacket('<',{kind:'io-ready',status:statuses});setCaption('I/O live. Tilt and touch are local; AI receives semantic snapshots only when you ask or tap.')}
function startMeter(){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=256;audioCtx.createMediaStreamSource(stream).connect(analyser);const data=new Uint8Array(analyser.frequencyBinCount);const tick=()=>{analyser.getByteFrequencyData(data);let sum=0;for(const v of data)sum+=v;$('ioBar').style.width=Math.min(100,(sum/data.length)*1.4)+'%';requestAnimationFrame(tick)};tick()}catch{}}
async function searchEvidence(q){const u='https://en.wikipedia.org/w/api.php?origin=*&action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=4&prop=extracts|info&exintro=1&explaintext=1&inprop=url&format=json',r=await fetch(u,{cache:'no-store'}),data=await r.json(),pages=Object.values(data.query?.pages||{}).sort((a,b)=>(a.index||0)-(b.index||0));const cards=pages.map(p=>({title:p.title,text:(p.extract||'').slice(0,450),url:p.fullurl||''}));return{cards,evidence:cards.map((c,i)=>`[${i+1}] ${c.title}\n${c.text}\n${c.url}`).join('\n\n')}}
async function publicSearch(q){const p={kind:'public-search',query:q,sensor:sensorSnapshot()};logPacket('>',p);setCaption(`Searching public knowledge for “${q}”…`);const {cards}=await searchEvidence(q);logPacket('<',{kind:'public-results',count:cards.length});const first=cards[0];renderScene({accent:'#9dff9d',caption:first?`${first.title}: ${first.text.slice(0,260)}`:`No public result for ${q}`,speak:first?`${first.title}. ${first.text.slice(0,320)}`:`No public result for ${q}`,cards})}
async function agentCall(kind,q,evidence='',forceVision=false){if(!bridge?.apiBaseUrl)throw new Error('AI bridge is not configured yet.');if(busy)return;busy=true;$('sendBtn').disabled=true;try{const frame=(forceVision||wantsVision(q,kind))?captureFrame():null,payload={kind,query:q,sensor:sensorSnapshot(),client:{name:'EIOS-Lab',protocol:2}};if(evidence)payload.evidence=evidence;if(frame)payload.frame=frame;logPacket('>',payload);setCaption(frame?'AI is perceiving the current frame…':'AI is interpreting semantic input…');const r=await fetch(bridge.apiBaseUrl+bridge.queryPath,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload),cache:'no-store'}),text=await r.text();logPacket('<',{kind:'agent-response',status:r.status},sizeOf(text));if(!r.ok)throw new Error(`AI ${r.status}: ${text.slice(0,180)}`);const data=JSON.parse(text);renderScene(data.scene||data,data.meta||{});$('modePill').textContent='AI'}finally{busy=false;$('sendBtn').disabled=false}}
async function localEI(q){const caption=/tilt/i.test(q)?`Current tilt β ${tilt.b.toFixed(1)}°, γ ${tilt.g.toFixed(1)}°.`:/touch/i.test(q)?`Last touch ${pointer.x.toFixed(3)}, ${pointer.y.toFixed(3)}.`:`Local EI received: ${q}`;logPacket('>',{kind:'local',query:q,sensor:sensorSnapshot()});renderScene({caption,speak:caption,cards:[{title:'Local EI',text:caption}]});$('modePill').textContent='LOCAL'}
async function send(){const q=$('query').value.trim();if(!q||busy)return;$('query').value='';const source=$('source').value;try{if(source==='ai')await agentCall('query',q);else if(source==='ai_search'){setCaption(`Searching, then asking AI about “${q}”…`);const found=await searchEvidence(q);await agentCall('search-query',q,found.evidence)}else if(source==='public')await publicSearch(q);else await localEI(q)}catch(e){setCaption(`EIOS error: ${e.message||e}`);$('results').innerHTML=`<div class="result bad">${esc(e.message||e)}</div>`;logPacket('<',{kind:'error',error:String(e.message||e)})}}
async function interact(){if(busy||!bridge?.apiBaseUrl||!['ai','ai_search'].includes($('source').value))return;try{await agentCall('interaction','Interpret this touch/tilt interaction. If a camera frame is present, use it as visual evidence and return a concise visual/spoken scene update.','',true)}catch(e){setCaption(`Interaction error: ${e.message||e}`)}}

$('ioBtn').onclick=startIO;$('panelBtn').onclick=()=> $('side').classList.toggle('open');$('sendBtn').onclick=send;$('query').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send()}});$('source').onchange=()=>{$('modePill').textContent=$('source').value.startsWith('ai')?'AI':$('source').value.toUpperCase()};
canvas.addEventListener('pointerdown',e=>{pointer.down=true;const r=canvas.getBoundingClientRect();pointer.x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));pointer.y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));scene.dot={x:pointer.x,y:pointer.y};$('touch').textContent=`${pointer.x.toFixed(2)}, ${pointer.y.toFixed(2)}`;draw();canvas.setPointerCapture?.(e.pointerId)},{passive:true});
canvas.addEventListener('pointermove',e=>{if(!pointer.down)return;const r=canvas.getBoundingClientRect();pointer.x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));pointer.y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));scene.dot={x:pointer.x,y:pointer.y};$('touch').textContent=`${pointer.x.toFixed(2)}, ${pointer.y.toFixed(2)}`;draw()},{passive:true});
canvas.addEventListener('pointerup',()=>{pointer.down=false;draw();interact()},{passive:true});
window.addEventListener('resize',resize,{passive:true});resize();loadBridge();
})();
</script>
</body>
</html>
