<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Open Reality | ReLiCGameMaster</title><meta name="description" content="Matter-first AI interface prototype."><style>:root{color-scheme:dark;--ink:#020609;--line:#21343d;--text:#e8f0f2;--muted:#8ea1aa;--hot:#b9f7d0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#world{position:fixed;inset:0;width:100%;height:100%;touch-action:none;background:radial-gradient(circle at 50% 45%,#0b161c 0,#03080b 55%,#010304 100%)}.hud{position:fixed;z-index:4;pointer-events:none}.brand{top:max(14px,env(safe-area-inset-top));left:16px}.brand b{display:block;font-size:clamp(17px,4vw,28px);letter-spacing:.14em}.brand small,.scale small{color:var(--muted)}.scale{top:max(16px,env(safe-area-inset-top));right:16px;text-align:right}.readout{bottom:max(84px,calc(env(safe-area-inset-bottom) + 76px));left:16px;color:var(--muted);font-size:11px}.readout strong{color:var(--hot)}.command{position:fixed;z-index:8;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,calc(100vw - 24px));display:flex;gap:8px;padding:7px;border:1px solid var(--line);border-radius:18px;background:#061016e8;backdrop-filter:blur(12px)}#intent{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);font:16px/1.3 inherit;padding:10px 12px}#intent::placeholder{color:#71868e}.command button{border:1px solid #31444e;background:#102129;color:var(--hot);border-radius:12px;padding:9px 14px;font:700 13px inherit}.object-actions{position:fixed;z-index:7;right:16px;bottom:92px;display:none;gap:6px;pointer-events:auto}.object-actions.show{display:flex}.object-actions button{border:1px solid #31444e;background:#071117dd;color:var(--text);border-radius:10px;padding:8px 10px;font:12px inherit}@media(max-width:650px){.scale{font-size:11px}.readout{font-size:9px}.object-actions{right:10px;bottom:86px}.object-actions button{padding:7px 8px}}</style></head><body><canvas id="world" aria-label="Open Reality"></canvas><div class="hud brand"><b>OPEN REALITY</b><small>PROTOTYPE · INTENT BECOMES MATTER</small></div><div class="hud scale"><strong id="scaleName">ROOM</strong><br><small>REV <span id="revision">000000</span></small></div><div class="hud readout"><strong id="selected">AWAKE</strong><br><span id="counts">touch, type, or speak</span></div><div id="objectActions" class="object-actions"><button id="save">Save</button><button id="sign">Sign</button><button id="clear">Dissolve</button></div><form id="command" class="command"><input id="intent" autocomplete="off" enterkeyhint="send" placeholder="Ask reality… e.g. make a paper that says Hello World"><button type="button" id="mic" aria-label="Speak">◉</button><button type="submit">Create</button></form><script src="os-prototype.js"></script></body></html>
