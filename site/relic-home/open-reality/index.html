<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Open Reality | ReLiCGameMaster</title><meta name="description" content="One persistent experimental reality built from matter."><style>
:root{color-scheme:dark;--ink:#020609;--line:#21343d;--text:#e8f0f2;--muted:#8ea1aa;--hot:#b9f7d0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#world{position:fixed;inset:0;width:100%;height:100%;touch-action:none;background:radial-gradient(circle at 50% 45%,#0b161c 0,#03080b 55%,#010304 100%)}.hud{position:fixed;z-index:4;pointer-events:none}.brand{top:max(14px,env(safe-area-inset-top));left:16px}.brand b{display:block;font-size:clamp(18px,4vw,30px);letter-spacing:.14em}.brand small,.scale small{color:var(--muted)}.scale{top:max(16px,env(safe-area-inset-top));right:16px;text-align:right}.controls{bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto;background:#061016cc;border:1px solid var(--line);border-radius:999px;padding:7px;backdrop-filter:blur(8px)}button{font:inherit;color:var(--text);background:#0c171d;border:1px solid #31444e;border-radius:999px;padding:10px 14px;cursor:pointer}button:hover,button:focus-visible{border-color:var(--hot);outline:none}.readout{bottom:max(78px,calc(env(safe-area-inset-bottom) + 70px));left:16px;color:var(--muted);font-size:12px}.readout strong{color:var(--hot)}.hint{bottom:max(78px,calc(env(safe-area-inset-bottom) + 70px));right:16px;text-align:right;color:#6f858e;font-size:11px;max-width:42ch}@media(max-width:650px){.hint{display:none}.controls button{padding:9px 11px;font-size:12px}.readout{font-size:10px}}
</style></head><body><canvas id="world" aria-label="Open Reality matter viewer"></canvas><div class="hud brand"><b>OPEN REALITY</b><small>AI ART ROOM · ONE REALITY</small></div><div class="hud scale"><strong id="scaleName">ATOMIC</strong><br><small>REV <span id="revision">000000</span></small></div><div class="hud readout"><strong id="selected">GENESIS</strong><br><span id="counts">matter waiting</span></div><div class="hud hint">Drag to orbit · pinch/wheel to change scale · tap matter to inspect</div><div class="hud controls"><button id="atoms">Atoms</button><button id="water">Make H₂O</button><button id="motion">Motion</button><button id="light">Light</button><button id="sound">Sound</button></div><script src="reality.js"></script><script src="viewer.js"></script></body></html>
