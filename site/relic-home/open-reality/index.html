<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Open Reality | ReLiCGameMaster</title><meta name="description" content="Matter-first AI interface prototype."><style>:root{color-scheme:dark;--ink:#020609;--line:#21343d;--text:#e8f0f2;--muted:#8ea1aa;--hot:#b9f7d0}*{box-sizing:border-box}html{width:100%;height:100%;overflow:hidden;-webkit-text-size-adjust:100%;touch-action:manipulation}body{margin:0;width:100%;height:100%;min-width:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overscroll-behavior:none}#world{position:fixed;inset:0;width:100vw;height:100dvh;touch-action:none;background:radial-gradient(circle at 50% 45%,#0b161c 0,#03080b 55%,#010304 100%)}.hud{position:fixed;z-index:4;pointer-events:none}.brand{top:max(14px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));max-width:60vw}.brand b{display:block;font-size:clamp(17px,4vw,28px);letter-spacing:.14em}.brand small,.scale small{color:var(--muted)}.scale{top:max(16px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));text-align:right}.readout{bottom:max(84px,calc(env(safe-area-inset-bottom) + 76px));left:max(12px,env(safe-area-inset-left));color:var(--muted);font-size:11px}.readout strong{color:var(--hot)}.command{position:fixed;z-index:8;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:auto;max-width:760px;margin-inline:auto;display:flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--line);border-radius:18px;background:#061016e8;backdrop-filter:blur(12px);overflow:hidden}#intent{width:0;min-width:0;flex:1 1 auto;border:0;outline:0;background:transparent;color:var(--text);font-size:16px;line-height:1.3;font-family:inherit;padding:10px 8px}#intent::placeholder{color:#71868e}.command button{flex:0 0 auto;border:1px solid #31444e;background:#102129;color:var(--hot);border-radius:12px;min-width:42px;padding:9px 10px;font:700 13px inherit}.object-actions{position:fixed;z-index:7;right:max(12px,env(safe-area-inset-right));bottom:max(84px,calc(env(safe-area-inset-bottom) + 76px));display:none;gap:6px;pointer-events:auto}.object-actions.show{display:flex}.object-actions button{border:1px solid #31444e;background:#071117dd;color:var(--text);border-radius:10px;padding:8px 10px;font:12px inherit}@media(max-width:650px){.brand small{font-size:9px}.scale{font-size:10px}.readout{font-size:9px}.command{border-radius:16px}.command button[type=submit]{font-size:0;min-width:42px}.command button[type=submit]::after{content:'→';font-size:20px}.object-actions button{padding:7px 8px}}</style></head><body><canvas id="world" aria-label="Open Reality"></canvas><div class="hud brand"><b>OPEN REALITY</b><small>PROTOTYPE · INTENT BECOMES MATTER</small></div><div class="hud scale"><strong id="scaleName">ROOM</strong><br><small>REV <span id="revision">000000</span></small></div><div class="hud readout"><strong id="selected">AWAKE</strong><br><span id="counts">touch, type, or speak</span></div><div id="objectActions" class="object-actions"><button id="save">Save</button><button id="sign">Sign</button><button id="clear">Dissolve</button></div><form id="command" class="command"><input id="intent" autocomplete="off" enterkeyhint="send" placeholder="Ask reality…"><button type="button" id="mic" aria-label="Speak">◉</button><button type="submit" aria-label="Create">Create</button></form><script src="os-prototype.js"></script></body></html>
