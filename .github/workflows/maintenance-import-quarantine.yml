name: One-shot corrupt import quarantine hardening

on:
  push:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - '.github/workflows/maintenance-import-quarantine.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden imported-image normalization
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/rist-world/prepare_public_data.py')
          text = path.read_text(encoding='utf-8')
          old = """        if source.stat().st_size < 256:\n            continue\n\n        relative = source.relative_to(source_root)\n        try:\n            with Image.open(source) as opened:\n                normalized, transparent = _remove_edge_background(opened)\n                digest = _image_digest(normalized)\n        except Exception as exc:\n            print(f'asset-normalize-skip source={source} error={type(exc).__name__}: {exc}')\n            continue\n"""
          new = """        relative = source.relative_to(source_root)\n        try:\n            with Image.open(source) as opened:\n                opened.verify()\n            with Image.open(source) as opened:\n                normalized, transparent = _remove_edge_background(opened)\n                digest = _image_digest(normalized)\n        except Exception as exc:\n            print(f'asset-normalize-reject source={source} error={type(exc).__name__}: {exc}')\n            if prune_legacy and source.suffix.lower() in LEGACY_IMPORT_FORMATS:\n                source.unlink(missing_ok=True)\n            continue\n"""
          assert old in text, 'Normalizer validation block changed unexpectedly'
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Syntax check
        run: python -m py_compile apps/rist-world/prepare_public_data.py
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/rist-world/prepare_public_data.py
          git diff --cached --check
          git commit -m 'Reject corrupt legacy imports during CI normalization'
          git pull --rebase origin live-alpha-rist-blazor-world
          python -m py_compile apps/rist-world/prepare_public_data.py
          git push origin HEAD:live-alpha-rist-blazor-world
