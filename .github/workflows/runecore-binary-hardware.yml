name: RuneCore Binary Hardware Test

on:
  push:
    paths:
      - 'experiments/runecore_binary_collision.c'
      - '.github/workflows/runecore-binary-hardware.yml'
  workflow_dispatch:

jobs:
  binary-collision:
    name: Binary collision on GitHub runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show runner CPU
        run: |
          uname -a
          lscpu
      - name: Compile native C
        run: gcc -O2 -std=c11 -Wall -Wextra -Werror experiments/runecore_binary_collision.c -o runecore_binary_collision
      - name: Execute binary transition test
        run: ./runecore_binary_collision
