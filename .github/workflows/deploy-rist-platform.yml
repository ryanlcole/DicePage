name: Deploy RIST AWS Platform

on:
  workflow_dispatch:
  push:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - 'infra/aws/rist-platform.yml'
      - 'infra/aws/rist-platform-authority/**'
      - 'infra/aws/rist-platform-zone-seed/**'
      - 'infra/aws/bootstrap-secure-deploy-roles.sh'
      - '.github/workflows/deploy-rist-platform.yml'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::797661578124:role/RIST-GitHub-Deploy
  CFN_EXECUTION_ROLE_ARN: arn:aws:iam::797661578124:role/ReLiC-CloudFormation-Execution
  DEPLOY_BUCKET: relic-deploy-artifacts-797661578124-us-east-1
  STACK_NAME: rist-platform
  AUTH_STACK: rist-discord-storage
  EXTERNAL_AI_STACK: rist-external-ai
  PRODUCTION_ORIGIN: https://relicgamemaster.com

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2

      - name: Compile authority source
        run: |
          python -m compileall -q infra/aws/rist-platform-authority
          python -m compileall -q infra/aws/rist-platform-zone-seed

      - name: Verify semantic world mutation policy
        run: python -m unittest discover -s infra/aws/rist-platform-authority/tests -p 'test_*.py'

      - name: Validate platform template
        run: sam validate --lint --template-file infra/aws/rist-platform.yml

      - name: Build authority platform
        run: sam build --template-file infra/aws/rist-platform.yml --build-dir .aws-sam/platform

      - name: Configure AWS through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deployed Discord identity table
        shell: bash
        run: |
          set -euo pipefail
          IDENTITY_TABLE=$(aws cloudformation describe-stack-resource \
            --stack-name "$AUTH_STACK" \
            --logical-resource-id IdentityTable \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          if [ -z "$IDENTITY_TABLE" ] || [ "$IDENTITY_TABLE" = "None" ]; then
            echo "Discord auth stack $AUTH_STACK exists, but IdentityTable could not be resolved."
            exit 1
          fi
          echo "IDENTITY_TABLE=$IDENTITY_TABLE" >> "$GITHUB_ENV"
          echo "Using auth stack $AUTH_STACK"

      - name: Resolve external AI account table
        shell: bash
        run: |
          set -euo pipefail
          AI_STATE_TABLE=$(aws cloudformation describe-stack-resource \
            --stack-name "$EXTERNAL_AI_STACK" \
            --logical-resource-id ExternalAiStateTable \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          if [ -z "$AI_STATE_TABLE" ] || [ "$AI_STATE_TABLE" = "None" ]; then
            echo "External AI stack $EXTERNAL_AI_STACK exists, but ExternalAiStateTable could not be resolved."
            exit 1
          fi
          echo "AI_STATE_TABLE=$AI_STATE_TABLE" >> "$GITHUB_ENV"
          echo "Using external AI account table from $EXTERNAL_AI_STACK"

      - name: Resolve platform owner authority
        env:
          CONFIGURED_OWNER_USER_ID: ${{ vars.RIST_OWNER_USER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER_USER_ID="${CONFIGURED_OWNER_USER_ID:-}"
          if [ -z "$OWNER_USER_ID" ]; then
            OWNER_USER_ID=$(python - <<'PY'
          import json
          import uuid
          from pathlib import Path

          cfg = json.loads(Path("apps/rist-world/wwwroot/auth-config.json").read_text(encoding="utf-8"))
          discord_id = str(cfg.get("ownerDiscordUserId") or "").strip()
          if not discord_id.isdigit():
              raise SystemExit("auth-config.json must contain a numeric ownerDiscordUserId")
          print(uuid.uuid5(uuid.NAMESPACE_URL, "rist:discord:" + discord_id))
          PY
            )
          fi
          python - "$OWNER_USER_ID" <<'PY'
          import sys
          import uuid

          value = sys.argv[1].strip()
          parsed = uuid.UUID(value)
          if str(parsed) != value.lower():
              raise SystemExit("RIST platform owner identity is not a canonical UUID")
          PY
          echo "OWNER_USER_ID=$OWNER_USER_ID" >> "$GITHUB_ENV"
          echo "Resolved authenticated platform-owner authority."

      - name: Recover or wait for platform stack
        shell: bash
        run: |
          set -euo pipefail
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            for attempt in $(seq 1 90); do
              STACK_STATUS=$(aws cloudformation describe-stacks \
                --stack-name "$STACK_NAME" \
                --query 'Stacks[0].StackStatus' \
                --output text)
              case "$STACK_STATUS" in
                *_IN_PROGRESS)
                  echo "$STACK_NAME is $STACK_STATUS; waiting for CloudFormation cleanup ($attempt/90)..."
                  sleep 10
                  ;;
                *)
                  break
                  ;;
              esac
            done

            if [[ "$STACK_STATUS" == *_IN_PROGRESS ]]; then
              echo "$STACK_NAME did not reach a stable CloudFormation state in the recovery window."
              exit 1
            fi

            if [[ "$STACK_STATUS" == "UPDATE_ROLLBACK_FAILED" ]]; then
              echo "$STACK_NAME is UPDATE_ROLLBACK_FAILED; continuing rollback before deployment..."
              FAILED_IDS=$(aws cloudformation describe-stack-events \
                --stack-name "$STACK_NAME" \
                --query "StackEvents[?ResourceStatus=='UPDATE_FAILED'].LogicalResourceId" \
                --output text 2>/dev/null || true)
              if [[ " $FAILED_IDS " == *" SunkenTundraSeed "* ]]; then
                echo "SunkenTundraSeed blocked rollback; skipping that custom resource only so its IAM fix can deploy."
                aws cloudformation continue-update-rollback \
                  --stack-name "$STACK_NAME" \
                  --resources-to-skip SunkenTundraSeed
              else
                aws cloudformation continue-update-rollback --stack-name "$STACK_NAME"
              fi
              aws cloudformation wait stack-update-rollback-complete --stack-name "$STACK_NAME"
              STACK_STATUS=$(aws cloudformation describe-stacks                 --stack-name "$STACK_NAME"                 --query 'Stacks[0].StackStatus'                 --output text)
              echo "$STACK_NAME recovered to $STACK_STATUS."
            elif [[ "$STACK_STATUS" == "ROLLBACK_FAILED" ]]; then
              echo "$STACK_NAME is ROLLBACK_FAILED; deleting failed stack before clean redeploy..."
              aws cloudformation delete-stack --stack-name "$STACK_NAME"
              aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
              echo "Failed platform stack deleted successfully."
            elif [[ "$STACK_STATUS" == "ROLLBACK_COMPLETE" ]]; then
              echo "$STACK_NAME is a failed create shell; deleting before clean redeploy..."
              aws cloudformation delete-stack --stack-name "$STACK_NAME"
              aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
              echo "Failed platform stack shell deleted successfully."
            else
              echo "$STACK_NAME is stable at $STACK_STATUS; deployment may proceed."
            fi
          fi

      - name: Deploy authority platform through CloudFormation execution role
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OWNER_USER_ID:-}"
          PARAMS=(
            "IdentityTableName=$IDENTITY_TABLE"
            "ExternalAiStateTableName=$AI_STATE_TABLE"
            "FrontendOrigin=$PRODUCTION_ORIGIN"
            "OwnerUserId=$OWNER_USER_ID"
          )
          sam deploy \
            --template-file .aws-sam/platform/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --s3-bucket "$DEPLOY_BUCKET" \
            --s3-prefix "sam/${STACK_NAME}" \
            --role-arn "$CFN_EXECUTION_ROLE_ARN" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${PARAMS[@]}"

      - name: Verify deployed platform owner authority
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED_OWNER=$(aws cloudformation describe-stacks             --stack-name "$STACK_NAME"             --query "Stacks[0].Parameters[?ParameterKey=='OwnerUserId'].ParameterValue | [0]"             --output text)
          test -n "$DEPLOYED_OWNER"
          test "$DEPLOYED_OWNER" != "None"
          test "$DEPLOYED_OWNER" = "$OWNER_USER_ID"
          echo "Platform-owner authority parameter verified."

      - name: Export client authority config
        run: |
          API=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='AuthorityApiBaseUrl'].OutputValue" --output text)
          WS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='RealtimeWebSocketUrl'].OutputValue" --output text)
          printf '{"apiBaseUrl":"%s","realtimeUrl":"%s"}\n' "$API" "$WS" > authority-config.json
          cat authority-config.json

      - uses: actions/upload-artifact@v4
        with:
          name: rist-authority-config
          path: authority-config.json
          retention-days: 7
