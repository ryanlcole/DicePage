name: Patch Region Tools

on:
  push:
    branches:
      - live-alpha-rist-blazor-world

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-alpha-rist-blazor-world
      - name: Apply Region tools wiring
        run: python .github/scripts/patch_region_tools_once.py
      - name: Commit Region tools wiring
        run: |
          git config user.name "shaelvien-region-tools"
          git config user.email "actions@users.noreply.github.com"
          git add apps/rist-world/Components/UniversalInterface.razor
          git diff --cached --check
          git commit -m "Wire Region tools into World Home [region-tools-patch]"
          git push origin HEAD:live-alpha-rist-blazor-world
