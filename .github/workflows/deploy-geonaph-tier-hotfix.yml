name: Deploy Geonaph Tier Hotfix

on:
  push:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - '.github/workflows/deploy-geonaph-tier-hotfix.yml'
      - 'apps/rist-world/wwwroot/prototype/prototype.js'
      - 'apps/rist-world/wwwroot/prototype/prototype.css'
      - 'apps/rist-world/wwwroot/worldbuilder-projection.js'
      - 'apps/rist-world/tests/test_endemar_geonaph_zone_depth.py'
      - 'apps/rist-world/tests/canonical-viewer-geonaph-history.test.cjs'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::797661578124:role/RIST-GitHub-Deploy
  FRONTEND_STACK: rist-frontend
  ASSET_ROOT: https://d2d6rnm6fnsp89.cloudfront.net/library/terrains/standard/world/whole_maps/geonaph/

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-alpha-rist-blazor-world

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify shared placement renderer
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/rist-world/wwwroot/prototype/prototype.js
          node --check apps/rist-world/wwwroot/worldbuilder-projection.js
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q apps/rist-world/tests/test_endemar_geonaph_zone_depth.py
          node --test             --test-name-pattern="World Builder shows the full Geonaph tier-layer stack while MMO stays flattened"             apps/rist-world/tests/canonical-viewer-geonaph-history.test.cjs

          for file in             geonaph_full_static_canonical_surface_v002.png             geonaph_full_static_highlands_rivers_v002.png             geonaph_full_static_mountain_volcanic_archipelago_v002.png; do
            curl --fail --location --retry 6 --retry-delay 3 --output /dev/null "${ASSET_ROOT}${file}"
          done

      - name: Configure AWS through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish shared placement renderer files
        shell: bash
        run: |
          set -euo pipefail
          BUCKET=$(aws cloudformation describe-stacks             --stack-name "$FRONTEND_STACK"             --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue | [0]"             --output text)
          DIST=$(aws cloudformation describe-stacks             --stack-name "$FRONTEND_STACK"             --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue | [0]"             --output text)
          URL=$(aws cloudformation describe-stacks             --stack-name "$FRONTEND_STACK"             --query "Stacks[0].Outputs[?OutputKey=='FrontendBaseUrl'].OutputValue | [0]"             --output text)
          test -n "$BUCKET" && test "$BUCKET" != "None"
          test -n "$DIST" && test "$DIST" != "None"
          URL="${URL%/}/"

          aws s3 cp apps/rist-world/wwwroot/prototype/prototype.js             "s3://$BUCKET/Game/prototype/prototype.js"             --content-type 'text/javascript; charset=utf-8'             --cache-control 'no-cache,no-store,must-revalidate'             --only-show-errors

          aws s3 cp apps/rist-world/wwwroot/prototype/prototype.css             "s3://$BUCKET/Game/prototype/prototype.css"             --content-type 'text/css; charset=utf-8'             --cache-control 'no-cache,no-store,must-revalidate'             --only-show-errors

          aws s3 cp apps/rist-world/wwwroot/worldbuilder-projection.js             "s3://$BUCKET/Game/worldbuilder-projection.js"             --content-type 'text/javascript; charset=utf-8'             --cache-control 'no-cache,no-store,must-revalidate'             --only-show-errors

          INVALIDATION=$(aws cloudfront create-invalidation             --distribution-id "$DIST"             --paths '/Game/prototype/prototype.js' '/Game/prototype/prototype.css' '/Game/worldbuilder-projection.js'             --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST" --id "$INVALIDATION"

          curl --fail --location --retry 8 --retry-delay 3             --output /tmp/live-prototype.js "${URL}Game/prototype/prototype.js"
          curl --fail --location --retry 8 --retry-delay 3             --output /tmp/live-prototype.css "${URL}Game/prototype/prototype.css"
          curl --fail --location --retry 8 --retry-delay 3             --output /tmp/live-worldbuilder-projection.js "${URL}Game/worldbuilder-projection.js"

          grep -Fq "layer:TIER_TOP_LAYER" /tmp/live-prototype.js
          grep -Fq "geonaph_full_static_canonical_surface_v002.png" /tmp/live-prototype.js
          grep -Fq "geonaph_full_static_highlands_rivers_v002.png" /tmp/live-prototype.js
          grep -Fq "geonaph_full_static_mountain_volcanic_archipelago_v002.png" /tmp/live-prototype.js
          grep -Fq "node.src=baseWorldAssetRepresentationUrl(asset)" /tmp/live-prototype.js
          grep -Fq "const COMPACT_TIER_PRESENTATION_STEP=.4;" /tmp/live-prototype.js
          grep -Fq "const depth=presentationDepthForTier(entry.tier);" /tmp/live-prototype.js
          grep -Fq "const depth=presentationDepthForTier(item.tier);" /tmp/live-prototype.js
          grep -Fq "const fullDeedFrame=geonaphSeaLevelMap;" /tmp/live-prototype.js
          grep -Fq "const SCOPE_GRID_COLUMNS=300;" /tmp/live-prototype.js
          grep -Fq "const VIEWER_WINDOW_GRID_COLUMNS=30;" /tmp/live-prototype.js
          grep -Fq "const SCOPE_VIEW_ANGLE=Object.freeze({WORLD:0,REGION:15,LOCAL:30,INSTANCE:45});" /tmp/live-prototype.js
          grep -Fq "const SCOPE_ZOOM_FACTOR=SCOPE_GRID_COLUMNS/VIEWER_WINDOW_GRID_COLUMNS;" /tmp/live-prototype.js
          grep -Fq "rotateX(${angle}deg)" /tmp/live-prototype.js
          grep -Fq "const lift=hasPreviousTop?clamp(-tierStep*9*strength*spatialWeight,-42,0):0;" /tmp/live-worldbuilder-projection.js
          grep -Fq "object-fit:fill" /tmp/live-prototype.css
          echo "RECURSIVE 300X300 SCOPE GEOMETRY + GEONAPH TRANSPARENCY LIVE VERIFIED"
