name: Accessibility Add-on Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-accessibility-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned audit tooling
        run: |
          python -m pip install "a11y-toolkit==3.20.0" "playwright==1.63.0"
          python -m playwright install --with-deps chromium

      - name: Capture public accessibility evidence
        continue-on-error: true
        shell: bash
        run: |
          set -u
          mkdir -p accessibility-artifacts
          a11ytoolkit audit --url https://relicgamemaster.com --pages 5 2>&1 | tee accessibility-artifacts/audit.txt
          a11ytoolkit kbd https://relicgamemaster.com 2>&1 | tee accessibility-artifacts/keyboard.txt
          a11ytoolkit reflow https://relicgamemaster.com 2>&1 | tee accessibility-artifacts/reflow.txt
          a11ytoolkit snapshot https://relicgamemaster.com --out accessibility-artifacts/snapshot.json 2>&1 | tee accessibility-artifacts/snapshot.txt

      - name: Preserve evidence
        uses: actions/upload-artifact@v4
        with:
          name: shaelvien-accessibility-evidence
          path: accessibility-artifacts/
          retention-days: 30
