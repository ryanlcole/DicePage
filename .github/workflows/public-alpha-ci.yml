name: Public Alpha CI

on:
  push:
    branches:
      - build/public-alpha-2026-09-08-v2
      - build/launcher-functional-hub-2026-09-08
      - build/workspace-layouts-2026-09-08
      - build/worldbuilding-p0-2026-09-08
      - build/world-authority-2026-09-08
      - build/task-workspaces-2026-09-08
      - build/worldbuilder-studio-2026-09-08
    paths:
      - 'apps/rist-world/**'
      - 'site/relic-home/Play/**'
      - '.github/workflows/public-alpha-ci.yml'
  pull_request:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - 'apps/rist-world/**'
      - 'site/relic-home/Play/**'
      - '.github/workflows/public-alpha-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Prepare public data
        shell: bash
        run: |
          set -euo pipefail
          PYDEPS="$RUNNER_TEMP/rist-pydeps"
          rm -rf "$PYDEPS"
          python -m pip install --disable-pip-version-check --target "$PYDEPS" Pillow==11.3.0
          PYTHONPATH="$PYDEPS${PYTHONPATH:+:$PYTHONPATH}" python apps/rist-world/prepare_public_data.py

      - name: Verify world coordinate authority
        run: node apps/rist-world/tests/world-coordinate-authority.test.mjs

      - name: Publish RIST WORLD
        run: dotnet publish apps/rist-world/RistWorld.csproj -c Release -o build/rist

      - name: Verify functional launcher and worldbuilder
        shell: bash
        run: |
          set -euo pipefail
          set -x
          test -f apps/rist-world/Components/PublicAlphaShell.razor
          test -f apps/rist-world/Components/PublicAlphaShell.razor.css
          test -f apps/rist-world/Components/WorkspaceSurface.razor
          test -f apps/rist-world/Components/TaskWorkspaceRouter.razor
          test -f apps/rist-world/Components/WorldBuilderStudio.razor
          test -f apps/rist-world/Components/RegionDefinerWorkspace.razor
          test -f apps/rist-world/Components/WorldManagementWorkspace.razor
          test -f apps/rist-world/Components/FeedbackWorkspace.razor
          test -f apps/rist-world/wwwroot/css/worldbuilding-p0-authority.css
          test -f apps/rist-world/wwwroot/world-coordinate-authority.js
          test -f apps/rist-world/wwwroot/shaelvien-navigation-authority.js
          test -f apps/rist-world/wwwroot/css/shaelvien-navigation-authority.css
          grep -q 'A LIVING WORLD AWAITS' apps/rist-world/Components/PublicAlphaShell.razor
          grep -q 'BUILD THE WORLD' apps/rist-world/Components/PublicAlphaShell.razor
          grep -q 'ENTER SHAELVIEN' apps/rist-world/Components/PublicAlphaShell.razor
          grep -q 'MORE THAN A GAME. A PLACE TO BELONG.' apps/rist-world/Components/PublicAlphaShell.razor
          grep -q 'FEEDBACK' apps/rist-world/Components/PublicAlphaShell.razor
          grep -q 'WORLDBUILDER' apps/rist-world/Components/PublicAlphaShell.razor
          grep -q 'GAMEMASTER' apps/rist-world/Components/PublicAlphaShell.razor
          grep -q 'ASSET DESIGNER' apps/rist-world/Components/PublicAlphaShell.razor
          grep -q 'RULEBOOKS' apps/rist-world/Components/PublicAlphaShell.razor
          grep -q 'ROLEPLAY' apps/rist-world/Components/PublicAlphaShell.razor
          grep -q 'TaskWorkspaceRouter Mode=' apps/rist-world/Components/PublicAlphaShell.razor
          grep -q 'WorldBuilderStudio' apps/rist-world/Components/TaskWorkspaceRouter.razor
          grep -q 'RegionDefinerWorkspace' apps/rist-world/Components/TaskWorkspaceRouter.razor
          grep -q 'WorldManagementWorkspace' apps/rist-world/Components/TaskWorkspaceRouter.razor
          grep -q 'FeedbackWorkspace' apps/rist-world/Components/TaskWorkspaceRouter.razor
          grep -q 'grid-template-columns:26px minmax(0,1fr) 26px' apps/rist-world/Components/WorldBuilderStudio.razor
          grep -q 'studio-home' apps/rist-world/Components/WorldBuilderStudio.razor
          grep -q 'studio-profile' apps/rist-world/Components/WorldBuilderStudio.razor
          grep -q '"All","Uploads","Tiles","Tokens","Minis","Scenery","Pawns","Rolling Stock","Bits"' apps/rist-world/Components/WorldBuilderStudio.razor
          grep -q 'studio-viewer-grid' apps/rist-world/Components/WorldBuilderStudio.razor
          grep -q 'studio-top-slider' apps/rist-world/Components/WorldBuilderStudio.razor
          grep -q 'studio-command-slider' apps/rist-world/Components/WorldBuilderStudio.razor
          grep -q 'world-stage>.grid{display:none' apps/rist-world/Components/WorldBuilderStudio.razor
          grep -q 'ShareMapAsync' apps/rist-world/Components/WorldManagementWorkspace.razor
          grep -q 'DownloadMapAsync' apps/rist-world/Components/WorldManagementWorkspace.razor
          grep -q 'relic.gamemaster@gmail.com' apps/rist-world/Components/FeedbackWorkspace.razor
          grep -q 'ws-world' apps/rist-world/Components/WorkspaceSurface.razor
          grep -q 'ws-campaign' apps/rist-world/Components/WorkspaceSurface.razor
          grep -q 'ws-assets' apps/rist-world/Components/WorkspaceSurface.razor
          grep -q 'ws-roleplay' apps/rist-world/Components/WorkspaceSurface.razor
          grep -q 'DefaultCubeWidthMiles = 30' apps/rist-world/WorldSession.DefaultCube.cs
          grep -q 'DefaultCubeHeightMiles = 30' apps/rist-world/WorldSession.DefaultCube.cs
          grep -q 'DefaultCubeCellCount = DefaultCubeWidthMiles \* DefaultCubeHeightMiles' apps/rist-world/WorldSession.DefaultCube.cs
          grep -q 'DefaultTerrainTilesetName = "Ocean 071"' apps/rist-world/WorldSession.DefaultCube.cs
          grep -q 'GridColumns = DefaultCubeWidthMiles' apps/rist-world/WorldSession.cs
          grep -q 'GridRows = DefaultCubeHeightMiles' apps/rist-world/WorldSession.cs
          grep -q 'class="base ocean-world"' apps/rist-world/Components/WorldMap.razor
          grep -q 'class="grid @Session.GridStyle"' apps/rist-world/Components/WorldMap.razor
          grep -q 'background-size:calc(100% / 30) calc(100% / 30)' apps/rist-world/wwwroot/css/worldbuilding-p0-authority.css
          grep -q 'world-stage>.grid' apps/rist-world/wwwroot/css/worldbuilding-p0-authority.css
          grep -q 'world-stage>.tile-cell' apps/rist-world/wwwroot/css/worldbuilding-p0-authority.css
          grep -q 'Ocean 071 is the implicit terrain' apps/rist-world/wwwroot/css/worldbuilding-p0-authority.css
          grep -q 'PlacedTiles=\[\]' apps/rist-world/WorldSession.Persistence.cs
          grep -q "worldBuilder=!!map.closest('.ws-world')" apps/rist-world/wwwroot/map-visibility-recovery.js
          grep -q 'if(!worldBuilder)' apps/rist-world/wwwroot/map-visibility-recovery.js
          grep -q 'const cols=worldBuilder?30:20' apps/rist-world/wwwroot/grid-coordinate-system.js
          grep -q 'const rows=worldBuilder?30:13' apps/rist-world/wwwroot/grid-coordinate-system.js
          grep -q 'worldbuilding-p0-authority.css' apps/rist-world/wwwroot/index.html
          grep -q 'world-coordinate-authority.js' apps/rist-world/wwwroot/index.html
          grep -q 'worldPointFromClient' apps/rist-world/wwwroot/world-coordinate-authority.js
          grep -q 'snapWorldPoint' apps/rist-world/wwwroot/world-coordinate-authority.js
          grep -q 'shaelvien-navigation-authority.js' apps/rist-world/wwwroot/index.html
          grep -q 'shaelvien-navigation-authority.css' apps/rist-world/wwwroot/index.html
          grep -q "const backLabel='← BACK'" apps/rist-world/wwwroot/shaelvien-navigation-authority.js
          grep -q 'Back to Shaelvien hub' apps/rist-world/wwwroot/shaelvien-navigation-authority.js
          grep -q 'Open Asset Palette' apps/rist-world/Components/WorkspaceSurface.razor
          grep -q 'Save Now' apps/rist-world/Components/WorkspaceSurface.razor
          grep -q 'PublicAlphaShell' apps/rist-world/Components/AuthenticatedWorld.razor
          ! grep -q 'AutoEnter' apps/rist-world/Components/AuthenticatedWorld.razor
          grep -q 'id="signin"' site/relic-home/Play/index.html
          grep -q 'id="signup"' site/relic-home/Play/index.html
          ! grep -q 'id="preview"' site/relic-home/Play/index.html
          test -f build/rist/wwwroot/index.html
          test -f build/rist/wwwroot/css/worldbuilding-p0-authority.css
          test -f build/rist/wwwroot/world-coordinate-authority.js
          test -f build/rist/wwwroot/shaelvien-navigation-authority.js
          test -f build/rist/wwwroot/css/shaelvien-navigation-authority.css
          grep -q 'ReLiCGameMaster RIST WORLD' build/rist/wwwroot/index.html
