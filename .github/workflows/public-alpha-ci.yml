name: Public Alpha CI

on:
  push:
    branches:
      - build/public-alpha-2026-09-08-v2
      - build/launcher-functional-hub-2026-09-08
    paths:
      - 'apps/rist-world/**'
      - 'site/relic-home/Play/**'
      - '.github/workflows/public-alpha-ci.yml'
  pull_request:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - 'apps/rist-world/**'
      - 'site/relic-home/Play/**'
      - '.github/workflows/public-alpha-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Prepare public data
        shell: bash
        run: |
          set -euo pipefail
          PYDEPS="$RUNNER_TEMP/rist-pydeps"
          rm -rf "$PYDEPS"
          python -m pip install --disable-pip-version-check --target "$PYDEPS" Pillow==11.3.0
          PYTHONPATH="$PYDEPS${PYTHONPATH:+:$PYTHONPATH}" python apps/rist-world/prepare_public_data.py

      - name: Publish RIST WORLD
        run: dotnet publish apps/rist-world/RistWorld.csproj -c Release -o build/rist

      - name: Verify functional launcher
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/rist-world/Components/PublicAlphaShell.razor
          grep -q 'WORLD BUILDING' apps/rist-world/Components/PublicAlphaShell.razor
          grep -q 'CAMPAIGN EDITING' apps/rist-world/Components/PublicAlphaShell.razor
          grep -q 'ASSET CREATION' apps/rist-world/Components/PublicAlphaShell.razor
          grep -q 'RULEBOOKS' apps/rist-world/Components/PublicAlphaShell.razor
          grep -q 'ROLEPLAY' apps/rist-world/Components/PublicAlphaShell.razor
          grep -q 'PublicAlphaShell' apps/rist-world/Components/AuthenticatedWorld.razor
          ! grep -q 'AutoEnter' apps/rist-world/Components/AuthenticatedWorld.razor
          grep -q 'id="signin"' site/relic-home/Play/index.html
          grep -q 'id="signup"' site/relic-home/Play/index.html
          ! grep -q 'id="preview"' site/relic-home/Play/index.html
          test -f build/rist/wwwroot/index.html
          grep -q 'ReLiCGameMaster RIST WORLD' build/rist/wwwroot/index.html
