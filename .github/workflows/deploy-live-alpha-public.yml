name: Redirect Legacy GitHub Pages

on:
  push:
    branches:
      - live-alpha-rist-blazor-world
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble redirect-only GitHub Pages site
        run: |
          mkdir -p dist/app
          touch dist/.nojekyll

          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex,follow">
            <meta http-equiv="refresh" content="0;url=https://relicgamemaster.com/">
            <link rel="canonical" href="https://relicgamemaster.com/">
            <title>ReLiC GameMaster has moved</title>
            <script>
              location.replace("https://relicgamemaster.com/" + location.search + location.hash);
            </script>
          </head>
          <body>
            <p>ReLiC GameMaster has moved to <a href="https://relicgamemaster.com/">relicgamemaster.com</a>.</p>
          </body>
          </html>
          HTML

          cat > dist/app/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex,follow">
            <meta http-equiv="refresh" content="0;url=https://relicgamemaster.com/Game/">
            <link rel="canonical" href="https://relicgamemaster.com/Game/">
            <title>Shaelvien RIST has moved</title>
            <script>
              const suffix = location.pathname.replace(/^.*\/app\/?/, "");
              const target = "https://relicgamemaster.com/Game/" + suffix;
              location.replace(target + location.search + location.hash);
            </script>
          </head>
          <body>
            <p>Shaelvien RIST has moved to <a href="https://relicgamemaster.com/Game/">relicgamemaster.com/Game/</a>.</p>
          </body>
          </html>
          HTML

          cat > dist/404.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex,follow">
            <meta http-equiv="refresh" content="0;url=https://relicgamemaster.com/">
            <title>ReLiC GameMaster has moved</title>
            <script>
              (() => {
                let path = location.pathname || "/";
                path = path.replace(/^\/DicePage(?=\/|$)/i, "") || "/";
                if (/^\/app(?:\/|$)/i.test(path)) {
                  path = "/Game/" + path.replace(/^\/app\/?/i, "");
                }
                const target = new URL(path, "https://relicgamemaster.com/");
                target.search = location.search;
                target.hash = location.hash;
                location.replace(target.href);
              })();
            </script>
          </head>
          <body>
            <p>Continue at <a href="https://relicgamemaster.com/">relicgamemaster.com</a>.</p>
          </body>
          </html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4
