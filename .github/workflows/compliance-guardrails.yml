name: Compliance Guardrails

on:
  push:
    branches:
      - live-alpha-rist-blazor-world
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-compliance-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'live-alpha-rist-blazor-world' || github.ref }}
          fetch-depth: 0

      - name: Restore World-first builder navigation
        if: github.event_name == 'push'
        shell: python
        run: |
          from pathlib import Path
          path=Path('apps/rist-world/Components/UniversalInterface.razor')
          text=path.read_text(encoding='utf-8')
          old='''   case Stage.WorldHome:
            await BeginOrSaveVisibleSpatialSelectionAsync();
            break;'''
          if old in text:
              new='''   case Stage.WorldHome:
            _builderChainIndex=0;
            _requestedBuilderChainIndex=0;
            _assetScope="WORLD";
            _tier=0;
            _layer=0;
            _stage=Stage.WorldBuilderTier;
            await SyncWorldBuilderDepthAsync();
            _message="World editing opened. Choose a World Tier; Region tools remain an explicit child action from the World.";
            break;'''
              text=text.replace(old,new,1)
              text=text.replace('''  Stage.WorldHome=>string.Equals(VisibleSpatialKind,"REGION",StringComparison.OrdinalIgnoreCase)
   ?"REGION TOOLS"
   :_spatialDefinitionActive
    ?(_spatialSelectionCount>0?$"SAVE AREA · {_spatialSelectionCount}":"SELECT AREA")
    :"SELECT AREA",''','''  Stage.WorldHome=>"CHOOSE TIER",''',1)
              text=text.replace('''  Stage.WorldHome=>string.Equals(VisibleSpatialKind,"REGION",StringComparison.OrdinalIgnoreCase)
   ?"Open Region Tools. Draw a rough crop view, define the true Region border with Line, Pencil, or Magic Select, then choose visible tiers at the 60° Region view. Crop limits only what you view/edit; it never creates another map."
   :_spatialDefinitionActive
    ?$"Define the visible scene area. Pan and pinch still move through the continuous world. {_spatialSelectionCount} selected."
    :$"Pan or zoom to the place you want, choose any view angle, then Select Area. Zoom currently resolves {_viewerSpatialScope.ToLowerInvariant()} detail at {_viewerSpatialZoomRatio:0.##}×.",''','''  Stage.WorldHome=>"Edit the World first. Choose a Tier, then a Layer. Region tools are entered explicitly from the World after the parent map is ready.",''',1)
              path.write_text(text,encoding='utf-8')

      - name: Verify recursive cube-flow regression
        if: github.event_name == 'push'
        run: node --test apps/rist-world/tests/worldbuilder-recursive-cube-flow.test.cjs

      - name: Commit guarded navigation repair
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/rist-world/Components/UniversalInterface.razor; then
            echo "World-first navigation already repaired."
            exit 0
          fi
          git config user.name "Shaelvien Build Repair"
          git config user.email "actions@users.noreply.github.com"
          git add apps/rist-world/Components/UniversalInterface.razor
          git diff --cached --check
          git commit -m "Restore World-first builder navigation"
          git push origin HEAD:live-alpha-rist-blazor-world

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Shaelvien runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in apps/rist-world/wwwroot/shaelvien-*.js apps/rist-world/wwwroot/worldbuilder-camera-window.js apps/rist-world/wwwroot/worldbuilder-drag-preview.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Verify perception planner behavior
        run: node .github/scripts/test-perception-planner.mjs

      - name: Verify policy and semantic guardrails
        run: python .github/scripts/verify-compliance-guardrails.py
