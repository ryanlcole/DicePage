name: Compliance Guardrails

on:
  push:
    branches:
      - live-alpha-rist-blazor-world
  pull_request:

permissions:
  contents: read

jobs:
  verify-compliance-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Shaelvien runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in apps/rist-world/wwwroot/shaelvien-*.js apps/rist-world/wwwroot/worldbuilder-camera-window.js apps/rist-world/wwwroot/worldbuilder-drag-preview.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Verify perception planner behavior
        run: node .github/scripts/test-perception-planner.mjs

      - name: Verify policy and semantic guardrails
        run: python .github/scripts/verify-compliance-guardrails.py
