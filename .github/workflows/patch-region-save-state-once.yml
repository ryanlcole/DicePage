name: Patch Region Save State Once

on:
  push:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - .github/workflows/patch-region-save-state-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-alpha-rist-blazor-world
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Repair Region tool bootstrap and save state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          ui=Path('apps/rist-world/Components/UniversalInterface.razor')
          text=ui.read_text(encoding='utf-8')
          old='  if(!_spatialDefinitionActive&&string.Equals(VisibleSpatialKind,"REGION",StringComparison.OrdinalIgnoreCase))'
          new='  if(string.Equals(VisibleSpatialKind,"REGION",StringComparison.OrdinalIgnoreCase))'
          if text.count(old)!=1: raise SystemExit(f'Region entry condition count={text.count(old)}')
          text=text.replace(old,new,1)
          old='  if(string.Equals(VisibleSpatialKind,"REGION",StringComparison.OrdinalIgnoreCase))\n  {\n   var inspectionReason=_inspectionEditMode?RequireInspectionReason():"";'
          new='  if(string.Equals(VisibleSpatialKind,"REGION",StringComparison.OrdinalIgnoreCase))\n  {\n   // Region geography uses focus/crop plus authored border geometry, never the legacy visible-hex selector.\n   if(_spatialDefinitionActive)\n   {\n    if(_worldBuilderSourceModule is not null)\n    {\n     try{await _worldBuilderSourceModule.InvokeAsync<bool>("cancelSpatialSelection",_worldBuilderFrame);}catch(JSException){}\n    }\n    _spatialDefinitionActive=false;\n    _spatialSelectionCount=0;\n    _pendingSpatialName="";\n   }\n\n   var inspectionReason=_inspectionEditMode?RequireInspectionReason():"";'
          if text.count(old)!=1: raise SystemExit(f'Region stale-selector insertion count={text.count(old)}')
          text=text.replace(old,new,1)
          old='   _regionDefinerState=null;\n   _regionDefinerOpen=true;\n   _pendingSpatialInspectionReason=inspectionReason;\n   _stage=Stage.SpatialSelect;'
          new='   _regionDefinerState=null;\n   _regionDefinerOpen=true;\n   _builderChainIndex=1;\n   _requestedBuilderChainIndex=1;\n   _assetScope="REGION";\n   _pendingSpatialInspectionReason=inspectionReason;\n   _stage=Stage.SpatialSelect;'
          if text.count(old)!=1: raise SystemExit(f'Region scope insertion count={text.count(old)}')
          text=text.replace(old,new,1)
          pattern=r' async Task ActivateRegionDefinerPrimaryAsync\(\)\n \{.*?\n \}\n async Task StepRegionDefinerAsync'
          replacement=' async Task ActivateRegionDefinerPrimaryAsync()\n {\n  if(_regionDefinerWorkspace is null)return;\n  var state=_regionDefinerState??await _regionDefinerWorkspace.GetControllerStateAsync();if(state is null)return;\n  if(string.Equals(state.Phase,"select",StringComparison.OrdinalIgnoreCase))\n  {\n   _message="Legacy hex Region selection is retired. Reopen Region Tools to define a focus crop and authored border.";\n   return;\n  }\n  await _regionDefinerWorkspace.PrimaryAsync();\n }\n async Task StepRegionDefinerAsync'
          text,count=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if count!=1: raise SystemExit(f'Region primary replacement count={count}')
          old='   _builderChainIndex=2;_requestedBuilderChainIndex=2;_assetScope="LOCAL";_tier=0;_layer=0;_stage=Stage.WorldBuilderTier;\n   _message=$"{savedRegion.Name} saved by the original Region Definer. Continuing into Local inside the same recursive viewer.";\n   await InvokeAsync(StateHasChanged);\n   if(_regionDefinerWorkspace is not null)await _regionDefinerWorkspace.SetDepthAsync(_tier,_layer,"LOCAL",savedRegion.RegionId,$"{savedRegion.RegionId}/local");\n   return;'
          new='   _builderChainIndex=1;_requestedBuilderChainIndex=1;_assetScope="REGION";_stage=Stage.SpatialSelect;\n   _message=$"{savedRegion.Name} saved. The 60° Region view and chosen Tier visibility remain active; Local is entered only by an explicit next action.";\n   await InvokeAsync(StateHasChanged);\n   return;'
          if text.count(old)!=1: raise SystemExit(f'Auto-Local replacement count={text.count(old)}')
          text=text.replace(old,new,1)
          if '"prompt","Name this region"' in text: raise SystemExit('Region save still invokes browser prompt')
          ui.write_text(text,encoding='utf-8')
          host=Path('apps/rist-world/wwwroot/region-definer-host.js')
          h=host.read_text(encoding='utf-8')
          old='async function callPrototype(frame,name,...args){\n  await ensureRegionGeometryTools(frame);\n  const api=await waitForPrototype(frame),fn=api?.[name];\n  if(typeof fn!=="function")return null;\n  return await fn(...args);\n}'
          new='async function callPrototype(frame,name,...args){\n  const initial=await waitForPrototype(frame);\n  if(!initial)return null;\n  const loaded=await ensureRegionGeometryTools(frame);\n  if(!loaded)return null;\n  const api=frame?.contentWindow?.ShaelvienPrototype,fn=api?.[name];\n  if(typeof fn!=="function")return null;\n  return await fn(...args);\n}'
          if h.count(old)!=1: raise SystemExit(f'Host callPrototype count={h.count(old)}')
          h=h.replace(old,new,1)
          old='export async function attach(frame,dotnet){\n  detach(frame);\n  await ensureRegionGeometryTools(frame);\n  const handler=async event=>{'
          new='export async function attach(frame,dotnet){\n  detach(frame);\n  const initial=await waitForPrototype(frame);\n  if(initial)await ensureRegionGeometryTools(frame);\n  const handler=async event=>{'
          if h.count(old)!=1: raise SystemExit(f'Host attach count={h.count(old)}')
          h=h.replace(old,new,1)
          host.write_text(h,encoding='utf-8')
          test=Path('apps/rist-world/tests/canonical-viewer-region-definer-geometry.test.cjs')
          t=test.read_text(encoding='utf-8')
          if 'const uiPath' not in t:
              t=t.replace("const contractPath = path.join(root, 'REGION_DEFINER_CONTRACT.md');","const contractPath = path.join(root, 'REGION_DEFINER_CONTRACT.md');\nconst uiPath = path.join(root, 'Components', 'UniversalInterface.razor');")
              t=t.replace("const contract = fs.readFileSync(contractPath, 'utf8');","const contract = fs.readFileSync(contractPath, 'utf8');\nconst ui = fs.readFileSync(uiPath, 'utf8');")
              t += "\n\ntest('Region flow rejects legacy hex save and browser prompt', () => {\n  assert.match(ui, /Legacy hex Region selection is retired/);\n  assert.doesNotMatch(ui, /\\\"prompt\\\",\\\"Name this region\\\"/);\n  assert.match(ui, /_builderChainIndex=1;_requestedBuilderChainIndex=1;_assetScope=\\\"REGION\\\";_stage=Stage.SpatialSelect/);\n  assert.doesNotMatch(ui, /Continuing into Local inside the same recursive viewer/);\n});\n\ntest('Region host waits for loaded iframe before geometry injection', () => {\n  assert.match(host, /const initial=await waitForPrototype\\(frame\\);/);\n  assert.match(host, /if\\(!initial\\)return null;/);\n  assert.match(host, /const loaded=await ensureRegionGeometryTools\\(frame\\);/);\n});\n"
          test.write_text(t,encoding='utf-8')
          PY
          git diff --check
          node --check apps/rist-world/wwwroot/region-definer-host.js
          node --check apps/rist-world/wwwroot/prototype/region-geometry-tools.js
          node --test apps/rist-world/tests/canonical-viewer-region-definer-geometry.test.cjs
          ! grep -q '"prompt","Name this region"' apps/rist-world/Components/UniversalInterface.razor
      - name: Build RIST WORLD
        run: dotnet build apps/rist-world/RistWorld.csproj -c Release
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "shaelvien-region-state-repair"
          git config user.email "actions@users.noreply.github.com"
          git add apps/rist-world/Components/UniversalInterface.razor apps/rist-world/wwwroot/region-definer-host.js apps/rist-world/tests/canonical-viewer-region-definer-geometry.test.cjs
          git diff --cached --check
          git commit -m "Fix Region geometry bootstrap and save state [region-save-repair]"
          git reset --hard HEAD
          git pull --rebase origin live-alpha-rist-blazor-world
          git push origin HEAD:live-alpha-rist-blazor-world
