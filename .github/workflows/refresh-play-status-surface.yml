name: Refresh Play Status Surface

on:
  workflow_dispatch:
  push:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - 'site/relic-home/Play/**'
      - '.github/workflows/refresh-play-status-surface.yml'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::797661578124:role/RIST-GitHub-Deploy
  FRONTEND_STACK: rist-frontend

jobs:
  refresh-play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish and invalidate Play surface
        shell: bash
        run: |
          set -euo pipefail
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$FRONTEND_STACK" --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)
          DIST=$(aws cloudformation describe-stacks --stack-name "$FRONTEND_STACK" --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue" --output text)
          URL=$(aws cloudformation describe-stacks --stack-name "$FRONTEND_STACK" --query "Stacks[0].Outputs[?OutputKey=='FrontendBaseUrl'].OutputValue" --output text)

          aws s3 cp site/relic-home/Play/index.html "s3://${BUCKET}/Play/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'text/html; charset=utf-8' \
            --only-show-errors

          INVALIDATION=$(aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/Play/index.html' '/Play/' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST" --id "$INVALIDATION"

          curl --fail --location --retry 6 --retry-delay 5 --output /tmp/play.html "${URL}Play/index.html"
          grep -q '>Continue with Discord<' /tmp/play.html
          grep -q "button.hidden=!!text" /tmp/play.html
          grep -q 'Completing secure Discord sign in' /tmp/play.html
          grep -q 'Entering Shaelvien' /tmp/play.html
          echo "Play authentication status surface refreshed without changing auth routing."
