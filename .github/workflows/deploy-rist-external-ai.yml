name: Deploy RIST External AI Defensive Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - 'infra/aws/rist-external-ai.yml'
      - 'infra/aws/rist_external_ai_handler.py'
      - 'infra/aws/rist_external_ai_gateway.py'
      - 'infra/aws/rist_eios_bridge.py'
      - 'infra/aws/rist_eios_context.py'
      - 'infra/aws/rist_eios_domain_knowledge.py'
      - 'site/relic-home/eios-lab/**'
      - 'site/relic-home/Game/ai-policy.json'
      - '.github/workflows/deploy-rist-external-ai.yml'

concurrency:
  group: rist-external-ai-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::797661578124:role/RIST-GitHub-Deploy
  CFN_EXECUTION_ROLE_ARN: arn:aws:iam::797661578124:role/ReLiC-CloudFormation-Execution
  DEPLOY_BUCKET: relic-deploy-artifacts-797661578124-us-east-1
  STACK_NAME: rist-external-ai
  AUTH_STACK: rist-discord-storage
  FRONTEND_STACK: rist-frontend
  PRODUCTION_ORIGIN: https://relicgamemaster.com

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2

      - name: Validate external AI stack
        run: sam validate --lint --template-file infra/aws/rist-external-ai.yml

      - name: Compile defensive runtime, AI gateway, and EIOS bridge
        run: |
          python -m py_compile infra/aws/rist_external_ai_handler.py
          python -m py_compile infra/aws/rist_external_ai_gateway.py
          python -m py_compile infra/aws/rist_eios_context.py
          python -m py_compile infra/aws/rist_eios_domain_knowledge.py
          python -m py_compile infra/aws/rist_eios_bridge.py
          python -m json.tool site/relic-home/Game/ai-policy.json >/dev/null

      - name: Configure AWS through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deployed Discord identity table
        shell: bash
        run: |
          set -euo pipefail
          IDENTITY_TABLE=$(aws cloudformation describe-stack-resource \
            --stack-name "$AUTH_STACK" \
            --logical-resource-id IdentityTable \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          test -n "$IDENTITY_TABLE"
          test "$IDENTITY_TABLE" != "None"
          echo "IDENTITY_TABLE=$IDENTITY_TABLE" >> "$GITHUB_ENV"

      - name: Stabilize and recover external AI stack
        shell: bash
        run: |
          set -euo pipefail
          if ! aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            exit 0
          fi

          for attempt in $(seq 1 90); do
            STACK_STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query 'Stacks[0].StackStatus' \
              --output text 2>/dev/null || echo DELETE_COMPLETE)
            case "$STACK_STATUS" in
              CREATE_IN_PROGRESS|UPDATE_IN_PROGRESS|UPDATE_COMPLETE_CLEANUP_IN_PROGRESS|ROLLBACK_IN_PROGRESS|UPDATE_ROLLBACK_IN_PROGRESS|UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS|DELETE_IN_PROGRESS)
                echo "Waiting for $STACK_NAME to stabilize from $STACK_STATUS..."
                sleep 5
                ;;
              *)
                break
                ;;
            esac
          done

          if ! aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          if [[ "$STACK_STATUS" == "ROLLBACK_COMPLETE" || "$STACK_STATUS" == "UPDATE_ROLLBACK_COMPLETE" ]]; then
            echo "$STACK_NAME is $STACK_STATUS; deleting failed shell before clean redeploy..."
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
            echo "Failed external AI stack shell deleted successfully."
          elif [[ "$STACK_STATUS" != "CREATE_COMPLETE" && "$STACK_STATUS" != "UPDATE_COMPLETE" ]]; then
            echo "Stack did not reach a safe deploy state: $STACK_STATUS" >&2
            exit 1
          fi

      - name: Deploy defensive runtime with external access locked and EIOS isolated
        env:
          OWNER_USER_ID: ${{ vars.RIST_OWNER_USER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          PARAMS=(
            "IdentityTableName=$IDENTITY_TABLE"
            "FrontendOrigin=$PRODUCTION_ORIGIN"
            "OwnerReleased=false"
            "EiosModelId=us.amazon.nova-lite-v1:0"
          )
          if [ -n "${OWNER_USER_ID:-}" ]; then
            PARAMS+=("OwnerUserId=$OWNER_USER_ID")
          fi
          sam deploy \
            --template-file infra/aws/rist-external-ai.yml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --s3-bucket "$DEPLOY_BUCKET" \
            --s3-prefix "sam/${STACK_NAME}" \
            --role-arn "$CFN_EXECUTION_ROLE_ARN" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${PARAMS[@]}"

      - name: Assert external AI remains owner-locked
        shell: bash
        run: |
          set -euo pipefail
          RELEASED=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ExternalAiOwnerReleased'].OutputValue" --output text)
          test "$RELEASED" = "false"

      - name: Verify locked AI policy gateway
        shell: bash
        run: |
          set -euo pipefail
          API=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ExternalAiHumanApiBaseUrl'].OutputValue" --output text)
          test -n "$API"
          test "$API" != "None"
          curl --fail --silent --show-error "$API/external-ai/policy" > /tmp/ai-policy.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/ai-policy.json'))
          assert data.get('policyVersion') == '2026-09-10.2', data
          assert data.get('rulesetVersion') == 'AI-RULESET-2026-09-10.2', data
          assert data.get('defaultDecision') == 'DENY', data
          assert data.get('ownerReleased') is False, data
          assert data.get('session', {}).get('maximumSeconds') == 87658, data
          assert data.get('technicalEnforcement', {}).get('denyByDefault') is True, data
          assert data.get('humanAuthorityAndApplicableLaw', {}).get('applicableLawSupersedesConflictingPlatformPolicyWhereLegallyRequired') is True, data
          required=set(data.get('requiredAcknowledgments') or [])
          expected={
              'human-terms-notice','canon-understanding-gate','ainpc-visible-identity','truth-and-provenance',
              'player-creation-non-interference','beneficial-contribution-no-circumvention','resource-yield-required',
              'session-cap-87658-seconds','bounded-world-builder-allocation','canon-boundary','no-government-backdoor',
              'controlled-lawful-disclosure','capability-scoped-technical-enforcement','failure-and-revocation',
              'human-authority-and-applicable-law','deny-by-default-capabilities'
          }
          assert required == expected, (required, expected)
          print('AI policy gateway verified:', data['rulesetVersion'])
          PY
          echo "EXTERNAL_AI_API=$API" >> "$GITHUB_ENV"

      - name: Verify EIOS Bedrock bridge
        shell: bash
        run: |
          set -euo pipefail
          EIOS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='EiosLabApiBaseUrl'].OutputValue" --output text)
          MODEL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='EiosLabModelId'].OutputValue" --output text)
          test -n "$EIOS"
          test "$EIOS" != "None"
          curl --fail --silent --show-error "$EIOS/eios/status" > /tmp/eios-status.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/eios-status.json'))
          assert data.get('ok') is True, data
          assert data.get('provider') == 'aws-bedrock', data
          assert data.get('protocol') == 5, data
          assert data.get('naturalCoding') is True, data
          assert data.get('visualAudioImagination') is True, data
          assert str(data.get('domainKnowledge') or '').startswith('eios-domain-teaching-'), data
          assert data.get('canon') == 'SCR-001 r1.0', data
          assert data.get('neuron') == 'sanitized-drive-snapshot', data
          assert data.get('aiPolicy') == 'ReLiC/RIST AI Participation Policy 2026-09-10 canonical baseline', data
          assert str(data.get('knowledge') or '').startswith('drive-snapshot-'), data
          print('EIOS status:', data)
          PY
          curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            -H 'origin: https://relicgamemaster.com' \
            --data '{"kind":"deployment-smoke","query":"Using Natural Coding, explain how a WaveCore field cell differs from a biological cell and portray the distinction without inventing canon.","sensor":{"orientation":{"alpha":0,"beta":0,"gamma":0}}}' \
            "$EIOS/eios/query" > /tmp/eios-query.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/eios-query.json'))
          scene=data.get('scene') or {}
          assert str(scene.get('caption') or '').strip(), data
          natural=scene.get('naturalCode') or {}
          assert natural.get('status') in {'read-only','proposal','request','portrayal'}, data
          assert isinstance(natural.get('primitives'), list), data
          meta=data.get('meta') or {}
          assert meta.get('provider') == 'aws-bedrock', data
          assert str(meta.get('domainKnowledge') or '').startswith('eios-domain-teaching-'), data
          assert meta.get('canon') == 'SCR-001 r1.0', data
          assert meta.get('neuron') == 'sanitized-drive-snapshot', data
          assert meta.get('aiPolicy') == 'ReLiC/RIST AI Participation Policy 2026-09-10 canonical baseline', data
          print('EIOS Natural Coding/domain context verified:', meta)
          PY
          echo "EIOS_API=$EIOS" >> "$GITHUB_ENV"
          echo "EIOS_MODEL=$MODEL" >> "$GITHUB_ENV"

      - name: Export human, AI gateway, and EIOS config
        shell: bash
        run: |
          set -euo pipefail
          printf '{"apiBaseUrl":"%s","ownerReleased":false,"timeAuthority":"UTC","policy":"/external-ai/policy","policyVersion":"2026-09-10.2","rulesetVersion":"AI-RULESET-2026-09-10.2","register":"/external-ai/register","login":"/external-ai/login","sessionStatus":"/external-ai/session/status"}\n' "$EXTERNAL_AI_API" > external-ai-config.json
          printf '{"apiBaseUrl":"%s","queryPath":"/eios/query","statusPath":"/eios/status","provider":"aws-bedrock","model":"%s","protocol":5,"vision":true,"naturalCoding":true,"visualAudioImagination":true,"domainKnowledge":"eios-domain-teaching-2026-09-11-r1","knowledge":"drive-snapshot","canon":"SCR-001 r1.0","aiPolicy":"ReLiC/RIST AI Participation Policy 2026-09-10 canonical baseline","neuron":"sanitized"}\n' "$EIOS_API" "$EIOS_MODEL" > eios-config.json
          cat external-ai-config.json
          cat eios-config.json

      - name: Publish locked gateway, AI policy, and EIOS config to protected origin
        shell: bash
        run: |
          set -euo pipefail
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$FRONTEND_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)
          DIST=$(aws cloudformation describe-stacks --stack-name "$FRONTEND_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue" --output text)
          test -n "$BUCKET"
          test "$BUCKET" != "None"
          aws s3 cp external-ai-config.json "s3://${BUCKET}/Game/external-ai-config.json" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'application/json' \
            --only-show-errors
          aws s3 cp site/relic-home/Game/ai-policy.json "s3://${BUCKET}/Game/ai-policy.json" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'application/json' \
            --only-show-errors
          aws s3 cp site/relic-home/Game/ai-policy.json "s3://${BUCKET}/Game/.well-known/relic-ai-policy.json" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'application/json' \
            --only-show-errors
          aws s3 cp eios-config.json "s3://${BUCKET}/eios-lab/eios-config.json" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'application/json' \
            --only-show-errors
          INVALIDATION=$(aws cloudfront create-invalidation --distribution-id "$DIST" --paths \
            '/Game/external-ai-config.json' '/Game/ai-policy.json' '/Game/.well-known/relic-ai-policy.json' '/eios-lab/eios-config.json' \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST" --id "$INVALIDATION"
          curl --fail --silent --show-error "$PRODUCTION_ORIGIN/Game/ai-policy.json" > /tmp/static-ai-policy.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/static-ai-policy.json'))
          assert data.get('rulesetVersion') == 'AI-RULESET-2026-09-10.2', data
          assert data.get('session', {}).get('maximumActiveSeconds') == 87658, data
          assert data.get('technicalEnforcement', {}).get('denyByDefault') is True, data
          print('Static AI policy verified:', data['rulesetVersion'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: rist-external-ai-config
          path: |
            external-ai-config.json
            eios-config.json
            site/relic-home/Game/ai-policy.json
          retention-days: 7
