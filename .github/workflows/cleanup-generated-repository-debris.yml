name: Cleanup Generated Repository Debris

on:
  push:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - '.github/workflows/cleanup-generated-repository-debris.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: live-alpha-rist-blazor-world

      - name: Remove generated and stale tracked files
        shell: bash
        run: |
          set -euo pipefail

          # Git history is the archive. Do not keep parallel .old copies or
          # generated interpreter/build output in the active working tree.
          python - <<'PY'
          import subprocess
          from pathlib import PurePosixPath

          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          remove=[]
          root_vendor_prefixes=(
              'flask/','jinja2/','itsdangerous/','markupsafe/','werkzeug/',
              'blinker/','click/','colorama/'
          )
          root_vendor_dist=('flask-','jinja2-','itsdangerous-','markupsafe-','werkzeug-','blinker-','click-','colorama-')
          generated_dirs={'.venv','.venv.old','__pycache__','bin','obj','build','dist'}
          binary_suffixes={'.obj','.pyd','.exp','.lib','.log','.pyc','.pyo'}

          for raw in tracked:
              if not raw:
                  continue
              p=PurePosixPath(raw)
              parts=set(p.parts)
              name=p.name
              root=p.parts[0] if p.parts else ''

              stale=(name.endswith('.old') or '.old.' in name or name.endswith('_old.py'))
              generated=bool(parts & generated_dirs) or p.suffix.lower() in binary_suffixes
              root_vendor=(raw.startswith(root_vendor_prefixes) or
                           (len(p.parts)>1 and any(root.startswith(prefix) and '.dist-info' in root for prefix in root_vendor_dist)))

              if stale or generated or root_vendor:
                  remove.append(raw)

          if not remove:
              print('No generated repository debris remains.')
              raise SystemExit(0)

          print(f'Removing {len(remove)} generated/stale tracked paths.')
          chunk=200
          for i in range(0,len(remove),chunk):
              subprocess.run(['git','rm','-f','--ignore-unmatch','--',*remove[i:i+chunk]],check=True)
          PY

      - name: Verify cleanup boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/rist-world/RistWorld.csproj
          test -f apps/rist-world/App.razor
          test -f infra/aws/rist-frontend.yml
          test -f site/relic-home/Play/index.html
          git diff --cached --name-status | sed -n '1,120p'

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'Working tree already clean.'
            exit 0
          fi
          git config user.name 'ReLiC Repository Cleanup'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Remove generated and stale repository debris'
          git push origin HEAD:live-alpha-rist-blazor-world
