name: One-shot application warning maintenance

# Rerun from the latest protected-frontend branch head.
on:
  push:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - '.github/workflows/maintenance-warning-verifier-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Apply focused maintenance
        shell: python
        run: |
          from pathlib import Path

          ai = Path('apps/rist-world/ExternalAiAccess.cs')
          text = ai.read_text(encoding='utf-8')
          old = '    public const bool OwnerReleased = false;'
          new = '    public static readonly bool OwnerReleased = false;'
          assert old in text, 'External AI release gate shape changed unexpectedly'
          ai.write_text(text.replace(old, new, 1), encoding='utf-8')

          nav = Path('apps/rist-world/WorldSession.Navigation.cs')
          text = nav.read_text(encoding='utf-8')
          old = ' public static readonly string[] TableLayers = RecursionTiers;'
          new = ' public static string[] TableLayers => RecursionTiers;'
          assert old in text, 'TableLayers initialization shape changed unexpectedly'
          nav.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Build and verify warning cleanup
        shell: bash
        run: |
          set -euo pipefail
          dotnet build apps/rist-world/RistWorld.csproj -c Release 2>&1 | tee /tmp/build.log
          ! grep -q 'CS0162' /tmp/build.log
          ! grep -q 'CS8601' /tmp/build.log
      - name: Commit repairs safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/rist-world/ExternalAiAccess.cs apps/rist-world/WorldSession.Navigation.cs
          git diff --cached --check
          git commit -m 'Remove RIST build warnings'
          git pull --rebase origin live-alpha-rist-blazor-world
          dotnet build apps/rist-world/RistWorld.csproj -c Release 2>&1 | tee /tmp/rebased-build.log
          ! grep -q 'CS0162' /tmp/rebased-build.log
          ! grep -q 'CS8601' /tmp/rebased-build.log
          git push origin HEAD:live-alpha-rist-blazor-world
