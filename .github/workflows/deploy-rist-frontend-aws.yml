name: Deploy RIST Frontend to AWS

on:
  workflow_dispatch:
  push:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - 'apps/rist-world/**'
      - 'site/relic-home/**'
      - 'infra/aws/rist-frontend.yml'
      - 'infra/aws/bootstrap-secure-deploy-roles.sh'
      - '.github/workflows/deploy-rist-frontend-aws.yml'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::797661578124:role/RIST-GitHub-Deploy
  CFN_EXECUTION_ROLE_ARN: arn:aws:iam::797661578124:role/ReLiC-CloudFormation-Execution
  FRONTEND_STACK: rist-frontend
  PLATFORM_STACK: rist-platform
  TRANSLATION_STACK: rist-translation
  PRODUCTION_DOMAIN: relicgamemaster.com
  PRODUCTION_CERTIFICATE_ARN: arn:aws:acm:us-east-1:797661578124:certificate/e25800ef-28bc-43e3-8b75-aaefc0528375
  ASSET_BASE_URL: https://d2d6rnm6fnsp89.cloudfront.net/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Prepare public data
        shell: bash
        run: |
          set -euo pipefail
          PYDEPS="$RUNNER_TEMP/rist-pydeps"
          rm -rf "$PYDEPS"
          python -m pip install --disable-pip-version-check --target "$PYDEPS" Pillow==11.3.0
          PYTHONPATH="$PYDEPS${PYTHONPATH:+:$PYTHONPATH}" python apps/rist-world/prepare_public_data.py

      - name: Build RIST WORLD
        run: dotnet publish apps/rist-world/RistWorld.csproj -c Release -o build/rist

      - name: Configure AWS through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for required AWS artwork
        shell: bash
        run: |
          set -euo pipefail
          required=(
            assets/ui/mmo-toggle.webp
            assets/ui/sandbox-toggle.webp
            assets/ui/map-pin.svg
            assets/ui/icons/door.svg
            assets/ui/icons/mode.svg
            assets/ui/icons/assets.svg
            assets/ui/icons/browse.svg
            assets/ui/icons/role.svg
            assets/ui/icons/grid.svg
            assets/ui/icons/scale.svg
            assets/ui/icons/save.svg
            assets/ui/icons/load.svg
            assets/spritesheets/magic-coins.webp
          )
          for path in "${required[@]}"; do
            echo "Waiting for CDN asset: $path"
            curl --fail --location --retry 18 --retry-delay 5 --retry-all-errors --output /dev/null "${ASSET_BASE_URL}${path}"
          done

      - name: Validate frontend stack
        run: aws cloudformation validate-template --template-body file://infra/aws/rist-frontend.yml >/dev/null

      - name: Deploy protected frontend origin and CloudFront through execution role
        shell: bash
        run: |
          set -euo pipefail
          if ! aws cloudformation deploy \
            --template-file infra/aws/rist-frontend.yml \
            --stack-name "$FRONTEND_STACK" \
            --region "$AWS_REGION" \
            --role-arn "$CFN_EXECUTION_ROLE_ARN" \
            --parameter-overrides \
              DomainName="$PRODUCTION_DOMAIN" \
              CertificateArn="$PRODUCTION_CERTIFICATE_ARN" \
            --no-fail-on-empty-changeset; then
            echo "CloudFormation deployment failed. Recent failed resource events:"
            aws cloudformation describe-stack-events \
              --stack-name "$FRONTEND_STACK" \
              --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
              --output table || true
            exit 1
          fi

      - name: Inject deployed authority and translation endpoints
        shell: bash
        run: |
          set -euo pipefail
          if aws cloudformation describe-stacks --stack-name "$PLATFORM_STACK" >/dev/null 2>&1; then
            API=$(aws cloudformation describe-stacks --stack-name "$PLATFORM_STACK" --query "Stacks[0].Outputs[?OutputKey=='AuthorityApiBaseUrl'].OutputValue" --output text)
            WS=$(aws cloudformation describe-stacks --stack-name "$PLATFORM_STACK" --query "Stacks[0].Outputs[?OutputKey=='RealtimeWebSocketUrl'].OutputValue" --output text)
            if [ -n "$API" ] && [ "$API" != "None" ]; then
              printf '{"apiBaseUrl":"%s","realtimeUrl":"%s"}\n' "$API" "$WS" > build/rist/wwwroot/authority-config.json
            fi
          fi

          TRANSLATION_API=""
          for attempt in $(seq 1 30); do
            if aws cloudformation describe-stacks --stack-name "$TRANSLATION_STACK" >/dev/null 2>&1; then
              STATUS=$(aws cloudformation describe-stacks --stack-name "$TRANSLATION_STACK" --query 'Stacks[0].StackStatus' --output text)
              if [[ "$STATUS" == *"COMPLETE" ]]; then
                TRANSLATION_API=$(aws cloudformation describe-stacks --stack-name "$TRANSLATION_STACK" --query "Stacks[0].Outputs[?OutputKey=='TranslationApiBaseUrl'].OutputValue" --output text)
                if [ -n "$TRANSLATION_API" ] && [ "$TRANSLATION_API" != "None" ]; then
                  break
                fi
              fi
            fi
            echo "Waiting for $TRANSLATION_STACK translation endpoint ($attempt/30)..."
            sleep 5
          done
          printf '{"apiBaseUrl":"%s"}\n' "$TRANSLATION_API" > build/rist/wwwroot/translation-config.json
          if [ -z "$TRANSLATION_API" ]; then
            echo "::warning::Translation stack is not available yet; UI will remain in source language until the next frontend deployment."
          else
            echo "Translation endpoint injected."
          fi

      - name: Publish company site, game, and Launcher to private S3 origin
        shell: bash
        run: |
          set -euo pipefail
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$FRONTEND_STACK" --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)

          # Shaelvien art under Game/assets/shaelvien is persistent content, not build output.
          # Protect it from --delete so deployments cannot erase imported atlases/runtime crops.
          aws s3 sync build/rist/wwwroot/ "s3://${BUCKET}/Game/" \
            --delete \
            --exclude 'Launcher/*' \
            --exclude 'assets/shaelvien/*' \
            --cache-control 'public,max-age=86400' \
            --only-show-errors
          aws s3 cp build/rist/wwwroot/index.html "s3://${BUCKET}/Game/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'text/html; charset=utf-8' \
            --only-show-errors
          aws s3 cp build/rist/wwwroot/authority-config.json "s3://${BUCKET}/Game/authority-config.json" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'application/json' \
            --only-show-errors
          aws s3 cp build/rist/wwwroot/translation-config.json "s3://${BUCKET}/Game/translation-config.json" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'application/json' \
            --only-show-errors
          aws s3 cp build/rist/wwwroot/translation-config.json "s3://${BUCKET}/translation-config.json" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'application/json' \
            --only-show-errors

          aws s3 sync build/rist/wwwroot/Launcher/ "s3://${BUCKET}/Launcher/" \
            --delete \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --only-show-errors

          # Production story/banner binaries are persistent S3 content until their source
          # assets are added to the repository. Frontend deploys must preserve, not own, them.
          aws s3 sync site/relic-home/ "s3://${BUCKET}/" \
            --exclude 'index.html' \
            --exclude 'relic-story-tileset-primary.jpeg' \
            --exclude 'relic-story-1.jpg' \
            --exclude 'relic-story-2.jpg' \
            --exclude 'relic-story-3.jpg' \
            --exclude 'relic-story-4.jpg' \
            --exclude 'relic-story-5.jpg' \
            --exclude 'relic-story-6.jpg' \
            --cache-control 'public,max-age=3600' \
            --only-show-errors
          aws s3 cp site/relic-home/index.html "s3://${BUCKET}/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'text/html; charset=utf-8' \
            --only-show-errors

      - name: Invalidate and verify AWS frontend surfaces
        shell: bash
        run: |
          set -euo pipefail
          DIST=$(aws cloudformation describe-stacks --stack-name "$FRONTEND_STACK" --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue" --output text)
          URL=$(aws cloudformation describe-stacks --stack-name "$FRONTEND_STACK" --query "Stacks[0].Outputs[?OutputKey=='FrontendBaseUrl'].OutputValue" --output text)
          INVALIDATION=$(aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST" --id "$INVALIDATION"

          # Hard-fail only on surfaces and artifacts produced by this workflow.
          curl --fail --location --retry 6 --retry-delay 5 --output /tmp/relic-home.html "$URL"
          grep -q 'Game Now' /tmp/relic-home.html
          grep -q 'ReLiCGameMaster' /tmp/relic-home.html
          grep -q 'site-language' /tmp/relic-home.html

          curl --fail --location --retry 6 --retry-delay 5 --output /tmp/rist-index.html "${URL}Game/index.html"
          grep -q 'ReLiCGameMaster RIST WORLD' /tmp/rist-index.html
          grep -q 'rist-plc.js' /tmp/rist-index.html
          grep -q 'ui-language.js' /tmp/rist-index.html

          curl --fail --location --retry 6 --retry-delay 5 --output /tmp/ui-language.js "${URL}Game/ui-language.js"
          grep -q 'window.RistUiLanguage' /tmp/ui-language.js

          curl --fail --location --retry 6 --retry-delay 5 --output /tmp/translation-config.json "${URL}translation-config.json"
          grep -q 'apiBaseUrl' /tmp/translation-config.json

          curl --fail --location --retry 6 --retry-delay 5 --output /tmp/rist-plc.js "${URL}Game/rist-plc.js"
          grep -q 'window.RistPLC' /tmp/rist-plc.js
          grep -q "interaction:'shell'" /tmp/rist-plc.js

          curl --fail --location --retry 6 --retry-delay 5 --output /tmp/launcher-index.html "${URL}Launcher/index.html"
          grep -q 'ReLiC Release Launcher' /tmp/launcher-index.html
          grep -q 'QAStaging' /tmp/launcher-index.html

          STORY_MISSING=0
          for i in 1 2 3 4 5 6; do
            if ! curl --fail --location --retry 2 --retry-delay 2 --output "/tmp/relic-story-${i}.jpg" "${URL}relic-story-${i}.jpg"; then
              echo "::warning::Persistent story scene relic-story-${i}.jpg is missing from the production origin."
              STORY_MISSING=1
              continue
            fi
            if [ ! -s "/tmp/relic-story-${i}.jpg" ]; then
              echo "::warning::Persistent story scene relic-story-${i}.jpg is empty in the production origin."
              STORY_MISSING=1
            fi
          done

          echo "ReLiCGameMaster home verified at $URL"
          echo "RIST WORLD + PLC verified at ${URL}Game/index.html"
          echo "Launcher verified at ${URL}Launcher/index.html"
          if [ "$STORY_MISSING" -eq 0 ]; then
            echo "ReLiC story scenes verified at ${URL}relic-story-{1..6}.jpg"
          else
            echo "Persistent story media needs restoration, but application deployment is healthy."
          fi
