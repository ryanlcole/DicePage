name: Deploy RIST Frontend to AWS

# Edge-auth CloudFormation execution-role permissions verified 2026-09-05.
on:
  workflow_dispatch:
  push:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - 'apps/rist-world/**'
      - 'site/relic-home/**'
      - 'infra/aws/rist-frontend.yml'
      - 'infra/aws/bootstrap-secure-deploy-roles.sh'
      - '.github/workflows/deploy-rist-frontend-aws.yml'

# Production CloudFormation is a single-writer resource. Never cancel an active
# deployment: cancelling GitHub does not cancel the already-running stack update.
concurrency:
  group: rist-frontend-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::797661578124:role/RIST-GitHub-Deploy
  CFN_EXECUTION_ROLE_ARN: arn:aws:iam::797661578124:role/ReLiC-CloudFormation-Execution
  FRONTEND_STACK: rist-frontend
  AUTH_STACK: rist-discord-storage
  PLATFORM_STACK: rist-platform
  TRANSLATION_STACK: rist-translation
  PRODUCTION_DOMAIN: relicgamemaster.com
  PRODUCTION_CERTIFICATE_ARN: arn:aws:acm:us-east-1:797661578124:certificate/e25800ef-28bc-43e3-8b75-aaefc0528375
  ASSET_BASE_URL: https://d2d6rnm6fnsp89.cloudfront.net/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Prepare public data
        shell: bash
        run: |
          set -euo pipefail
          PYDEPS="$RUNNER_TEMP/rist-pydeps"
          rm -rf "$PYDEPS"
          python -m pip install --disable-pip-version-check --target "$PYDEPS" Pillow==11.3.0
          PYTHONPATH="$PYDEPS${PYTHONPATH:+:$PYTHONPATH}" python apps/rist-world/prepare_public_data.py

      - name: Build RIST WORLD
        run: dotnet publish apps/rist-world/RistWorld.csproj -c Release -o build/rist

      - name: Verify published Blazor runtime entrypoint
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_SRC=$(python - <<'PY'
          from pathlib import Path
          import re
          html = Path('build/rist/wwwroot/index.html').read_text(encoding='utf-8')
          match = re.search(r'<script[^>]+src="([^"]*blazor\.webassembly[^"/]*\.js)"', html, re.I)
          if not match:
              raise SystemExit('Published index does not contain a Blazor WebAssembly runtime script')
          print(match.group(1))
          PY
          )
          test "$RUNTIME_SRC" != '_framework/blazor.webassembly#[.{fingerprint}].js'
          test -s "build/rist/wwwroot/${RUNTIME_SRC}"
          echo "Published Blazor runtime entrypoint: ${RUNTIME_SRC}"

      - name: Configure AWS through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for frontend stack writer
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$FRONTEND_STACK" \
              --query 'Stacks[0].StackStatus' \
              --output text 2>/dev/null || echo NOT_FOUND)
            case "$STATUS" in
              *_IN_PROGRESS|REVIEW_IN_PROGRESS)
                echo "Frontend stack is busy ($STATUS); waiting for the active writer ($attempt/90)..."
                sleep 10
                ;;
              UPDATE_ROLLBACK_FAILED|ROLLBACK_FAILED|CREATE_FAILED|DELETE_FAILED)
                echo "Frontend stack is in terminal failure state: $STATUS" >&2
                exit 1
                ;;
              *)
                echo "Frontend stack is available: $STATUS"
                break
                ;;
            esac
            if [ "$attempt" = "90" ]; then
              echo "Frontend stack remained busy for 15 minutes; refusing a concurrent update." >&2
              exit 1
            fi
          done

      - name: Resolve authentication authority
        shell: bash
        run: |
          set -euo pipefail
          AUTH_API=$(aws cloudformation describe-stacks \
            --stack-name "$AUTH_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiBaseUrl'].OutputValue" \
            --output text)
          if [ -z "$AUTH_API" ] || [ "$AUTH_API" = "None" ]; then
            echo "Authentication API is unavailable; refusing to publish an unprotected game." >&2
            exit 1
          fi
          echo "AUTH_API_BASE_URL=$AUTH_API" >> "$GITHUB_ENV"
          mkdir -p site/relic-home/Play
          printf '{"apiBaseUrl":"%s"}\n' "$AUTH_API" > site/relic-home/Play/auth-config.json
          printf '{"apiBaseUrl":"%s"}\n' "$AUTH_API" > build/rist/wwwroot/auth-config.json

      - name: Wait for required AWS artwork
        shell: bash
        run: |
          set -euo pipefail
          required=(
            assets/ui/map-pin.svg
            assets/ui/icons/door.svg
            assets/ui/icons/mode.svg
            assets/ui/icons/assets.svg
            assets/ui/icons/browse.svg
            assets/ui/icons/role.svg
            assets/ui/icons/grid.svg
            assets/ui/icons/scale.svg
            assets/ui/icons/save.svg
            assets/ui/icons/load.svg
            assets/spritesheets/magic-coins.webp
          )
          for path in "${required[@]}"; do
            echo "Waiting for CDN asset: $path"
            curl --fail --location --retry 18 --retry-delay 5 --retry-all-errors --output /dev/null "${ASSET_BASE_URL}${path}"
          done

      - name: Validate frontend stack
        run: aws cloudformation validate-template --template-body file://infra/aws/rist-frontend.yml >/dev/null

      - name: Deploy protected frontend origin and CloudFront through execution role
        shell: bash
        run: |
          set -euo pipefail
          if ! aws cloudformation deploy \
            --template-file infra/aws/rist-frontend.yml \
            --stack-name "$FRONTEND_STACK" \
            --region "$AWS_REGION" \
            --role-arn "$CFN_EXECUTION_ROLE_ARN" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              DomainName="$PRODUCTION_DOMAIN" \
              CertificateArn="$PRODUCTION_CERTIFICATE_ARN" \
              AuthApiBaseUrl="$AUTH_API_BASE_URL" \
            --no-fail-on-empty-changeset; then
            echo "CloudFormation deployment failed. Recent failed resource events:"
            aws cloudformation describe-stack-events \
              --stack-name "$FRONTEND_STACK" \
              --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
              --output table || true
            exit 1
          fi

      - name: Inject deployed authority and translation endpoints
        shell: bash
        run: |
          set -euo pipefail
          if aws cloudformation describe-stacks --stack-name "$PLATFORM_STACK" >/dev/null 2>&1; then
            API=$(aws cloudformation describe-stacks --stack-name "$PLATFORM_STACK" --query "Stacks[0].Outputs[?OutputKey=='AuthorityApiBaseUrl'].OutputValue" --output text)
            WS=$(aws cloudformation describe-stacks --stack-name "$PLATFORM_STACK" --query "Stacks[0].Outputs[?OutputKey=='RealtimeWebSocketUrl'].OutputValue" --output text)
            if [ -n "$API" ] && [ "$API" != "None" ]; then
              printf '{"apiBaseUrl":"%s","realtimeUrl":"%s"}\n' "$API" "$WS" > build/rist/wwwroot/authority-config.json
            fi
          fi

          TRANSLATION_API=""
          for attempt in $(seq 1 30); do
            if aws cloudformation describe-stacks --stack-name "$TRANSLATION_STACK" >/dev/null 2>&1; then
              STATUS=$(aws cloudformation describe-stacks --stack-name "$TRANSLATION_STACK" --query 'Stacks[0].StackStatus' --output text)
              if [[ "$STATUS" == *"COMPLETE" ]]; then
                TRANSLATION_API=$(aws cloudformation describe-stacks --stack-name "$TRANSLATION_STACK" --query "Stacks[0].Outputs[?OutputKey=='TranslationApiBaseUrl'].OutputValue" --output text)
                if [ -n "$TRANSLATION_API" ] && [ "$TRANSLATION_API" != "None" ]; then
                  break
                fi
              fi
            fi
            echo "Waiting for $TRANSLATION_STACK translation endpoint ($attempt/30)..."
            sleep 5
          done
          printf '{"apiBaseUrl":"%s"}\n' "$TRANSLATION_API" > build/rist/wwwroot/translation-config.json
          if [ -z "$TRANSLATION_API" ]; then
            echo "::warning::Translation stack is not available yet; UI will remain in source language until the next frontend deployment."
          else
            echo "Translation endpoint injected."
          fi

      - name: Publish launcher, public preview, and protected game to private S3 origin
        shell: bash
        run: |
          set -euo pipefail
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$FRONTEND_STACK" --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)

          # Authenticated game. Only Game/index.html is edge-session gated; static
          # framework payload remains directly fetchable for reliable WASM boot.
          aws s3 sync build/rist/wwwroot/ "s3://${BUCKET}/Game/" \
            --delete \
            --exclude 'Launcher/*' \
            --exclude 'assets/shaelvien/*' \
            --cache-control 'private,max-age=86400' \
            --only-show-errors
          aws s3 cp build/rist/wwwroot/index.html "s3://${BUCKET}/Game/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'text/html; charset=utf-8' \
            --only-show-errors
          aws s3 cp build/rist/wwwroot/authority-config.json "s3://${BUCKET}/Game/authority-config.json" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'application/json' \
            --only-show-errors
          aws s3 cp build/rist/wwwroot/translation-config.json "s3://${BUCKET}/Game/translation-config.json" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'application/json' \
            --only-show-errors

          # Public Preview uses the same renderer but a distinct URL boundary.
          # Runtime code detects /Preview/ and disables campaign persistence and
          # private sync. It is intentionally outside the Game edge-auth behavior.
          aws s3 sync build/rist/wwwroot/ "s3://${BUCKET}/Preview/" \
            --delete \
            --exclude 'Launcher/*' \
            --exclude 'assets/shaelvien/*' \
            --cache-control 'public,max-age=3600' \
            --only-show-errors
          aws s3 cp build/rist/wwwroot/index.html "s3://${BUCKET}/Preview/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'text/html; charset=utf-8' \
            --only-show-errors

          aws s3 cp build/rist/wwwroot/translation-config.json "s3://${BUCKET}/translation-config.json" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'application/json' \
            --only-show-errors

          aws s3 sync build/rist/wwwroot/Launcher/ "s3://${BUCKET}/Launcher/" \
            --delete \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --only-show-errors

          aws s3 sync site/relic-home/ "s3://${BUCKET}/" \
            --exclude 'index.html' \
            --exclude 'relic-story-tileset-primary.jpeg' \
            --exclude 'relic-story-1.jpg' \
            --exclude 'relic-story-2.jpg' \
            --exclude 'relic-story-3.jpg' \
            --exclude 'relic-story-4.jpg' \
            --exclude 'relic-story-5.jpg' \
            --exclude 'relic-story-6.jpg' \
            --cache-control 'public,max-age=3600' \
            --only-show-errors
          aws s3 cp site/relic-home/Play/index.html "s3://${BUCKET}/Play/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'text/html; charset=utf-8' \
            --only-show-errors
          aws s3 cp site/relic-home/Play/auth-config.json "s3://${BUCKET}/Play/auth-config.json" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'application/json' \
            --only-show-errors
          aws s3 cp site/relic-home/index.html "s3://${BUCKET}/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'text/html; charset=utf-8' \
            --only-show-errors

      - name: Invalidate and verify public and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          DIST=$(aws cloudformation describe-stacks --stack-name "$FRONTEND_STACK" --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue" --output text)
          URL=$(aws cloudformation describe-stacks --stack-name "$FRONTEND_STACK" --query "Stacks[0].Outputs[?OutputKey=='FrontendBaseUrl'].OutputValue" --output text)
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$FRONTEND_STACK" --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)
          INVALIDATION=$(aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/index.html' '/Play/*' '/Preview/*' '/Game/*' '/translation-config.json' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST" --id "$INVALIDATION"

          curl --fail --location --retry 6 --retry-delay 5 --output /tmp/relic-home.html "$URL"
          grep -q 'Game Now' /tmp/relic-home.html
          grep -q 'ReLiCGameMaster' /tmp/relic-home.html

          curl --fail --location --retry 6 --retry-delay 5 --output /tmp/play.html "${URL}Play/index.html"
          grep -q 'SHAELVIEN' /tmp/play.html
          grep -q 'Sign In' /tmp/play.html
          grep -q 'Preview' /tmp/play.html

          # Preview must be public and serve the actual RIST runtime, not a redirect
          # or a copy of the marketing home page.
          PREVIEW_STATUS=$(curl --silent --show-error --output /tmp/preview.html --write-out '%{http_code}' "${URL}Preview/index.html")
          test "$PREVIEW_STATUS" = "200"
          grep -q 'ReLiCGameMaster RIST WORLD' /tmp/preview.html

          # Game HTML remains authenticated at the edge.
          STATUS=$(curl --silent --show-error --output /tmp/anonymous-game.html --dump-header /tmp/anonymous-game.headers --write-out '%{http_code}' "${URL}Game/index.html")
          test "$STATUS" = "302"
          grep -Eiq '^location: /Play/' /tmp/anonymous-game.headers
          if grep -q 'ReLiCGameMaster RIST WORLD' /tmp/anonymous-game.html; then
            echo "Anonymous request received protected game HTML." >&2
            exit 1
          fi

          RUNTIME_SRC=$(python - <<'PY'
          from pathlib import Path
          import re
          html = Path('build/rist/wwwroot/index.html').read_text(encoding='utf-8')
          match = re.search(r'<script[^>]+src="([^"]*blazor\.webassembly[^"/]*\.js)"', html, re.I)
          if not match:
              raise SystemExit('Published index does not contain a Blazor WebAssembly runtime script')
          print(match.group(1))
          PY
          )
          STATUS=$(curl --silent --show-error --output /tmp/anonymous-runtime.js --dump-header /tmp/anonymous-runtime.headers --write-out '%{http_code}' "${URL}Game/${RUNTIME_SRC}")
          test "$STATUS" = "200"
          test "$(stat -c%s /tmp/anonymous-runtime.js)" -gt 1000
          if grep -Eiq '<!doctype html|<html' /tmp/anonymous-runtime.js; then
            echo "Published Blazor runtime request returned HTML instead of JavaScript: ${RUNTIME_SRC}" >&2
            exit 1
          fi
          grep -Eiq '^content-type: (application|text)/(javascript|x-javascript)' /tmp/anonymous-runtime.headers || {
            echo "Published Blazor runtime has an unexpected Content-Type: ${RUNTIME_SRC}" >&2
            cat /tmp/anonymous-runtime.headers >&2
            exit 1
          }

          aws s3 cp "s3://${BUCKET}/Game/index.html" /tmp/rist-index.html --only-show-errors
          grep -q 'ReLiCGameMaster RIST WORLD' /tmp/rist-index.html
          grep -q 'rist-plc.js' /tmp/rist-index.html
          grep -Fq "$RUNTIME_SRC" /tmp/rist-index.html

          curl --fail --location --retry 6 --retry-delay 5 --output /tmp/translation-config.json "${URL}translation-config.json"
          grep -q 'apiBaseUrl' /tmp/translation-config.json

          curl --fail --location --retry 6 --retry-delay 5 --output /tmp/launcher-index.html "${URL}Launcher/index.html"
          grep -q 'ReLiC Release Launcher' /tmp/launcher-index.html

          echo "ReLiCGameMaster home verified at $URL"
          echo "Public account launcher verified at ${URL}Play/index.html"
          echo "Public nonpersistent preview verified at ${URL}Preview/index.html"
          echo "Anonymous Game/index.html correctly blocked at the edge"
          echo "Blazor framework payload verified at ${URL}Game/${RUNTIME_SRC}"
          echo "Protected RIST payload verified directly in private S3 origin"
