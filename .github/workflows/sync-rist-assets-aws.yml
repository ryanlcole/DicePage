name: Sync RIST Assets to AWS

on:
  push:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - 'apps/rist-world/wwwroot/assets/**'
      - 'apps/rist-world/prepare_public_data.py'
      - 'apps/rist-world/prepare_aws_assets.py'
      - '.github/workflows/sync-rist-assets-aws.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::797661578124:role/RIST-GitHub-Deploy
  ASSET_BUCKET: rist-assets-assetbucket-curjzuwjbjtv
  DISTRIBUTION_ID: E1D9TALLP51FI5
  FRONTEND_STACK: rist-frontend
  ASSET_BASE_URL: https://d2d6rnm6fnsp89.cloudfront.net/

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Prepare image tooling
        run: |
          python -m venv build/asset-tools-venv
          build/asset-tools-venv/bin/python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Normalize public assets and inventory
        run: build/asset-tools-venv/bin/python apps/rist-world/prepare_public_data.py
      - run: dotnet publish apps/rist-world/RistWorld.csproj -c Release -o build/rist
      - name: Configure AWS through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish all runtime art
        run: |
          # Registered Pangea sprites are promoted binary assets. They are not all
          # stored in git, so a blanket --delete must never remove that authority.
          aws s3 sync build/rist/wwwroot/assets/ "s3://${ASSET_BUCKET}/assets/" \
            --delete \
            --exclude 'sprites/pangea/registered/*' \
            --only-show-errors
      - name: Restore registered Pangea sprites from frontend mirror
        shell: bash
        run: |
          set -euo pipefail
          FRONTEND_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$FRONTEND_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)
          test -n "$FRONTEND_BUCKET"
          test "$FRONTEND_BUCKET" != "None"
          aws s3 sync \
            "s3://${FRONTEND_BUCKET}/Game/assets/sprites/pangea/registered/" \
            "s3://${ASSET_BUCKET}/assets/sprites/pangea/registered/" \
            --only-show-errors
      - name: Stage world atlas and card assets
        run: python apps/rist-world/prepare_aws_assets.py
      - name: Publish world atlas and card assets
        run: aws s3 sync build/aws-assets/ "s3://${ASSET_BUCKET}/" --only-show-errors
      - name: Refresh CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/assets/*' '/worlds/*' '/atlas/*' '/cards/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$ID"
      - name: Verify critical CDN assets
        shell: bash
        run: |
          set -euo pipefail
          verify_asset() {
            local path="$1"
            local min_bytes="$2"
            local target="/tmp/$(basename "$path")"
            curl --fail --location --retry 6 --retry-delay 5 --output "$target" "${ASSET_BASE_URL}${path}"
            test "$(stat -c%s "$target")" -gt "$min_bytes"
          }

          # Standalone static controls. These must never be served as atlas crops.
          verify_asset assets/ui/mmo-toggle.webp 1000
          verify_asset assets/ui/sandbox-toggle.webp 1000
          verify_asset assets/ui/map-pin.svg 300
          verify_asset assets/ui/icons/door.svg 100
          verify_asset assets/ui/icons/mode.svg 100
          verify_asset assets/ui/icons/assets.svg 100
          verify_asset assets/ui/icons/browse.svg 100
          verify_asset assets/ui/icons/role.svg 100
          verify_asset assets/ui/icons/grid.svg 100
          verify_asset assets/ui/icons/scale.svg 100
          verify_asset assets/ui/icons/save.svg 100
          verify_asset assets/ui/icons/load.svg 100

          # Functional multi-frame sprite sheets are intentional.
          verify_asset assets/spritesheets/magic-coins.webp 1000
          verify_asset assets/spritesheets/directional-humanoids.webp 1000

          # These registered Pangea sprites are external binary authorities mirrored
          # into the frontend bucket; protect and verify them on every asset sync.
          verify_asset assets/sprites/pangea/registered/GEO_X00_Y00/geonaph_geo_x00_y00_t00_l00_ocean_floor_v001.png 1000
          verify_asset assets/sprites/pangea/registered/GEO_X00_Y00/geonaph_geo_x00_y00_t00_l09_ocean_surface_v001.png 1000

# Deployment trigger: OIDC trust repaired 2026-08-27
