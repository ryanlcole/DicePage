name: Keep EIOS Lab Unpublished

on:
  workflow_dispatch:
  push:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - '.github/workflows/deploy-eios-lab.yml'

concurrency:
  group: deploy-eios-lab
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::797661578124:role/RIST-GitHub-Deploy
  FRONTEND_STACK: rist-frontend

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Remove EIOS lab from public origin
        shell: bash
        run: |
          set -euo pipefail
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$FRONTEND_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)
          DIST=$(aws cloudformation describe-stacks --stack-name "$FRONTEND_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue" --output text)
          test -n "$BUCKET"
          test "$BUCKET" != "None"
          test -n "$DIST"
          test "$DIST" != "None"

          aws s3 rm "s3://${BUCKET}/eios-lab/" --recursive --only-show-errors

          INVALIDATION=$(aws cloudfront create-invalidation \
            --distribution-id "$DIST" \
            --paths '/eios-lab' '/eios-lab/*' \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST" --id "$INVALIDATION"

      - name: Verify EIOS page is no longer published
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(curl --silent --location --retry 6 --retry-delay 3 --write-out '\n%{http_code}' \
            https://relicgamemaster.com/eios-lab/index.html)
          STATUS=$(printf '%s' "$BODY" | tail -n 1)
          CONTENT=$(printf '%s' "$BODY" | sed '$d')
          if printf '%s' "$CONTENT" | grep -q 'EIOS LAB'; then
            echo 'EIOS LAB is still publicly served.' >&2
            exit 1
          fi
          echo "EIOS public page removed; current HTTP status: $STATUS"
