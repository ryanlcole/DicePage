name: Deploy RIST WORLD Public
# non-overlapping-rolls-10
on: [workflow_dispatch, push]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-alpha-rist-blazor-world
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: python apps/rist-world/prepare_public_data.py
      - run: dotnet publish apps/rist-world/RistWorld.csproj -c Release -o build/rist
      - run: mkdir -p dist/app && cp -r build/rist/wwwroot/. dist/app/ && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4
