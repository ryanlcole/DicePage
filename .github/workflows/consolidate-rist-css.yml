name: Consolidate RIST CSS

on:
  push:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - '.github/workflows/consolidate-rist-css.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: live-alpha-rist-blazor-world

      - name: Build canonical stylesheet from last archived-source commit
        shell: bash
        run: |
          set -euo pipefail
          PRE_CLEAN=e676e80276d4f056d9c3511e20b497f808f23105
          rm -rf /tmp/rist-preclean
          git worktree add --detach /tmp/rist-preclean "$PRE_CLEAN"
          python /tmp/rist-preclean/apps/rist-world/prepare_css.py
          cp /tmp/rist-preclean/apps/rist-world/wwwroot/css/rist.css apps/rist-world/wwwroot/css/rist.css
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/rist-world/wwwroot/css/rist.css')
          text=p.read_text(encoding='utf-8')
          text=text.replace('/* AUTO-GENERATED by apps/rist-world/prepare_css.py. */','/* RIST CANONICAL STYLESHEET — consolidated 2026-09-05. */',1)
          text=text.replace('/* rist.css is the only runtime stylesheet. */','/* This file is source authority; do not rebuild it from archived .old files. */',1)
          p.write_text(text,encoding='utf-8')
          PY
          git worktree remove --force /tmp/rist-preclean

      - name: Remove archived CSS build dependency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/rist-world/RistWorld.csproj')
          text=p.read_text(encoding='utf-8')
          line='    <Exec Command="python &quot;$(MSBuildProjectDirectory)/prepare_css.py&quot;" />\n'
          if line not in text:
              raise SystemExit('prepare_css build hook not found')
          p.write_text(text.replace(line,'',1),encoding='utf-8')
          PY
          git rm apps/rist-world/prepare_css.py

      - name: Validate consolidated source
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/rist-world/wwwroot/css/rist.css
          if grep -q 'Missing archived CSS' apps/rist-world/RistWorld.csproj; then exit 1; fi
          dotnet --version >/dev/null 2>&1 || true
          git diff --stat

      - name: Commit canonical CSS
        shell: bash
        run: |
          set -euo pipefail
          git add apps/rist-world/wwwroot/css/rist.css apps/rist-world/RistWorld.csproj
          git config user.name 'ReLiC CSS Consolidation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Make rist.css the canonical stylesheet'
          git push origin HEAD:live-alpha-rist-blazor-world
