name: ReLiC Observatory CI

on:
  push:
    branches:
      - relic-independent-service
    paths:
      - 'services/relic-host/**'
      - 'infra/aws/relic-observatory-ingest.yml'
      - '.github/workflows/relic-observatory-ci.yml'
  pull_request:
    paths:
      - 'services/relic-host/**'
      - 'infra/aws/relic-observatory-ingest.yml'
      - '.github/workflows/relic-observatory-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  RELIC_OBSERVATORY_ROLE_ARN: ${{ vars.RELIC_OBSERVATORY_ROLE_ARN }}
  RELIC_OBSERVATORY_FUNCTION: relic-observatory-ingest

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/relic-host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/relic-host/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Compile ReLiC host and Observatory
        run: >
          python -m py_compile
          app.py
          historical_import.py
          continuity_writer.py
          continuity_client.py
          mcp_server.py
          observatory.py
          github_observer.py
          project_observer.py
          project_drift_guard.py
          relic_collector.py
          observatory_ingest/lambda_handler.py
          observatory_ingest/validation.py

      - name: Run ReLiC host and Observatory tests
        run: >
          pytest -q
          test_relic_host.py
          test_continuity_writer.py
          test_continuity_deploy.py
          test_observatory.py
          test_github_observer.py
          test_relic_collector.py
          test_observatory_ingest_lambda.py

      - name: Fetch Shaelvien implementation branch
        run: git fetch origin live-alpha-rist-blazor-world:refs/remotes/origin/live-alpha-rist-blazor-world

      - name: Generate bounded Shaelvien project-state evidence
        run: python project_observer.py --project SHAELVIEN --ref origin/live-alpha-rist-blazor-world --output shaelvien-project-state.json

      - name: Assert configured Shaelvien paths were enumerated
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(Path("shaelvien-project-state.json").read_text(encoding="utf-8"))
          paths = document["event"]["payload"]["paths"]
          expected = {"apps/rist-world/", "site/relic-home/Game/", "docs/"}
          observed = {item["path"] for item in paths}
          if observed != expected:
              raise SystemExit(
                  f"project-state path set mismatch: expected={sorted(expected)} observed={sorted(observed)}"
              )
          empty = [item["path"] for item in paths if item.get("tracked_entries", 0) <= 0]
          if empty:
              raise SystemExit(f"configured project paths produced no tracked entries: {empty}")
          print(json.dumps({item["path"]: item["tracked_entries"] for item in paths}, sort_keys=True))
          PY

      - name: Validate Shaelvien project-state boundary
        run: python relic_collector.py shaelvien-project-state.json --dry-run

      - name: Upload Shaelvien project-state evidence
        uses: actions/upload-artifact@v4
        with:
          name: relic-shaelvien-project-state-${{ github.sha }}
          path: services/relic-host/shaelvien-project-state.json
          if-no-files-found: error
          retention-days: 30

      - name: Generate code-change observation
        if: github.event_name == 'push'
        run: python github_observer.py "$GITHUB_EVENT_PATH" --output observatory-code-change.json

      - name: Validate observation boundary
        if: github.event_name == 'push'
        run: python relic_collector.py observatory-code-change.json --dry-run

      - name: Upload observation evidence
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: relic-observatory-code-change-${{ github.sha }}
          path: services/relic-host/observatory-code-change.json
          if-no-files-found: error
          retention-days: 30

      - name: Configure short-lived AWS credentials
        if: github.event_name == 'push' && env.RELIC_OBSERVATORY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.RELIC_OBSERVATORY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Append observation through private AWS boundary
        if: github.event_name == 'push' && env.RELIC_OBSERVATORY_ROLE_ARN != ''
        run: |
          aws lambda invoke \
            --function-name "$RELIC_OBSERVATORY_FUNCTION" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload fileb://observatory-code-change.json \
            observatory-ingest-response.json

          python - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(Path("observatory-ingest-response.json").read_text(encoding="utf-8"))
          if response.get("stored") is not True:
              raise SystemExit(f"ReLiC ingestion did not report stored=true: {response}")
          if response.get("observation_status") != "OBSERVATION":
              raise SystemExit(f"unexpected observation status: {response}")
          if response.get("canon_promoted") is not False:
              raise SystemExit(f"invalid canon promotion result: {response}")
          print(json.dumps({
              "stored": True,
              "id": response.get("id"),
              "payload_hash": response.get("payload_hash"),
              "observation_status": response.get("observation_status"),
              "canon_promoted": response.get("canon_promoted"),
          }, sort_keys=True))
          PY

      - name: Append Shaelvien project-state through private AWS boundary
        if: github.event_name == 'push' && env.RELIC_OBSERVATORY_ROLE_ARN != ''
        run: |
          aws lambda invoke \
            --function-name "$RELIC_OBSERVATORY_FUNCTION" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload fileb://shaelvien-project-state.json \
            shaelvien-project-ingest-response.json

          python - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(Path("shaelvien-project-ingest-response.json").read_text(encoding="utf-8"))
          if response.get("stored") is not True:
              raise SystemExit(f"Shaelvien project-state ingestion did not report stored=true: {response}")
          if response.get("observation_status") != "OBSERVATION":
              raise SystemExit(f"unexpected Shaelvien observation status: {response}")
          if response.get("canon_promoted") is not False:
              raise SystemExit(f"invalid Shaelvien canon promotion result: {response}")
          print(json.dumps({
              "stored": True,
              "id": response.get("id"),
              "payload_hash": response.get("payload_hash"),
              "observation_status": response.get("observation_status"),
              "canon_promoted": response.get("canon_promoted"),
          }, sort_keys=True))
          PY

      - name: Report private ingestion not configured
        if: github.event_name == 'push' && env.RELIC_OBSERVATORY_ROLE_ARN == ''
        run: >
          echo 'Observations verified and retained as CI evidence;
          private AWS ingestion is not configured until the
          RELIC_OBSERVATORY_ROLE_ARN repository variable is set.'

