name: Geonaph Tier Asset Audit

on:
  push:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - 'apps/rist-world/wwwroot/prototype/prototype.js'
      - 'apps/rist-world/wwwroot/prototype/prototype.css'
      - '.github/workflows/geonaph-tier-asset-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image inspector
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.3.3
      - name: Inspect canonical Geonaph tier PNGs
        shell: bash
        env:
          ROOT: https://d2d6rnm6fnsp89.cloudfront.net/library/terrains/standard/world/whole_maps/geonaph
        run: |
          set -euo pipefail
          mkdir -p /tmp/geonaph-tier-audit
          curl --fail --location --retry 8 --retry-delay 3 --output /tmp/geonaph-tier-audit/surface.png "$ROOT/geonaph_full_static_canonical_surface_v001.png"
          curl --fail --location --retry 8 --retry-delay 3 --output /tmp/geonaph-tier-audit/highlands.png "$ROOT/geonaph_full_static_highlands_rivers_v001.png"
          curl --fail --location --retry 8 --retry-delay 3 --output /tmp/geonaph-tier-audit/mountains.png "$ROOT/geonaph_full_static_mountain_volcanic_archipelago_v001.png"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          root = Path('/tmp/geonaph-tier-audit')
          report = {}
          sizes = set()
          for key in ('surface', 'highlands', 'mountains'):
              path = root / f'{key}.png'
              with Image.open(path) as im:
                  rgba = im.convert('RGBA')
                  alpha = rgba.getchannel('A')
                  lo, hi = alpha.getextrema()
                  histogram = alpha.histogram()
                  pixels = rgba.width * rgba.height
                  transparent = sum(histogram[:255])
                  fully_transparent = histogram[0]
                  report[key] = {
                      'width': rgba.width,
                      'height': rgba.height,
                      'mode': im.mode,
                      'alpha_min': lo,
                      'alpha_max': hi,
                      'transparent_pixels': transparent,
                      'fully_transparent_pixels': fully_transparent,
                      'transparent_fraction': round(transparent / pixels, 6),
                  }
                  sizes.add((rgba.width, rgba.height))

          print(json.dumps(report, indent=2, sort_keys=True))
          if len(sizes) != 1:
              print('::warning::Geonaph canonical tier images do not share one pixel frame.')
          if next(iter(sizes))[0] != next(iter(sizes))[1]:
              print('::warning::Geonaph canonical tier frame is not square.')
          for key in ('highlands', 'mountains'):
              if report[key]['transparent_pixels'] == 0:
                  print(f'::warning::{key} has no transparent pixels; it cannot reveal the tier below.')

          # Diagnose whether an opaque upper tier can safely be converted into a
          # delta overlay against the composited lower stack.
          import numpy as np
          surface = np.asarray(Image.open(root / 'surface.png').convert('RGBA'), dtype=np.int16)
          highlands = np.asarray(Image.open(root / 'highlands.png').convert('RGBA'), dtype=np.int16)
          mountains = np.asarray(Image.open(root / 'mountains.png').convert('RGBA'), dtype=np.int16)

          base = surface.copy()
          ha = highlands[..., 3:4] / 255.0
          base[..., :3] = np.rint(highlands[..., :3] * ha + base[..., :3] * (1.0 - ha)).astype(np.int16)
          base[..., 3] = 255

          delta = np.abs(mountains[..., :3] - base[..., :3]).max(axis=2)
          flat = delta.reshape(-1)
          quantiles = {str(q): float(np.quantile(flat, q)) for q in (0.25, 0.5, 0.75, 0.9, 0.95, 0.99)}
          thresholds = {str(t): round(float((flat <= t).mean()), 6) for t in (2, 4, 8, 12, 16, 24, 32, 48, 64)}
          print(json.dumps({'mountain_vs_lower_delta_quantiles': quantiles, 'candidate_transparent_fraction': thresholds}, indent=2, sort_keys=True))

          # Candidate recovery masks for the opaque mountain export. The source
          # screenshot shows the lost alpha as ocean/background; measure blue-water
          # segmentation before any production replacement is allowed.
          rgb = mountains[..., :3].astype(np.float32)
          r, g, b = rgb[..., 0], rgb[..., 1], rgb[..., 2]
          mx = np.maximum(np.maximum(r, g), b)
          mn = np.minimum(np.minimum(r, g), b)
          sat = (mx - mn) / np.maximum(mx, 1.0)
          masks = {
              'conservative': (b > 70) & (b >= g * 1.05) & (b >= r * 1.22) & ((b - r) >= 24) & (sat >= .18),
              'balanced': (b > 60) & (b >= g * 1.02) & (b >= r * 1.15) & ((b - r) >= 18) & (sat >= .14),
              'broad': (b > 50) & (b >= g) & (b >= r * 1.10) & ((b - r) >= 12) & (sat >= .10),
          }
          print(json.dumps({'mountain_water_mask_fraction': {k: round(float(v.mean()), 6) for k, v in masks.items()}}, indent=2, sort_keys=True))
          PY
