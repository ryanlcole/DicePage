name: RIST Auth Regression

on:
  push:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - 'apps/rist-world/**'
      - 'site/relic-home/Play/**'
      - 'infra/aws/rist-frontend.yml'
      - '.github/workflows/deploy-rist-frontend-aws.yml'
      - '.github/workflows/deploy-rist-discord-auth.yml'
      - '.github/workflows/rist-auth-regression.yml'
  pull_request:
    paths:
      - 'apps/rist-world/**'
      - 'site/relic-home/Play/**'
      - 'infra/aws/rist-frontend.yml'
      - '.github/workflows/deploy-rist-frontend-aws.yml'
      - '.github/workflows/deploy-rist-discord-auth.yml'
      - '.github/workflows/rist-auth-regression.yml'

permissions:
  contents: read

jobs:
  auth-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build RIST WORLD
        run: dotnet build apps/rist-world/RistWorld.csproj -c Release --nologo

      - name: Enforce launcher and game authority boundaries
        shell: bash
        run: |
          set -euo pipefail

          # /Game is a runtime gate, never a second account launcher.
          grep -q '<RistWorld.Components.AuthenticatedWorld />' apps/rist-world/App.razor
          grep -q '<WorldTable />' apps/rist-world/Components/AuthenticatedWorld.razor
          grep -q '<LauncherStartupBridge />' apps/rist-world/Components/AuthenticatedWorld.razor
          grep -q 'Auth.InitializeAsync' apps/rist-world/Components/AuthenticatedWorld.razor
          grep -q 'Navigation.NavigateTo("/Play/", forceLoad: true)' apps/rist-world/Components/AuthenticatedWorld.razor
          grep -q 'rist.launch.intent' apps/rist-world/Components/AuthenticatedWorld.razor
          grep -q '"preview"' apps/rist-world/Components/AuthenticatedWorld.razor
          ! grep -q '>Sign In<' apps/rist-world/Components/AuthenticatedWorld.razor
          ! grep -q '>Sign Up<' apps/rist-world/Components/AuthenticatedWorld.razor
          ! test -e apps/rist-world/wwwroot/auth-entry.js
          ! grep -q 'auth-entry.js' apps/rist-world/wwwroot/index.html

          # Launcher handoff is one-shot and canonicalizes role/domain in WorldSession.
          test -f apps/rist-world/Components/LauncherStartupBridge.razor
          grep -q 'Session.ApplyLauncherStartupAsync' apps/rist-world/Components/LauncherStartupBridge.razor
          grep -q 'sessionStorage.removeItem", LauncherIntentKey' apps/rist-world/WorldSession.Launcher.cs
          grep -q 'sessionStorage.removeItem", LauncherSettingsKey' apps/rist-world/WorldSession.Launcher.cs
          grep -q 'isPreview' apps/rist-world/WorldSession.Launcher.cs
          grep -q 'Roleplayer", "RIST Sandbox' apps/rist-world/WorldSession.Launcher.cs
          grep -q 'IsSandboxDomain' apps/rist-world/WorldSession.Launcher.cs
          grep -q 'RIST Sandbox' apps/rist-world/WorldSession.Launcher.cs

          # Idle authenticated sessions return to the one public entry authority.
          grep -q 'clearEdgeCookie' apps/rist-world/wwwroot/rist.js
          grep -q 'Max-Age=0' apps/rist-world/wwwroot/rist.js
          grep -q "location.replace('/Play/?reason=idle')" apps/rist-world/wwwroot/rist.js

          # /Play owns sign-in, signup, settings, campaign choice and Preview.
          test -f site/relic-home/Play/index.html
          test -f site/relic-home/Play/launcher.js
          grep -q 'Press any key to continue' site/relic-home/Play/index.html
          grep -q '>Sign In<' site/relic-home/Play/index.html
          grep -q '>Sign Up<' site/relic-home/Play/index.html
          grep -q '>Preview<' site/relic-home/Play/index.html
          grep -q '>New Campaign<' site/relic-home/Play/index.html
          grep -q '>Load Campaign<' site/relic-home/Play/index.html
          grep -q '>Settings<' site/relic-home/Play/index.html
          grep -q 'GameMaster' site/relic-home/Play/index.html
          grep -q 'Roleplayer' site/relic-home/Play/index.html
          grep -q 'Shaelvien MMO' site/relic-home/Play/index.html
          grep -q 'RIST Sandbox' site/relic-home/Play/index.html
          grep -q 'launcher.js' site/relic-home/Play/index.html
          grep -q "const game='/Game/index.html'" site/relic-home/Play/launcher.js
          grep -q "const previewGame='/Game/index.html?preview=Geonaph'" site/relic-home/Play/launcher.js
          grep -q "const defaultSettings={role:'Roleplayer',domain:'Shaelvien MMO'}" site/relic-home/Play/launcher.js
          grep -q "role:'Roleplayer',domain:'RIST Sandbox',inviteCode:'Geonaph'" site/relic-home/Play/launcher.js
          grep -q "sessionStorage.setItem('rist.launch.intent',preview?'preview':intent||'load')" site/relic-home/Play/launcher.js
          grep -q 'location.assign(preview?previewGame:game)' site/relic-home/Play/launcher.js
          grep -q '/auth/session?handoff=' site/relic-home/Play/launcher.js
          grep -q 'rist_session' site/relic-home/Play/launcher.js

          # Plain /Game remains account-protected. Only the canonical Geonaph
          # preview query can bypass the edge session check; runtime remains read-only.
          grep -q 'PathPattern: Game/index.html' infra/aws/rist-frontend.yml
          grep -q 'EventType: viewer-request' infra/aws/rist-frontend.yml
          grep -q "const PUBLIC_PREVIEW = 'Geonaph'" infra/aws/rist-frontend.yml
          grep -q 'isPublicPreview(request)' infra/aws/rist-frontend.yml
          grep -q "params.get('preview') === PUBLIC_PREVIEW" infra/aws/rist-frontend.yml
          grep -q "if (isPublicPreview(request)) return request" infra/aws/rist-frontend.yml
          grep -q "if (!token) return redirect('login')" infra/aws/rist-frontend.yml
          grep -q 'GameEdgeAuthVersion' infra/aws/rist-frontend.yml
          grep -q '/Play/?reason=' infra/aws/rist-frontend.yml
          grep -q 'AuthApiBaseUrl' infra/aws/rist-frontend.yml
          grep -q 'PRODUCTION_PLAY_URL: https://relicgamemaster.com/Play/index.html' .github/workflows/deploy-rist-discord-auth.yml
          grep -q 'refusing to publish an unprotected game' .github/workflows/deploy-rist-frontend-aws.yml
          grep -q 'Anonymous Game/index.html correctly blocked at the edge' .github/workflows/deploy-rist-frontend-aws.yml

          echo 'RIST launcher, preview, authentication and runtime authority checks passed.'
