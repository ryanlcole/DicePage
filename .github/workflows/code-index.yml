name: Code Index Governance

on:
  push:
    branches:
      - live-alpha-rist-blazor-world
  pull_request:
    branches:
      - live-alpha-rist-blazor-world
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify the exact branch head without recording another governance commit
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: code-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check governance tools
        run: python -m py_compile tools/code_index.py tools/code_database.py tools/semantic_units.py tools/compact_code_registry.py

      - name: Verify language contract discovery stays synchronized
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          contract_path = Path('.code-index/humans_language.json')
          manifest_path = Path('apps/rist-world/wwwroot/.well-known/shaelvien-language.json')

          contract_bytes = contract_path.read_bytes()
          contract = json.loads(contract_bytes)
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          expected_path = manifest['discovery']['canonical_contract']
          if expected_path != contract_path.as_posix():
              raise SystemExit(
                  f'Language discovery points to {expected_path!r}, expected {contract_path.as_posix()!r}'
              )

          contract_version = contract['version']
          manifest_version = manifest['language']['version']
          if contract_version != manifest_version:
              raise SystemExit(
                  f'Language version drift: contract={contract_version} manifest={manifest_version}'
              )

          actual_hash = hashlib.sha256(contract_bytes).hexdigest()
          expected_hash = manifest['discovery']['canonical_contract_sha256']
          if actual_hash != expected_hash:
              raise SystemExit(
                  'Language contract hash drift: update the deployed manifest when the canonical contract changes. '
                  f'expected={expected_hash} actual={actual_hash}'
              )

          print(f'Language contract v{contract_version} synchronized: {actual_hash}')
          PY

      - name: Build searchable code ledger
        run: python tools/code_index.py build

      - name: Assert governance build did not mutate source truth
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- . ':(exclude).code-index/**'; then
            echo "::error::Governance verification mutated tracked files outside .code-index. Cleanup/materialization require an explicit maintenance change, not CI observer authority."
            git diff -- . ':(exclude).code-index/**'
            exit 1
          fi

      - name: Build CHID relationship and error database
        run: python tools/code_database.py build

      - name: Load Rune Glyph and SHAEP semantic relationships
        run: python tools/semantic_units.py install

      - name: Flag repeated and regressed errors
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path('.code-index/code_graph.sqlite3')
          if not path.exists():
              raise SystemExit(0)

          db = sqlite3.connect(path)
          rows = db.execute('''
              SELECT error_id, language, error_code, occurrence_count,
                     repeat_flag, regression_flag, normalized_message
              FROM error_signatures
              WHERE repeat_flag = 1 OR regression_flag = 1
              ORDER BY regression_flag DESC, occurrence_count DESC, error_id
          ''').fetchall()
          db.close()

          for error_id, language, error_code, count, repeat_flag, regression_flag, message in rows:
              level = 'REGRESSION' if regression_flag else 'REPEATED'
              code = f' {error_code}' if error_code else ''
              clean = (message or '').replace('\n', ' ')[:700]
              print(f'::warning title={level} {language} error::{error_id}{code} seen {count} times — {clean}')
          PY

      - name: Verify governance invariants
        run: python tools/code_index.py verify

      - name: Show index and graph health
        run: |
          cat .code-index/summary.json
          echo "--- code database ---"
          cat .code-index/code_database_summary.json
          echo "--- semantic units ---"
          python tools/semantic_units.py find "" || true
          echo "--- duplicate report ---"
          python tools/code_index.py duplicates | head -n 120
          echo "--- stale/generated report ---"
          python tools/code_index.py stale | head -n 120
          echo "--- repeated/regressed errors ---"
          python tools/code_database.py find-error "" || true

      - name: Compact persistent code identity ownership
        run: |
          python tools/compact_code_registry.py compact
          python tools/compact_code_registry.py verify

      - name: Record durable governance state only
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verify_only != true)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "shaelvien-code-index"
          git config user.email "actions@users.noreply.github.com"

          durable=(
            .code-index/id_registry.json
            .code-index/chid_registry.json
            .code-index/duplicate_baseline.json
            .code-index/summary.json
            .code-index/code_database_summary.json
            .code-index/relationships.mmd
            .code-index/relationships.dot
            .code-index/cleanup_log.jsonl
            .code-index/runtime_errors.jsonl
          )
          for path in "${durable[@]}"; do
            if [ -e "$path" ]; then
              git add -f -- "$path"
            fi
          done

          if ! git diff --quiet -- . ':(exclude).code-index/**'; then
            echo "::error::Governance attempted to mutate source truth outside .code-index; refusing recorder commit."
            git diff -- . ':(exclude).code-index/**'
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Code identity, semantic graph, and governance evidence are already current."
            exit 0
          fi

          git commit -m "Refresh governed code identity and semantic graph"
          git push origin HEAD:live-alpha-rist-blazor-world
          exact_head="$(git rev-parse HEAD)"
          echo "Recorded exact governed head: $exact_head"

          gh workflow run code-index.yml --ref live-alpha-rist-blazor-world -f verify_only=true
          gh workflow run compliance-guardrails.yml --ref live-alpha-rist-blazor-world
          gh workflow run deploy-rist-frontend-aws.yml --ref live-alpha-rist-blazor-world
          gh workflow run deploy-live-alpha-public.yml --ref live-alpha-rist-blazor-world
