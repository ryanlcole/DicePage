name: Code Index Governance

on:
  push:
    branches:
      - live-alpha-rist-blazor-world
  pull_request:
    branches:
      - live-alpha-rist-blazor-world
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: code-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check governance tools
        run: python -m py_compile tools/code_index.py tools/code_database.py tools/semantic_units.py

      - name: Verify language contract discovery stays synchronized
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          contract_path = Path('.code-index/humans_language.json')
          manifest_path = Path('apps/rist-world/wwwroot/.well-known/shaelvien-language.json')

          contract_bytes = contract_path.read_bytes()
          contract = json.loads(contract_bytes)
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          expected_path = manifest['discovery']['canonical_contract']
          if expected_path != contract_path.as_posix():
              raise SystemExit(
                  f'Language discovery points to {expected_path!r}, expected {contract_path.as_posix()!r}'
              )

          contract_version = contract['version']
          manifest_version = manifest['language']['version']
          if contract_version != manifest_version:
              raise SystemExit(
                  f'Language version drift: contract={contract_version} manifest={manifest_version}'
              )

          actual_hash = hashlib.sha256(contract_bytes).hexdigest()
          expected_hash = manifest['discovery']['canonical_contract_sha256']
          if actual_hash != expected_hash:
              raise SystemExit(
                  'Language contract hash drift: update the deployed manifest when the canonical contract changes. '
                  f'expected={expected_hash} actual={actual_hash}'
              )

          print(f'Language contract v{contract_version} synchronized: {actual_hash}')
          PY

      - name: Build searchable code ledger
        run: python tools/code_index.py build

      - name: Verify code identity uniqueness before semantic database
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          path = Path('.code-index/code_index.jsonl')
          by_id = defaultdict(list)
          for raw in path.read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              row = json.loads(raw)
              by_id[str(row.get('id', ''))].append(row)

          collisions = {code_id: rows for code_id, rows in by_id.items() if code_id and len(rows) > 1}
          if not collisions:
              print(f'Identity uniqueness OK: {sum(len(rows) for rows in by_id.values())} records')
              raise SystemExit(0)

          print(f'IDENTITY COLLISION: {len(collisions)} code_id values are assigned to multiple active records')
          for code_id, rows in list(sorted(collisions.items()))[:20]:
              print(f'code_id={code_id} records={len(rows)}')
              for row in rows[:12]:
                  print('  ' + json.dumps({
                      'fingerprint': row.get('fingerprint'),
                      'path': row.get('path'),
                      'line': row.get('line'),
                      'kind': row.get('kind'),
                      'language': row.get('language'),
                      'text': row.get('text'),
                  }, ensure_ascii=False, sort_keys=True))
          raise SystemExit(1)
          PY

      - name: Build CHID relationship and error database
        run: python tools/code_database.py build

      - name: Load Rune Glyph and SHAEP semantic relationships
        run: python tools/semantic_units.py install

      - name: Flag repeated and regressed errors
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path('.code-index/code_graph.sqlite3')
          if not path.exists():
              raise SystemExit(0)

          db = sqlite3.connect(path)
          rows = db.execute('''
              SELECT error_id, language, error_code, occurrence_count,
                     repeat_flag, regression_flag, normalized_message
              FROM error_signatures
              WHERE repeat_flag = 1 OR regression_flag = 1
              ORDER BY regression_flag DESC, occurrence_count DESC, error_id
          ''').fetchall()
          db.close()

          for error_id, language, error_code, count, repeat_flag, regression_flag, message in rows:
              level = 'REGRESSION' if regression_flag else 'REPEATED'
              code = f' {error_code}' if error_code else ''
              clean = (message or '').replace('\n', ' ')[:700]
              print(f'::warning title={level} {language} error::{error_id}{code} seen {count} times — {clean}')
          PY

      - name: Verify governance invariants
        run: python tools/code_index.py verify

      - name: Show index and graph health
        run: |
          cat .code-index/summary.json
          echo "--- code database ---"
          cat .code-index/code_database_summary.json
          echo "--- semantic units ---"
          python tools/semantic_units.py find "" || true
          echo "--- duplicate report ---"
          python tools/code_index.py duplicates | head -n 120
          echo "--- stale/generated report ---"
          python tools/code_index.py stale | head -n 120
          echo "--- repeated/regressed errors ---"
          python tools/code_database.py find-error "" || true

      - name: Commit governed registries, diagrams, logs, and safe cleanup
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard .code-index)" ]; then
            echo "Code index and semantic graph are already current."
            exit 0
          fi
          git config user.name "shaelvien-code-index"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Refresh code index, CHID graph, semantic units, and error ledger"
          git push origin HEAD:live-alpha-rist-blazor-world
