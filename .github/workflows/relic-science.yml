name: ReLiC Scientific Validation

on:
  workflow_dispatch:
  push:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - 'research/relic_science/**'
      - 'tests/test_relic_science.py'
      - 'tools/code_database.py'
      - '.github/workflows/relic-science.yml'

permissions:
  contents: read

jobs:
  deterministic-science-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run deterministic ReLiC science tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q tests/test_relic_science.py

      - name: Print Infoton audit
        run: python research/relic_science/infoton_audit.py --pretty
