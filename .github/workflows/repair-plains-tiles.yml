name: Repair Terrain Tiles

on:
  push:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - 'apps/rist-world/terrain_asset_repair.py'
      - '.github/workflows/repair-plains-tiles.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::797661578124:role/RIST-GitHub-Deploy
  ASSET_BUCKET: rist-assets-assetbucket-curjzuwjbjtv
  DISTRIBUTION_ID: E1D9TALLP51FI5
  ASSET_BASE_URL: https://d2d6rnm6fnsp89.cloudfront.net/

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare image tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.3.2

      # Analyze every canonical source and stage all families before AWS
      # credentials exist. No production object changes on a partial failure.
      - name: Rebuild and validate all terrain pieces
        run: python apps/rist-world/terrain_asset_repair.py

      - name: Configure AWS through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish repaired terrain families
        run: |
          set -euo pipefail
          root='build/terrain-repair/tilesets/world/terrain'
          aws s3 sync "$root/plains/" "s3://${ASSET_BUCKET}/tilesets/world/terrain/plains/" --delete --only-show-errors
          aws s3 sync "$root/ocean/" "s3://${ASSET_BUCKET}/tilesets/world/terrain/ocean/" --delete --only-show-errors
          aws s3 sync "$root/ice/" "s3://${ASSET_BUCKET}/tilesets/world/terrain/ice/" --delete --only-show-errors

          local_plains=$(find "$root/plains" -type f -name '*.jpg' | wc -l)
          local_ocean=$(find "$root/ocean" -type f -name '*.jpg' | wc -l)
          local_ice=$(find "$root/ice" -type f -name '*.jpg' | wc -l)
          remote_plains=$(aws s3 ls "s3://${ASSET_BUCKET}/tilesets/world/terrain/plains/" --recursive | awk '$4 ~ /\.jpg$/ { count++ } END { print count + 0 }')
          remote_ocean=$(aws s3 ls "s3://${ASSET_BUCKET}/tilesets/world/terrain/ocean/" --recursive | awk '$4 ~ /\.jpg$/ { count++ } END { print count + 0 }')
          remote_ice=$(aws s3 ls "s3://${ASSET_BUCKET}/tilesets/world/terrain/ice/" --recursive | awk '$4 ~ /\.jpg$/ { count++ } END { print count + 0 }')
          test "$local_plains" -eq "$remote_plains"
          test "$local_ocean" -eq "$remote_ocean"
          test "$local_ice" -eq "$remote_ice"

      - name: Refresh terrain CDN paths
        run: |
          set -euo pipefail
          ID=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/tilesets/world/terrain/plains/*' '/tilesets/world/terrain/ocean/*' '/tilesets/world/terrain/ice/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$ID"

      - name: Verify repaired terrain samples
        shell: bash
        run: |
          set -euo pipefail
          for set in 029 040 043 051 059; do
            target="/tmp/plains-${set}.jpg"
            curl --fail --location --retry 6 --retry-delay 5 --output "$target" "${ASSET_BASE_URL}tilesets/world/terrain/plains/plains-${set}/tile-01-01.jpg"
            test "$(stat -c%s "$target")" -gt 1000
            python - "$target" <<'PY'
          import sys
          from PIL import Image
          with Image.open(sys.argv[1]) as im:
              assert min(im.size) > 100, im.size
          PY
          done

          target='/tmp/ocean-071.jpg'
          curl --fail --location --retry 6 --retry-delay 5 --output "$target" "${ASSET_BASE_URL}tilesets/world/terrain/ocean/ocean-071/tile-01-01.jpg"
          test "$(stat -c%s "$target")" -gt 1000
          python - "$target" <<'PY'
          import sys
          import numpy as np
          from PIL import Image

          with Image.open(sys.argv[1]) as im:
              pixels = np.asarray(im.convert('RGB'), dtype=np.float32)
              assert min(im.size) > 100, im.size
          horizontal = np.mean(np.abs(pixels[:, 0] - pixels[:, -1]))
          vertical = np.mean(np.abs(pixels[0] - pixels[-1]))
          assert (horizontal + vertical) / 2 < 4.0, (horizontal, vertical)
          PY

          for tile in 01-01 01-04 02-01 05-06; do
            target="/tmp/ice-${tile}.jpg"
            curl --fail --location --retry 6 --retry-delay 5 --output "$target" "${ASSET_BASE_URL}tilesets/world/terrain/ice/ice-021/tile-${tile}.jpg"
            test "$(stat -c%s "$target")" -gt 1000
            python - "$target" <<'PY'
          import sys
          from PIL import Image
          with Image.open(sys.argv[1]) as im:
              assert min(im.size) >= 140, im.size
          PY
          done

      # The catalog must describe the actual geometry-derived counts. Commit only
      # after CDN verification so the live frontend never points at missing cuts.
      - name: Publish corrected terrain inventory
        shell: bash
        run: |
          set -euo pipefail
          CATALOG='apps/rist-world/wwwroot/assets/drive-tiles/catalog.json'
          git config user.name 'ReLiC Asset Pipeline'
          git config user.email 'actions@users.noreply.github.com'
          git add "$CATALOG"
          if git diff --cached --quiet; then
            echo 'Catalog already matches repaired cuts.'
            exit 0
          fi
          git commit -m 'Correct terrain runtime cut inventory'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin live-alpha-rist-blazor-world && git push origin HEAD:live-alpha-rist-blazor-world; then
              exit 0
            fi
            echo "Catalog push retry $attempt/4"
            sleep $((attempt * 3))
          done
          echo 'Unable to publish corrected catalog after verified asset upload.' >&2
          exit 1
