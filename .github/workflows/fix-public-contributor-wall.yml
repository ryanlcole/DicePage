name: Fix public contributor wall

on:
  push:
    branches: [live-alpha-rist-blazor-world]
    paths: [.github/workflows/fix-public-contributor-wall.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-alpha-rist-blazor-world
          fetch-depth: 0
      - name: Canonicalize contributor wall
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('apps/rist-world/wwwroot/info.html')
          text = path.read_text(encoding='utf-8')
          start = text.index('<section id="software-contributors"')
          end = text.index('</section>', start) + len('</section>')
          block = text[start:end]

          grid_start = block.index('<div class="software-grid">')
          grid_content_start = grid_start + len('<div class="software-grid">')
          grid_end = block.index('</div>', grid_content_start)
          # The first </div> can be inside a card; find the grid close immediately before software-note.
          note_at = block.index('<p class="software-note">')
          grid_end = block.rfind('</div>', grid_content_start, note_at)

          cards = re.findall(r'<article class="software-card">.*?</article>', block[grid_content_start:grid_end], flags=re.S)
          if not cards:
            raise SystemExit('No contributor cards found.')

          # Remove duplicates by displayed heading, retaining the first canonical card.
          unique = {}
          for card in cards:
            heading = re.search(r'<h3>([^<]+)</h3>', card)
            if not heading:
              raise SystemExit('Contributor card without h3 heading.')
            name = heading.group(1).strip()
            unique.setdefault(name.casefold(), (name, card))

          # Suno belongs only in this canonical wall. Any old standalone Ten Fairies/Suno
          # credit is obsolete and must not survive if encountered outside this section.
          before = text[:start]
          after = text[end:]
          legacy_patterns = [
            r'<(?:article|div|section)[^>]*>.*?modern audio realization of The Ten Fairies.*?</(?:article|div|section)>',
            r'<(?:article|div|section)[^>]*>.*?historical printed composer credit remains [‘\'\"]?Winthrop[’\'\"]?.*?</(?:article|div|section)>',
          ]
          for pattern in legacy_patterns:
            before = re.sub(pattern, '', before, flags=re.S | re.I)
            after = re.sub(pattern, '', after, flags=re.S | re.I)

          ordered = [card for _, card in sorted(unique.values(), key=lambda item: item[0].casefold())]
          rebuilt_grid = '<div class="software-grid">\n ' + '\n '.join(ordered) + '\n</div>\n'
          rebuilt_block = block[:grid_start] + rebuilt_grid + block[note_at:]
          result = before + rebuilt_block + after

          # Hard verification: one wall, one Suno card, alphabetical headings.
          if result.count('id="software-contributors"') != 1:
            raise SystemExit('Expected exactly one software contributor wall.')
          wall = result[result.index('<section id="software-contributors"'):]
          wall = wall[:wall.index('</section>') + len('</section>')]
          headings = re.findall(r'<h3>([^<]+)</h3>', wall)
          if headings.count('Suno') != 1:
            raise SystemExit(f'Expected exactly one Suno card, found {headings.count("Suno")}.')
          if headings != sorted(headings, key=str.casefold):
            raise SystemExit(f'Contributor headings are not alphabetical: {headings}')
          if re.search(r'modern audio realization of The Ten Fairies|historical printed composer credit remains', result, re.I):
            raise SystemExit('Obsolete standalone Suno/Ten Fairies credit remains.')

          path.write_text(result, encoding='utf-8')
          print('Contributor order:', ' | '.join(headings))
      - name: Run public info regression test
        run: node --test apps/rist-world/tests/canonical-viewer-public-info.test.cjs
      - name: Verify diff
        run: |
          git diff --check
          git diff -- apps/rist-world/wwwroot/info.html
      - name: Commit canonical repair
        run: |
          if git diff --quiet -- apps/rist-world/wwwroot/info.html; then
            echo "Contributor wall already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rist-world/wwwroot/info.html
          git commit -m "Canonicalize and alphabetize software contributors"
          git push origin HEAD:live-alpha-rist-blazor-world
