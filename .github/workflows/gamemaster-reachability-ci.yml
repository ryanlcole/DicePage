name: GameMaster Reachability CI

on:
  pull_request:
    branches:
      - live-alpha-rist-blazor-world
    paths:
      - 'apps/rist-world/Components/UniversalInterface.razor'
      - 'apps/rist-world/Components/UniversalInterface.MmoMap.cs'
      - 'apps/rist-world/WorldSession.WorldAuthority.cs'
      - 'apps/rist-world/tests/test_gamemaster_selection_hierarchy.py'
      - 'apps/rist-world/tests/test_gamemaster_deed_home_flow.py'
      - 'apps/rist-world/tests/test_universal_mmo_deed_map.py'
      - '.github/workflows/deploy-rist-platform.yml'
      - '.github/workflows/gamemaster-reachability-ci.yml'

permissions:
  contents: read

jobs:
  reachability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run GameMaster reachability regressions
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            apps/rist-world/tests/test_gamemaster_selection_hierarchy.py \
            apps/rist-world/tests/test_gamemaster_deed_home_flow.py \
            apps/rist-world/tests/test_universal_mmo_deed_map.py

      - name: Compile RIST World
        run: dotnet publish apps/rist-world/RistWorld.csproj -c Release -o build/rist
