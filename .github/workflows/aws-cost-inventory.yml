name: AWS Cost Inventory

on:
  push:
    branches: [main]
    paths: ['.github/workflows/aws-cost-inventory.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::797661578124:role/RIST-GitHub-Deploy
          aws-region: us-east-1
      - name: Inventory potentially billable AWS resources
        shell: bash
        run: |
          set +e
          echo '=== IDENTITY ==='; aws sts get-caller-identity
          echo '=== ECS CLUSTERS ==='; aws ecs list-clusters
          for c in $(aws ecs list-clusters --query 'clusterArns[]' --output text 2>/dev/null); do echo "--- $c"; aws ecs describe-clusters --clusters "$c"; aws ecs list-services --cluster "$c"; aws ecs list-tasks --cluster "$c" --desired-status RUNNING; done
          echo '=== EC2 INSTANCES ==='; aws ec2 describe-instances --query 'Reservations[].Instances[].{Id:InstanceId,State:State.Name,Type:InstanceType,PublicIp:PublicIpAddress}'
          echo '=== EBS VOLUMES ==='; aws ec2 describe-volumes --query 'Volumes[].{Id:VolumeId,State:State,Size:Size,Type:VolumeType}'
          echo '=== EBS SNAPSHOTS OWNED ==='; aws ec2 describe-snapshots --owner-ids self --query 'Snapshots[].{Id:SnapshotId,Size:VolumeSize,State:State}'
          echo '=== NAT GATEWAYS ==='; aws ec2 describe-nat-gateways --query 'NatGateways[].{Id:NatGatewayId,State:State,Vpc:VpcId}'
          echo '=== ELASTIC IPS ==='; aws ec2 describe-addresses --query 'Addresses[].{AllocationId:AllocationId,PublicIp:PublicIp,AssociationId:AssociationId}'
          echo '=== VPC ENDPOINTS ==='; aws ec2 describe-vpc-endpoints --query 'VpcEndpoints[].{Id:VpcEndpointId,Type:VpcEndpointType,State:State,Service:ServiceName}'
          echo '=== ELBv2 ==='; aws elbv2 describe-load-balancers --query 'LoadBalancers[].{Name:LoadBalancerName,Type:Type,State:State.Code,DNS:DNSName}'
          echo '=== EFS ==='; aws efs describe-file-systems --query 'FileSystems[].{Id:FileSystemId,Name:Name,Size:SizeInBytes.Value,State:LifeCycleState}'
          echo '=== S3 BUCKETS ==='; aws s3api list-buckets --query 'Buckets[].{Name:Name,Created:CreationDate}'
          echo '=== CLOUDFRONT ==='; aws cloudfront list-distributions --query 'DistributionList.Items[].{Id:Id,Enabled:Enabled,Domain:DomainName,Comment:Comment}'
          echo '=== WAF REGIONAL ==='; aws wafv2 list-web-acls --scope REGIONAL --region us-east-1
          echo '=== WAF CLOUDFRONT ==='; aws wafv2 list-web-acls --scope CLOUDFRONT --region us-east-1
          echo '=== ROUTE53 HOSTED ZONES ==='; aws route53 list-hosted-zones --query 'HostedZones[].{Id:Id,Name:Name,Private:Config.PrivateZone}'
          echo '=== ROUTE53 DOMAINS ==='; aws route53domains list-domains --region us-east-1 --query 'Domains[].{Domain:DomainName,AutoRenew:AutoRenew,Expiry:Expiry}'
          echo '=== KMS CUSTOMER KEYS ==='; for k in $(aws kms list-keys --query 'Keys[].KeyId' --output text 2>/dev/null); do aws kms describe-key --key-id "$k" --query 'KeyMetadata.{Id:KeyId,Manager:KeyManager,State:KeyState,Description:Description}' --output json; done
          echo '=== SECRETS ==='; aws secretsmanager list-secrets --query 'SecretList[].{Name:Name,ARN:ARN}'
          echo '=== ECR REPOS ==='; aws ecr describe-repositories --query 'repositories[].{Name:repositoryName,URI:repositoryUri}'
          echo '=== LAMBDA ==='; aws lambda list-functions --query 'Functions[].{Name:FunctionName,Runtime:Runtime,Memory:MemorySize}'
          echo '=== API GATEWAY REST ==='; aws apigateway get-rest-apis --query 'items[].{Id:id,Name:name}'
          echo '=== API GATEWAY V2 ==='; aws apigatewayv2 get-apis --query 'Items[].{Id:ApiId,Name:Name,Protocol:ProtocolType}'
          echo '=== DYNAMODB ==='; aws dynamodb list-tables
          echo '=== CLOUDWATCH LOG GROUPS ==='; aws logs describe-log-groups --query 'logGroups[].{Name:logGroupName,StoredBytes:storedBytes,Retention:retentionInDays}'
          echo '=== BACKUP VAULTS ==='; aws backup list-backup-vaults --query 'BackupVaultList[].{Name:BackupVaultName,Points:NumberOfRecoveryPoints}'
          echo '=== RDS ==='; aws rds describe-db-instances --query 'DBInstances[].{Id:DBInstanceIdentifier,Status:DBInstanceStatus,Class:DBInstanceClass,Engine:Engine}'
          echo '=== ELASTICACHE ==='; aws elasticache describe-cache-clusters --query 'CacheClusters[].{Id:CacheClusterId,Status:CacheClusterStatus,Type:CacheNodeType}'
          echo '=== OPENSEARCH ==='; aws opensearch list-domain-names
          echo '=== SAGEMAKER ENDPOINTS ==='; aws sagemaker list-endpoints --query 'Endpoints[].{Name:EndpointName,Status:EndpointStatus}'
          echo '=== LIGHTSAIL INSTANCES ==='; aws lightsail get-instances --query 'instances[].{Name:name,State:state.name,Bundle:bundleId}'
          echo '=== CLOUDFORMATION STACKS ==='; aws cloudformation list-stacks --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE UPDATE_ROLLBACK_COMPLETE IMPORT_COMPLETE --query 'StackSummaries[].{Name:StackName,Status:StackStatus}'
