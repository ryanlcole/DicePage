<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Animated flowing fountain">
 <style>
  .water{fill:none;stroke:#8edcff;stroke-linecap:round;filter:url(#glow)}
  .stream-a{stroke-width:7;stroke-dasharray:18 12;animation:flow 1.2s linear infinite}
  .stream-b{stroke-width:5;stroke-dasharray:14 10;animation:flow .9s linear infinite reverse}
  .drop{fill:#bdeeff;animation:drop 1.05s ease-in infinite}
  .drop.d2{animation-delay:.28s}.drop.d3{animation-delay:.57s}.drop.d4{animation-delay:.78s}
  .ripple{fill:none;stroke:#8edcff;stroke-width:3;opacity:.7;transform-origin:128px 190px;animation:ripple 1.4s ease-out infinite}
  .ripple.r2{animation-delay:.7s}
  @keyframes flow{to{stroke-dashoffset:-60}}
  @keyframes drop{0%{transform:translateY(-12px);opacity:0}18%{opacity:1}82%{opacity:1}100%{transform:translateY(44px);opacity:0}}
  @keyframes ripple{0%{transform:scale(.45);opacity:.8}100%{transform:scale(1.18);opacity:0}}
 </style>
 <defs>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9d957d"/><stop offset=".55" stop-color="#5f625c"/><stop offset="1" stop-color="#343c3e"/></linearGradient>
  <radialGradient id="pool"><stop offset="0" stop-color="#4aa6c9" stop-opacity=".9"/><stop offset="1" stop-color="#173b50" stop-opacity=".95"/></radialGradient>
 </defs>
 <ellipse cx="128" cy="205" rx="92" ry="31" fill="#182329" opacity=".5"/>
 <ellipse cx="128" cy="190" rx="90" ry="36" fill="url(#stone)" stroke="#c4b98f" stroke-width="4"/>
 <ellipse cx="128" cy="185" rx="73" ry="25" fill="url(#pool)" stroke="#242d31" stroke-width="3"/>
 <path d="M105 174 L113 91 H143 L151 174 Z" fill="url(#stone)" stroke="#c4b98f" stroke-width="3"/>
 <ellipse cx="128" cy="93" rx="36" ry="11" fill="url(#stone)" stroke="#c4b98f" stroke-width="3"/>
 <path d="M128 93 C126 69 126 48 128 25" class="water stream-a"/>
 <path d="M128 60 C91 77 79 112 70 145" class="water stream-b"/>
 <path d="M128 60 C165 77 177 112 186 145" class="water stream-b"/>
 <circle cx="71" cy="119" r="5" class="drop"/><circle cx="185" cy="115" r="4" class="drop d2"/>
 <circle cx="115" cy="48" r="4" class="drop d3"/><circle cx="141" cy="39" r="4" class="drop d4"/>
 <ellipse cx="128" cy="187" rx="34" ry="10" class="ripple"/><ellipse cx="128" cy="187" rx="34" ry="10" class="ripple r2"/>
</svg>
