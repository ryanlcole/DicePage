<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>RIST Asset Inventory — Temporary</title>
<style>
:root{color-scheme:dark;--bg:#071015;--panel:#0d171e;--line:#725d30;--gold:#e1c77f;--muted:#aa9f87;--blue:#7fc7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eee6d2;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:20;padding:12px;background:#071015f4;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}h1{margin:0 0 4px;color:var(--gold);font-size:20px}.note{margin:0 0 10px;color:var(--muted);font-size:12px}.tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.tools input,.tools select{min-width:0;height:42px;border:1px solid var(--line);border-radius:8px;background:#0c151c;color:#fff;padding:0 10px;font-size:16px}.stats{margin-top:8px;color:var(--gold);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;padding:8px}.asset{min-width:0;border:1px solid #4e432b;border-radius:9px;overflow:hidden;background:var(--panel)}.preview{height:150px;display:grid;place-items:center;background:#050b0f;background-image:linear-gradient(45deg,#0b151b 25%,transparent 25%),linear-gradient(-45deg,#0b151b 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#0b151b 75%),linear-gradient(-45deg,transparent 75%,#0b151b 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.preview img{display:block;max-width:100%;max-height:100%;object-fit:contain}.meta{padding:8px}.name{display:block;color:var(--gold);font-size:12px;line-height:1.2;margin-bottom:5px;word-break:break-word}.source{display:inline-block;margin-bottom:5px;padding:2px 5px;border:1px solid #4e432b;border-radius:5px;color:#c9b77f;font-size:9px;text-transform:uppercase}.path,.id{display:block;font:10px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}.path{color:var(--blue);user-select:all}.id{margin-top:4px;color:var(--muted)}.error{margin:8px;padding:10px;border:1px solid #8b4138;border-radius:8px;background:#24110f;color:#ffb9ae;font-size:12px}.loading{padding:30px;text-align:center;color:var(--gold)}@media(max-width:430px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:5px}.preview{height:128px}.meta{padding:6px}.tools{grid-template-columns:1fr}.tools select{height:36px}}
</style>
</head>
<body>
<header>
 <h1>RIST Asset Inventory <small style="font-size:11px;color:#a99d82">TEMPORARY</small></h1>
 <p class="note">Every asset this page can enumerate. Tap/hold a blue path to copy it and send that exact path back.</p>
 <div class="tools"><input id="search" type="search" placeholder="Search name, path, folder, ID…" autocomplete="off" /><select id="source"><option value="">All sources</option></select></div>
 <div id="stats" class="stats">Loading…</div>
</header>
<div id="errors"></div>
<main id="grid" class="grid"><div class="loading">Building complete inventory…</div></main>
<script>
const REPO='ryanlcole/DicePage', BRANCH='live-alpha-rist-blazor-world';
const IMG=/\.(png|webp|jpe?g|gif|svg)$/i;
const CDN='https://d2d6rnm6fnsp89.cloudfront.net/';
const packs=[
 ['Miniatures (Minis)','Kenney · Character Minis','LOCAL','kenney_tooncharacters1/PNG','kenney-toon-minis'],
 ['Rolling Stock & Locomotives','Kenney · Isometric Vehicles','REGION','isometricvehicles/PNG','kenney-isometric-vehicles'],
 ['Pawns & Meeples','Kenney · Black Board Pieces','ENCOUNTER','boardgamepack/PNG/Pieces (Black)','kenney-board-pieces'],
 ['Tokens & Chits','Kenney · Grey Runes','ENCOUNTER','kenney_runepack/PNG/Grey','kenney-runes-grey'],
 ['Tiles','Kenney · Hexagon Tiles','WORLD','hexagontiles/Tiles','kenney-hex-tiles'],
 ['Scenery & Terrain','Kenney · Isometric Landscape','LOCAL','isometriclandscape/PNG','kenney-isometric-landscape'],
 ['Bits','Kenney · Generic Items','OBJECT','generic-items-160-assets/PNG','kenney-generic-items']
];
let all=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function add(a){if(!a||!a.image)return; const key=a.path||a.image; if(all.some(x=>(x.path||x.image)===key))return; all.push(a)}
function err(msg){document.querySelector('#errors').insertAdjacentHTML('beforeend',`<div class="error">${esc(msg)}</div>`)}
async function json(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`${r.status} ${url}`);return r.json()}
async function loadCatalog(url,source){try{const rows=await json(url);for(const x of rows)add({name:x.name||x.id,path:x.image||'',image:x.image||'',id:x.id||'',source,layer:x.layer||'',directory:x.directory||'',folder:x.folder||'',author:x.author||''})}catch(e){err(`Could not load ${source}: ${e.message}`)}}
async function loadRepoAssets(){try{const tree=await json(`https://api.github.com/repos/${REPO}/git/trees/${encodeURIComponent(BRANCH)}?recursive=1`);for(const x of tree.tree||[]){if(x.type!=='blob'||!x.path.startsWith('apps/rist-world/wwwroot/assets/')||!IMG.test(x.path))continue;const rel=x.path.replace('apps/rist-world/wwwroot/','');add({name:rel.split('/').pop(),path:rel,image:rel,id:'',source:'GitHub / built-in',directory:rel.split('/')[1]||'',folder:rel.split('/').slice(2,-1).join('/')})}}catch(e){err(`Could not enumerate GitHub built-ins: ${e.message}`)}}
async function loadThirdParty(){for(const [category,folder,layer,remote,id] of packs){try{const url=`https://api.github.com/repos/ETdoFresh/kenney.nl/contents/${remote.split('/').map(encodeURIComponent).join('/')}?ref=master`;const rows=await json(url);for(const x of rows){if(x.type!=='file'||!x.download_url||!IMG.test(x.name))continue;add({name:x.name.replace(/\.[^.]+$/,''),path:`ETdoFresh/kenney.nl/${remote}/${x.name}`,image:x.download_url,id:`thirdparty:${id}:${x.name}`,source:'Kenney starter pack',layer,directory:category,folder,author:'Kenney'})}}catch(e){err(`Could not enumerate ${folder}: ${e.message}`)}}}
function searchable(x){return [x.name,x.path,x.id,x.source,x.layer,x.directory,x.folder,x.author].join(' ').toLowerCase()}
function render(){const q=document.querySelector('#search').value.trim().toLowerCase(), src=document.querySelector('#source').value;const rows=all.filter(x=>(!src||x.source===src)&&(!q||searchable(x).includes(q))).sort((a,b)=>(a.source+a.path).localeCompare(b.source+b.path));document.querySelector('#stats').textContent=`Showing ${rows.length.toLocaleString()} of ${all.length.toLocaleString()} assets`;document.querySelector('#grid').innerHTML=rows.map(x=>`<article class="asset"><div class="preview"><img loading="lazy" decoding="async" src="${esc(x.image)}" alt="" onerror="this.style.display='none'"></div><div class="meta"><strong class="name">${esc(x.name)}</strong><span class="source">${esc(x.source)}</span><code class="path">${esc(x.path)}</code>${x.id?`<code class="id">ID: ${esc(x.id)}</code>`:''}${x.layer||x.directory||x.folder?`<code class="id">${esc([x.layer,x.directory,x.folder].filter(Boolean).join(' › '))}</code>`:''}</div></article>`).join('')||'<div class="loading">No matching assets.</div>'}
async function main(){await Promise.all([loadCatalog('data/atlas-public.json','RIST public atlas'),loadCatalog('assets/drive-tiles/catalog.json','AWS / Shaelvien Drive'),loadRepoAssets(),loadThirdParty()]);const sources=[...new Set(all.map(x=>x.source))].sort();document.querySelector('#source').insertAdjacentHTML('beforeend',sources.map(x=>`<option>${esc(x)}</option>`).join(''));render()}
document.querySelector('#search').addEventListener('input',render);document.querySelector('#source').addEventListener('change',render);main();
</script>
</body>
</html>
