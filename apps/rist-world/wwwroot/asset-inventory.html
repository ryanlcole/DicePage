<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>RIST Asset Inventory — Temporary</title>
<style>
:root{color-scheme:dark;--bg:#071015;--panel:#0d171e;--line:#725d30;--gold:#e1c77f;--muted:#aa9f87;--blue:#7fc7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eee6d2;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:20;padding:12px;background:#071015f4;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}h1{margin:0 0 4px;color:var(--gold);font-size:20px}.note{margin:0 0 10px;color:var(--muted);font-size:12px}.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tools input,.tools select,.tools label{min-width:0;height:42px;border:1px solid var(--line);border-radius:8px;background:#0c151c;color:#fff;padding:0 10px;font-size:14px}.tools input{grid-column:1/-1;font-size:16px}.tools select{width:100%}.tools label{display:flex;align-items:center;gap:8px}.tools label input{grid-column:auto;width:18px;height:18px;margin:0}.stats{margin-top:8px;color:var(--gold);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;padding:8px}.asset{min-width:0;border:1px solid #4e432b;border-radius:9px;overflow:hidden;background:var(--panel)}.preview{height:150px;display:grid;place-items:center;background:#050b0f}.preview img{display:block;max-width:100%;max-height:100%;object-fit:contain}.meta{padding:8px}.name{display:block;color:var(--gold);font-size:12px;line-height:1.2;margin-bottom:5px;word-break:break-word}.source,.count{display:inline-block;margin:0 4px 5px 0;padding:2px 5px;border:1px solid #4e432b;border-radius:5px;color:#c9b77f;font-size:9px;text-transform:uppercase}.count{color:#9fd0e7}.path,.id{display:block;font:10px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}.path{color:var(--blue);user-select:all}.id{margin-top:4px;color:var(--muted)}.loading{padding:30px;text-align:center;color:var(--gold)}@media(max-width:430px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:5px}.preview{height:128px}.meta{padding:6px}.tools{grid-template-columns:1fr}.tools input{grid-column:auto}.tools select,.tools label{height:38px}}
</style>
</head>
<body>
<header>
<h1>RIST Asset Inventory <small style="font-size:11px;color:#a99d82">TEMPORARY</small></h1>
<p class="note">Source assets are grouped by tileset/asset set. Turn on “Show runtime cuts” only when you need an exact derived tile path.</p>
<div class="tools">
<input id="search" type="search" placeholder="Search name, path, folder, ID…" autocomplete="off" />
<select id="source"><option value="">All sources</option></select>
<select id="layer"><option value="">All layers</option></select>
<select id="directory"><option value="">All categories</option></select>
<select id="folder"><option value="">All folders</option></select>
<select id="set"><option value="">All asset sets</option></select>
<select id="author"><option value="">All authors</option></select>
<label><input id="cuts" type="checkbox" /> Show runtime cuts</label>
</div>
<div id="stats" class="stats">Loading…</div>
</header>
<main id="grid" class="grid"><div class="loading">Building inventory…</div></main>
<script>
const REPO='ryanlcole/DicePage',BRANCH='live-alpha-rist-blazor-world';
const IMG=/\.(png|webp|jpe?g|gif|svg)$/i;
const CUT=/\/tile-\d+-\d+\.(png|webp|jpe?g)$/i;
let cuts=[],builtins=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`${r.status} ${url}`);return r.json()}
function cleanSetName(x){const fromName=String(x.name||'').replace(/\s*[·-]\s*\d+,\d+\s*$/,'').trim();if(fromName&&fromName!==x.name)return fromName;const path=String(x.image||'').replace(/\/$/,'');const parts=path.split('/');if(CUT.test(path)&&parts.length>1)return parts[parts.length-2].replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());return fromName||x.id||parts.at(-1)||'Asset'}
function setKey(x){const p=String(x.image||'');return CUT.test(p)?p.replace(/\/tile-\d+-\d+\.(png|webp|jpe?g)$/i,''):p}
function toCut(x){return{name:x.name||x.id,path:x.image||'',image:x.image||'',id:x.id||'',source:'AWS / Shaelvien Drive',layer:x.layer||'',directory:x.directory||'',folder:x.folder||'',author:x.author||'',set:cleanSetName(x),setKey:setKey(x)}}
async function loadAws(){const rows=await json('assets/drive-tiles/catalog.json');cuts=rows.map(toCut)}
async function loadRepo(){const tree=await json(`https://api.github.com/repos/${REPO}/git/trees/${encodeURIComponent(BRANCH)}?recursive=1`);builtins=(tree.tree||[]).filter(x=>x.type==='blob'&&x.path.startsWith('apps/rist-world/wwwroot/assets/')&&IMG.test(x.path)).map(x=>{const rel=x.path.replace('apps/rist-world/wwwroot/','');const parts=rel.split('/');return{name:parts.at(-1),path:rel,image:rel,id:'',source:'GitHub / built-in',layer:'BUILT-IN',directory:parts[1]||'',folder:parts.slice(2,-1).join('/'),author:'ReLiCGameMaster',set:parts.slice(0,-1).join('/'),setKey:rel}})}
function grouped(){const map=new Map();for(const x of cuts){const key=x.setKey;if(!map.has(key))map.set(key,{...x,name:x.set,path:key,image:x.image,id:x.id.replace(/-\d\d-\d\d$/,''),count:0});map.get(key).count++}return[...map.values(),...builtins.map(x=>({...x,count:1}))]}
function values(rows,key){return [...new Set(rows.map(x=>x[key]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)))}
function fill(id,label,vals){const el=$(id),old=el.value;el.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');if(vals.includes(old))el.value=old}
function searchable(x){return[x.name,x.path,x.id,x.source,x.layer,x.directory,x.folder,x.author,x.set].join(' ').toLowerCase()}
function baseRows(){return $('#cuts').checked?[...cuts,...builtins.map(x=>({...x,count:1}))]:grouped()}
function refilterControls(){const rows=baseRows();fill('#source','All sources',values(rows,'source'));fill('#layer','All layers',values(rows,'layer'));fill('#directory','All categories',values(rows,'directory'));fill('#folder','All folders',values(rows,'folder'));fill('#set','All asset sets',values(rows,'set'));fill('#author','All authors',values(rows,'author'))}
function render(){const rows0=baseRows(),q=$('#search').value.trim().toLowerCase();const filters=['source','layer','directory','folder','set','author'];const rows=rows0.filter(x=>filters.every(k=>!$('#'+k).value||x[k]===$('#'+k).value)&&(!q||searchable(x).includes(q))).sort((a,b)=>(a.source+a.directory+a.folder+a.set+a.path).localeCompare(b.source+b.directory+b.folder+b.set+b.path));$('#stats').textContent=`Showing ${rows.length.toLocaleString()} of ${rows0.length.toLocaleString()} ${$('#cuts').checked?'runtime assets':'source asset sets'} (${cuts.length.toLocaleString()} AWS cuts available)`;$('#grid').innerHTML=rows.map(x=>`<article class="asset"><div class="preview"><img loading="lazy" decoding="async" src="${esc(x.image)}" alt="" onerror="this.style.display='none'"></div><div class="meta"><strong class="name">${esc(x.name)}</strong><span class="source">${esc(x.source)}</span>${x.count>1?`<span class="count">${x.count} cuts</span>`:''}<code class="path">${esc(x.path)}</code>${x.id?`<code class="id">ID: ${esc(x.id)}</code>`:''}<code class="id">${esc([x.layer,x.directory,x.folder].filter(Boolean).join(' › '))}</code>${x.author?`<code class="id">${esc(x.author)}</code>`:''}</div></article>`).join('')||'<div class="loading">No matching assets.</div>'}
async function main(){await Promise.all([loadAws(),loadRepo()]);refilterControls();render()}
$('#search').addEventListener('input',render);for(const id of ['source','layer','directory','folder','set','author'])$('#'+id).addEventListener('change',render);$('#cuts').addEventListener('change',()=>{refilterControls();render()});main();
</script>
</body>
</html>
