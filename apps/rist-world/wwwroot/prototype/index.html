<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#05080b" />
  <title>Shaelvien World Builder</title>
  <link rel="stylesheet" href="./prototype.css" />
</head>
<body>
<main class="shell" aria-label="Shaelvien World Builder">
  <section id="stage" class="stage" aria-label="Interactive world viewer with all parallax layers visible">
    <div id="world" class="world" aria-live="off">
      <img id="surfacePlane" class="plane base" alt="Canonical surface map" draggable="false" />
      <img id="highlandsPlane" class="plane highlands" alt="Transparent highlands and rivers parallax layer" draggable="false" />
      <img id="mountainPlane" class="plane mountains" alt="Transparent mountain volcanic and archipelago parallax layer" draggable="false" />
      <svg id="celestialPathLayer" class="celestial-path-layer" aria-hidden="true"></svg>
    </div>
    <div id="loading" class="loading">LOADING WORLD…</div>
    <section id="battleInstance" class="battle-instance" aria-label="Battle Instance" hidden><strong>BATTLE INSTANCE</strong><span id="battleText">Entity focus becomes a tactical viewer representation while the world coordinate identity remains unchanged.</span></section>
    <div class="hud" aria-label="Map zoom controls" data-ui><button id="zoomOut" type="button" aria-label="Zoom out">−</button><button id="zoomIn" type="button" aria-label="Zoom in">+</button><button id="fit" class="fit" type="button" aria-label="Fit map to screen">⛶</button></div>
    <div class="control-cluster" aria-label="World Builder primary controls" data-ui>
      <button id="back" class="square-action" type="button" aria-label="Home">⌂</button>
      <button id="imageUploadToggle" class="square-action" type="button" aria-label="Add image" aria-haspopup="dialog">▧</button>
      <button id="keyboardToggle" class="square-action" type="button" aria-label="Open World Builder keyboard" aria-expanded="false" aria-controls="viewerKeyboard">⌨</button>
      <button id="settingsToggle" class="square-action" type="button" aria-label="World Builder settings" aria-haspopup="dialog">⚙</button>
    </div>
    <section id="viewerSettingsPanel" class="viewer-settings-panel" role="dialog" aria-modal="true" aria-label="World Builder settings" hidden data-ui>
      <div class="viewer-settings-card">
        <header><strong>SETTINGS</strong><button id="viewerSettingsClose" type="button" aria-label="Close settings">×</button></header>
        <button id="settingsFit" type="button" aria-label="Fit map to screen"><span aria-hidden="true">⛶</span><strong aria-hidden="true">View</strong></button>
        <button id="settingsResetTilt" type="button"><span aria-hidden="true">⌁</span><strong>Reset Tilt</strong></button>
        <button id="settingsStartMenu" type="button"><span aria-hidden="true">⌂</span><strong>Start Menu</strong></button>
      </div>
    </section>
    <section id="imageUploadPanel" class="image-upload-panel" role="dialog" aria-modal="true" aria-label="Add image" hidden data-ui>
      <div class="image-upload-card">
        <header><strong>ADD IMAGE</strong><button id="imageUploadClose" type="button" aria-label="Close image upload">×</button></header>
        <div class="image-position-grid">
          <label><span>X</span><input id="imageX" type="number" min="0" max="1" step="0.001" inputmode="decimal" /></label>
          <label><span>Y</span><input id="imageY" type="number" min="0" max="1" step="0.001" inputmode="decimal" /></label>
          <label><span>Tier</span><input id="imageTier" type="number" step="1" inputmode="numeric" /></label>
          <label><span>Layer</span><input id="imageLayer" type="number" min="0" max="9" step="1" inputmode="numeric" /></label>
        </div>
        <label class="image-transparency"><input id="imageTransparency" type="checkbox" checked /> <span>Automatic transparency</span></label>
        <div id="imageDropzone" class="image-dropzone" tabindex="0" role="button" aria-label="Drop an image here or browse for an image">
          <strong>DROP IMAGE HERE</strong>
          <span>or</span>
          <button id="imageBrowse" type="button">BROWSE</button>
          <input id="imageFile" type="file" accept="image/*" hidden />
        </div>
      </div>
    </section>
    <section id="celestialAdvancedPanel" class="celestial-advanced-panel" role="dialog" aria-modal="true" aria-label="Advanced celestial details" hidden data-ui>
      <form id="celestialAdvancedForm" class="celestial-advanced-card">
        <header><strong>ADVANCED CELESTIAL DETAILS</strong><button id="celestialAdvancedClose" type="button" aria-label="Close advanced celestial details">×</button></header>
        <div class="celestial-advanced-grid">
          <label><span>Name</span><input id="celestialName" type="text" /></label>
          <label><span>Parent body</span><input id="celestialParent" type="text" /></label>
          <label><span>Radius km</span><input id="celestialRadius" type="number" step="any" /></label>
          <label><span>Mass kg</span><input id="celestialMass" type="text" inputmode="decimal" /></label>
          <label><span>Gravity m/s²</span><input id="celestialGravity" type="number" step="any" /></label>
          <label><span>Semi-major axis km</span><input id="celestialSemiMajor" type="number" step="any" /></label>
          <label><span>Eccentricity</span><input id="celestialEccentricity" type="number" min="0" step="any" /></label>
          <label><span>Inclination °</span><input id="celestialInclination" type="number" step="any" /></label>
          <label><span>Orbital period days</span><input id="celestialPeriod" type="number" step="any" /></label>
          <label><span>Rotation hours</span><input id="celestialRotation" type="number" step="any" /></label>
          <label><span>Axial tilt °</span><input id="celestialTilt" type="number" step="any" /></label>
          <label><span>Albedo</span><input id="celestialAlbedo" type="number" min="0" max="1" step="any" /></label>
          <label class="wide"><span>Atmosphere</span><input id="celestialAtmosphere" type="text" /></label>
          <label class="wide"><span>Epoch / reference</span><input id="celestialEpoch" type="text" /></label>
          <label class="wide"><span>Own world name</span><input id="celestialWorldName" type="text" /></label>
        </div>
        <footer><button id="celestialAdvancedSave" type="submit">SAVE DETAILS</button></footer>
      </form>
    </section>
    <section id="viewerKeyboard" class="keyboard" aria-label="World Builder contextual keyboard" hidden data-ui>
      <div class="keyboard-head"><strong>VIEWER-MOUNTED KEYBOARD · PERCEPTION / TOOLS ONLY</strong><button id="keyboardClose" type="button" aria-label="Close keyboard">×</button></div>
      <div id="keyboardTabs" class="keyboard-tabs" role="tablist" aria-label="Keyboard modes"></div>
      <div id="keyboardKeys" class="keyboard-keys"></div>
    </section>
    <div id="live" class="sr-live" role="status" aria-live="polite"></div>
  </section>
</main>
<script src="./prototype.js"></script>
</body>
</html>
