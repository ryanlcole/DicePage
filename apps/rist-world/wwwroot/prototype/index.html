<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Shaelvien World Builder</title>
  <link rel="stylesheet" href="./prototype.css?v=20261004-continuous-space-2" />
</head>
<body>
<main class="app-shell">
  <section id="stage" class="stage" aria-label="World Builder viewer">
    <div id="world" class="world"></div>
    <div id="grid" class="grid" aria-hidden="true"></div>
    <div id="selection" class="selection" aria-hidden="true"></div>
    <div id="loading" class="loading">LOADING WORLD…</div>
    <section id="imageUploadPanel" class="image-upload-panel" role="dialog" aria-modal="true" aria-label="Add image" hidden data-ui>
      <div class="image-upload-card">
        <header><strong>ADD IMAGE</strong><button id="imageUploadClose" type="button" aria-label="Close image upload">×</button></header>
        <label class="image-placement-role"><span>PLACEMENT</span><select id="imagePlacementRole" aria-describedby="imagePlacementHint"><option value="world-map">World Map / Sea Level · 100% × 100%</option><option value="layer">Adjustable Layer</option></select><small id="imagePlacementHint">Choose whether this image becomes the full world map or an adjustable layer above it.</small></label>
        <div id="imagePositionGrid" class="image-position-grid">
          <label><span>X</span><input id="imageX" type="number" min="0" max="1" step="0.001" inputmode="decimal" /></label>
          <label><span>Y</span><input id="imageY" type="number" min="0" max="1" step="0.001" inputmode="decimal" /></label>
          <label><span>Tier</span><input id="imageTier" type="number" min="0" max="2" step="1" inputmode="numeric" /></label>
          <label><span>Layer</span><input id="imageLayer" type="number" min="0" max="9" step="1" inputmode="numeric" /></label>
        </div>
        <label class="image-transparency"><input id="imageTransparency" type="checkbox" checked /> <span>Automatic transparency</span></label>
        <div id="imageDropzone" class="image-dropzone" tabindex="0" role="button" aria-label="Drop an image here or browse for an image">
          <strong>DROP IMAGE HERE</strong><span>or</span><button id="imageBrowse" type="button">BROWSE</button><input id="imageFile" type="file" accept="image/*" hidden />
        </div>
      </div>
    </section>
    <section id="spriteUploadPanel" class="image-upload-panel" role="dialog" aria-modal="true" aria-label="Add sprite set" hidden data-ui>
      <div class="image-upload-card"><header><strong>ADD SPRITE SET</strong><button id="spriteUploadClose" type="button" aria-label="Close sprite upload">×</button></header><div class="image-position-grid sprite-sheet-grid"><label><span>Columns</span><input id="spriteColumns" type="number" min="1" max="16" step="1" inputmode="numeric" value="3" /></label><label><span>Rows</span><input id="spriteRows" type="number" min="1" max="16" step="1" inputmode="numeric" value="2" /></label><label><span>FPS</span><input id="spriteFps" type="number" min="1" max="30" step="1" inputmode="numeric" value="6" /></label><label><span>Frames</span><input id="spriteFrameCount" type="number" min="1" max="256" step="1" inputmode="numeric" value="6" /></label></div><p class="sprite-upload-note">Frame 1 is used while placing. Save commits the sprite to the world and starts its motion.</p><div id="spriteDropzone" class="image-dropzone" tabindex="0" role="button" aria-label="Drop a sprite sheet here or browse for a sprite sheet"><strong>DROP SPRITE SHEET HERE</strong><span>or</span><label id="spriteBrowse" class="file-browse-button" for="spriteFile" role="button" tabindex="0">BROWSE</label><input id="spriteFile" type="file" accept="image/*" hidden /></div></div>
    </section>
    <section id="viewerKeyboard" class="keyboard" aria-label="World Builder contextual keyboard" hidden data-ui><div class="keyboard-head"><strong>VIEWER-MOUNTED KEYBOARD · PERCEPTION / TOOLS ONLY</strong><button id="keyboardClose" type="button" aria-label="Close keyboard">×</button></div><div id="keyboardTabs" class="keyboard-tabs" role="tablist" aria-label="Keyboard modes"></div><div id="keyboardKeys" class="keyboard-keys"></div></section>
    <div id="live" class="sr-live" role="status" aria-live="polite"></div>
  </section>
</main>
<script src="./viewer-input.js?v=20260920-desktop-input-1"></script>
<script src="./prototype.js?v=20261004-continuous-space-2"></script>
<script src="./spatial-selection-session.js?v=20261004-frozen-selection-4&fix=20261004-hex30-volume-1"></script>
<script src="./spatial-title-handoff.js?v=20261004-spatial-title-1"></script>
<script src="./spatial-depth-authority.js?v=20261004-parent-depth-4&fix=20261004-reference-xy-z-1"></script>
<script src="./spatial-selector-lock.js?v=20261004-map-selector-lock-1"></script>
<script src="./spatial-selection-enhancements.js?v=20261004-volume-selection-1"></script>
<script src="./region-selection-tools.js?v=20261005-touch-boundary-mask-1"></script>
</body>
</html>
