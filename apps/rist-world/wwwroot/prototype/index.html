<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#05080b" />
  <title>Shaelvien World Builder</title>
  <link rel="stylesheet" href="./prototype.css" />
</head>
<body>
<main class="shell" aria-label="Shaelvien World Builder">
  <section id="stage" class="stage" aria-label="Interactive layered world viewer">
    <div id="world" class="world" aria-live="off">
      <img id="surfacePlane" class="plane base" alt="Canonical surface map" draggable="false" />
    </div>
    <div id="loading" class="loading">LOADING WORLD…</div>
    <section id="battleInstance" class="battle-instance" aria-label="Battle Instance" hidden><strong>BATTLE INSTANCE</strong><span id="battleText">Entity focus becomes a tactical viewer representation while the world coordinate identity remains unchanged.</span></section>
    <nav class="bottom-slider" aria-label="World Builder controls" data-ui>
      <div class="bottom-slider-track">
        <button id="back" class="square-action" type="button" aria-label="Home">⌂</button>
        <button id="imageUploadToggle" class="square-action" type="button" aria-label="Add image" aria-haspopup="dialog">▧</button>
        <button id="parallaxAdd" class="square-action" type="button" aria-label="Add parallax gap">≋</button>
        <button id="keyboardToggle" class="square-action" type="button" aria-label="Open World Builder keyboard" aria-expanded="false" aria-controls="viewerKeyboard">⌨</button>
        <button id="settingsToggle" class="square-action" type="button" aria-label="World Builder settings" aria-haspopup="dialog">⚙</button>
        <button id="zoomOut" class="square-action" type="button" aria-label="Zoom out">−</button>
        <button id="zoomIn" class="square-action" type="button" aria-label="Zoom in">+</button>
        <button id="fit" class="square-action" type="button" aria-label="Fit map to screen">⛶</button>
      </div>
    </nav>
    <section id="viewerSettingsPanel" class="viewer-settings-panel" role="dialog" aria-modal="true" aria-label="World Builder settings" hidden data-ui>
      <div class="viewer-settings-card">
        <header><strong>SETTINGS</strong><button id="viewerSettingsClose" type="button" aria-label="Close settings">×</button></header>
        <button id="settingsFit" type="button" aria-label="Fit map to screen"><span aria-hidden="true">⛶</span><strong aria-hidden="true">View</strong></button>
        <button id="settingsResetTilt" type="button"><span aria-hidden="true">⌁</span><strong>Reset Tilt</strong></button>
        <button id="settingsStartMenu" type="button"><span aria-hidden="true">⌂</span><strong>Start Menu</strong></button>
      </div>
    </section>
    <section id="imageUploadPanel" class="image-upload-panel" role="dialog" aria-modal="true" aria-label="Add image" hidden data-ui>
      <div class="image-upload-card">
        <header><strong>ADD IMAGE</strong><button id="imageUploadClose" type="button" aria-label="Close image upload">×</button></header>
        <div class="image-position-grid">
          <label><span>X</span><input id="imageX" type="number" min="0" max="1" step="0.001" inputmode="decimal" /></label>
          <label><span>Y</span><input id="imageY" type="number" min="0" max="1" step="0.001" inputmode="decimal" /></label>
        </div>
        <label class="image-transparency"><input id="imageTransparency" type="checkbox" checked /> <span>Automatic transparency</span></label>
        <div id="imageDropzone" class="image-dropzone" tabindex="0" role="button" aria-label="Drop an image here or browse for an image">
          <strong>DROP IMAGE HERE</strong>
          <span>or</span>
          <button id="imageBrowse" type="button">BROWSE</button>
          <input id="imageFile" type="file" accept="image/*" hidden />
        </div>
      </div>
    </section>
    <section id="viewerKeyboard" class="keyboard" aria-label="World Builder contextual keyboard" hidden data-ui>
      <div class="keyboard-head"><strong>VIEWER-MOUNTED KEYBOARD · PERCEPTION / TOOLS ONLY</strong><button id="keyboardClose" type="button" aria-label="Close keyboard">×</button></div>
      <div id="keyboardTabs" class="keyboard-tabs" role="tablist" aria-label="Keyboard modes"></div>
      <div id="keyboardKeys" class="keyboard-keys"></div>
    </section>
    <div id="live" class="sr-live" role="status" aria-live="polite"></div>
  </section>
</main>
<script src="./prototype.js"></script>
</body>
</html>
