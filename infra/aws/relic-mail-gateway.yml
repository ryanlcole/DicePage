AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ReLiCGameMaster secure transient mail gateway for query@relicgamemaster.com

Parameters:
  DomainName:
    Type: String
    Default: relicgamemaster.com
  SupportAddress:
    Type: String
    Default: query@relicgamemaster.com
  SupportGmail:
    Type: String
    Default: relic.gamemaster@gmail.com
  ReceiptRuleSetName:
    Type: String
    Default: relic-mail-gateway

Resources:
  MailKey:
    Type: AWS::KMS::Key
    Properties:
      Description: ReLiC transient mail encryption key
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: RootAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: AllowSESToEncryptInboundMail
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action:
              - kms:GenerateDataKey
              - kms:Encrypt
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
  MailKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/relic-mail-gateway
      TargetKeyId: !Ref MailKey

  MailBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt MailKey.Arn
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: DestroyTransientMailAfter30Days
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  MailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSESInboundWrite
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${MailBucket.Arn}/raw/*'
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  TicketTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticket
          AttributeType: S
      KeySchema:
        - AttributeName: ticket
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt MailKey.Arn
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  GatewayFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: app.lambda_handler
      CodeUri: relic-mail/functions/gateway/
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          MAIL_BUCKET: !Ref MailBucket
          TICKET_TABLE: !Ref TicketTable
          KMS_KEY_ID: !GetAtt MailKey.Arn
          SUPPORT_GMAIL: !Ref SupportGmail
          SUPPORT_ADDRESS: !Ref SupportAddress
          MAIL_FROM: !Ref SupportAddress
          RETENTION_SECONDS: '2592000'
          MAIL_PREFIX: raw/
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
                - s3:PutObjectTagging
              Resource: !Sub '${MailBucket.Arn}/raw/*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt TicketTable.Arn
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: !GetAtt MailKey.Arn
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'

  AllowSESInvokeGateway:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GatewayFunction
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  DomainIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref DomainName
      DkimAttributes:
        SigningEnabled: true

  ReceiptRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Properties:
      RuleSetName: !Ref ReceiptRuleSetName

  SupportReceiptRule:
    Type: AWS::SES::ReceiptRule
    DependsOn:
      - MailBucketPolicy
      - AllowSESInvokeGateway
    Properties:
      RuleSetName: !Ref ReceiptRuleSet
      Rule:
        Name: query-support
        Enabled: true
        ScanEnabled: true
        TlsPolicy: Require
        Recipients:
          - !Ref SupportAddress
        Actions:
          - S3Action:
              BucketName: !Ref MailBucket
              ObjectKeyPrefix: raw/
              KmsKeyArn: !GetAtt MailKey.Arn
          - LambdaAction:
              FunctionArn: !GetAtt GatewayFunction.Arn
              InvocationType: Event

Outputs:
  MailBucketName:
    Value: !Ref MailBucket
  TicketTableName:
    Value: !Ref TicketTable
  GatewayFunctionName:
    Value: !Ref GatewayFunction
  ReceiptRuleSet:
    Value: !Ref ReceiptRuleSet
  DomainIdentityArn:
    Value: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${DomainName}
  RequiredMXTarget:
    Description: Configure the domain MX record at GoDaddy to this SES inbound endpoint.
    Value: !Sub '10 inbound-smtp.${AWS::Region}.amazonaws.com'
  SupportAddress:
    Value: !Ref SupportAddress
