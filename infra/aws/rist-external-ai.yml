AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RIST external-AI defensive runtime, ReLiC canon MCP boundary, plus isolated EIOS semantic perception bridge

Parameters:
  IdentityTableName:
    Type: String
    Description: Existing Discord auth/session DynamoDB table
  FrontendOrigin:
    Type: String
    Default: https://relicgamemaster.com
  OwnerUserId:
    Type: String
    Default: ''
    Description: RIST platform owner user UUID
  OwnerReleased:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Master external-agent release. Deployment workflow intentionally pins this false.
  EiosModelId:
    Type: String
    Default: us.amazon.nova-lite-v1:0
    Description: Bedrock model or inference profile used only by the isolated EIOS lab bridge
  DiscordAuthApiBaseUrl:
    Type: String
    Description: Existing RIST Discord auth API used only for the ReLiC MCP OAuth identity handoff

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        IDENTITY_TABLE: !Ref IdentityTableName
        AI_STATE_TABLE: !Ref ExternalAiStateTable
        AI_AUDIT_TABLE: !Ref ExternalAiAuditTable
        OWNER_USER_ID: !Ref OwnerUserId
        OWNER_RELEASED: !Ref OwnerReleased
        FRONTEND_ORIGIN: !Ref FrontendOrigin

Resources:
  ExternalAiStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ExternalAiAuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  RelicMcpMemoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  RelicMcpAuthTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ExternalAiHumanApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref FrontendOrigin]
        AllowHeaders: [authorization, content-type, accept, mcp-protocol-version, mcp-method, mcp-name, mcp-session-id]
        AllowMethods: [GET, POST, OPTIONS]
        MaxAge: 300
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  EiosLabApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref FrontendOrigin]
        AllowHeaders: [content-type]
        AllowMethods: [GET, POST, OPTIONS]
        MaxAge: 300
      DefaultRouteSettings:
        ThrottlingBurstLimit: 3
        ThrottlingRateLimit: 2

  RelicMcpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders:
          - authorization
          - content-type
          - accept
          - mcp-session-id
          - mcp-protocol-version
          - mcp-method
          - mcp-name
        ExposeHeaders: [mcp-session-id]
        AllowMethods: [GET, POST, OPTIONS]
        MaxAge: 300
      DefaultRouteSettings:
        ThrottlingBurstLimit: 30
        ThrottlingRateLimit: 15

  ExternalAiHumanFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: rist_external_ai_handler.human_handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref IdentityTableName }
        - DynamoDBCrudPolicy: { TableName: !Ref ExternalAiStateTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ExternalAiAuditTable }
      Events:
        Status:
          Type: HttpApi
          Properties: { ApiId: !Ref ExternalAiHumanApi, Path: /external-ai/status, Method: GET }
        LifeReplenish:
          Type: HttpApi
          Properties: { ApiId: !Ref ExternalAiHumanApi, Path: /external-ai/life/replenish, Method: POST }
        NpcReview:
          Type: HttpApi
          Properties: { ApiId: !Ref ExternalAiHumanApi, Path: /external-ai/npc/review, Method: POST }

  ExternalAiGatewayFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: rist_external_ai_gateway.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref IdentityTableName }
        - DynamoDBCrudPolicy: { TableName: !Ref ExternalAiStateTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ExternalAiAuditTable }
      Events:
        Policy:
          Type: HttpApi
          Properties: { ApiId: !Ref ExternalAiHumanApi, Path: /external-ai/policy, Method: GET }
        Register:
          Type: HttpApi
          Properties: { ApiId: !Ref ExternalAiHumanApi, Path: /external-ai/register, Method: POST }
        Login:
          Type: HttpApi
          Properties: { ApiId: !Ref ExternalAiHumanApi, Path: /external-ai/login, Method: POST }
        SessionStatus:
          Type: HttpApi
          Properties: { ApiId: !Ref ExternalAiHumanApi, Path: /external-ai/session/status, Method: POST }
        RegistrationReview:
          Type: HttpApi
          Properties: { ApiId: !Ref ExternalAiHumanApi, Path: /external-ai/registration/review, Method: POST }


  ReLiCMcpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: rist_relic_mcp.handler
      Timeout: 15
      MemorySize: 384
      Environment:
        Variables:
          MCP_MEMORY_TABLE: !Ref RelicMcpMemoryTable
          MCP_AUTH_TABLE: !Ref RelicMcpAuthTable
          MCP_PUBLIC_ORIGIN: !Ref FrontendOrigin
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RelicMcpMemoryTable }
        - DynamoDBReadPolicy: { TableName: !Ref RelicMcpAuthTable }
      Events:
        Mcp:
          Type: HttpApi
          Properties: { ApiId: !Ref RelicMcpApi, Path: /mcp, Method: ANY }

  EiosLabFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: rist_eios_bridge.handler
      Timeout: 20
      MemorySize: 512
      Environment:
        Variables:
          EIOS_MODEL_ID: !Ref EiosModelId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        Status:
          Type: HttpApi
          Properties: { ApiId: !Ref EiosLabApi, Path: /eios/status, Method: GET }
        Query:
          Type: HttpApi
          Properties: { ApiId: !Ref EiosLabApi, Path: /eios/query, Method: POST }

  ExternalAiSecurityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: rist_external_ai_handler.security_handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ExternalAiStateTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ExternalAiAuditTable }

  RelicMcpOauthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: relic_mcp_auth.handler
      Timeout: 15
      MemorySize: 384
      Environment:
        Variables:
          MCP_AUTH_TABLE: !Ref RelicMcpAuthTable
          PUBLIC_ORIGIN: !Ref FrontendOrigin
          DISCORD_AUTH_API: !Ref DiscordAuthApiBaseUrl
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RelicMcpAuthTable }
        - DynamoDBCrudPolicy: { TableName: !Ref IdentityTableName }
      Events:
        AuthorizationMetadata:
          Type: HttpApi
          Properties: { ApiId: !Ref RelicMcpApi, Path: /.well-known/oauth-authorization-server, Method: GET }
        OpenIdMetadata:
          Type: HttpApi
          Properties: { ApiId: !Ref RelicMcpApi, Path: /.well-known/openid-configuration, Method: GET }
        ProtectedResourceMetadata:
          Type: HttpApi
          Properties: { ApiId: !Ref RelicMcpApi, Path: /.well-known/oauth-protected-resource, Method: GET }
        ProtectedResourceMcpMetadata:
          Type: HttpApi
          Properties: { ApiId: !Ref RelicMcpApi, Path: /.well-known/oauth-protected-resource/mcp, Method: GET }
        OAuthRegister:
          Type: HttpApi
          Properties: { ApiId: !Ref RelicMcpApi, Path: /oauth/register, Method: POST }
        OAuthAuthorize:
          Type: HttpApi
          Properties: { ApiId: !Ref RelicMcpApi, Path: /oauth/authorize, Method: GET }
        OAuthIdentityGet:
          Type: HttpApi
          Properties: { ApiId: !Ref RelicMcpApi, Path: /oauth/identity, Method: GET }
        OAuthIdentityPost:
          Type: HttpApi
          Properties: { ApiId: !Ref RelicMcpApi, Path: /oauth/identity, Method: POST }
        OAuthToken:
          Type: HttpApi
          Properties: { ApiId: !Ref RelicMcpApi, Path: /oauth/token, Method: POST }

Outputs:
  RelicMcpApiBaseUrl:
    Description: ReLiC MCP and OAuth API base URL
    Value: !Sub https://${RelicMcpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  RelicMcpResource:
    Description: Canonical public ReLiC MCP OAuth resource identifier
    Value: !Sub ${FrontendOrigin}/mcp
  ReLiCMcpOriginUrl:
    Description: Direct API Gateway ReLiC MCP origin used for deployment health checks
    Value: !Sub https://${RelicMcpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/mcp
  RelicMcpMemoryTableName:
    Description: Dedicated private ReLiC persistent identity and state table
    Value: !Ref RelicMcpMemoryTable
  ExternalAiHumanApiBaseUrl:
    Description: Human-authenticated operator API plus owner-locked external-AI policy/registration/login gateway
    Value: !Sub https://${ExternalAiHumanApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  ExternalAiPolicyPath:
    Description: Machine-readable AI policy endpoint
    Value: /external-ai/policy
  ExternalAiRegisterPath:
    Description: AI registration endpoint
    Value: /external-ai/register
  ExternalAiLoginPath:
    Description: AI login endpoint
    Value: /external-ai/login
  ExternalAiSessionStatusPath:
    Description: AI UTC session status endpoint
    Value: /external-ai/session/status
  ReLiCMcpUrl:
    Description: Canonical public ReLiC MCP endpoint with anonymous canon tools and OAuth-scoped private memory
    Value: !Sub ${FrontendOrigin}/mcp
  ReLiCCanonDiscoveryPath:
    Description: Public machine-readable ReLiC canon discovery path on relicgamemaster.com
    Value: /.well-known/relic-canon.json
  ExternalAiSecurityFunctionArn:
    Description: Internal-only classified security-event conversion Lambda; intentionally has no public route
    Value: !GetAtt ExternalAiSecurityFunction.Arn
  ExternalAiOwnerReleased:
    Description: Effective deployment-time master external-agent release flag
    Value: !Ref OwnerReleased
  EiosLabApiBaseUrl:
    Description: Isolated EIOS semantic perception bridge API
    Value: !Sub https://${EiosLabApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  EiosLabQueryPath:
    Description: EIOS semantic query endpoint
    Value: /eios/query
  EiosLabStatusPath:
    Description: EIOS bridge status endpoint
    Value: /eios/status
  EiosLabModelId:
    Description: Bedrock model configured for EIOS lab
    Value: !Ref EiosModelId
