AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RIST Discord authentication, guardian consent, asset content ratings, and private per-user storage

Parameters:
  DiscordClientId:
    Type: String
    Description: Discord application client ID
  DiscordClientSecretArn:
    Type: String
    Description: Secrets Manager ARN containing the Discord client secret
  FrontendOrigin:
    Type: String
    Default: https://relicgamemaster.com
    Description: Browser origin only; do not include a path or trailing slash
  FrontendUrl:
    Type: String
    Default: https://relicgamemaster.com/Play/index.html
  SessionHours:
    Type: Number
    Default: 12
    MinValue: 1
    MaxValue: 168

Resources:
  PrivateStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref FrontendOrigin
            AllowedMethods: [GET, POST]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  IdentityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  AuthApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 300

  AuthStorageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          DISCORD_CLIENT_ID: !Ref DiscordClientId
          DISCORD_SECRET_ARN: !Ref DiscordClientSecretArn
          FRONTEND_URL: !Ref FrontendUrl
          FRONTEND_ORIGIN: !Ref FrontendOrigin
          SESSION_HOURS: !Ref SessionHours
          IDENTITY_TABLE: !Ref IdentityTable
          STORAGE_BUCKET: !Ref PrivateStorageBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IdentityTable
        - S3CrudPolicy:
            BucketName: !Ref PrivateStorageBucket
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DiscordClientSecretArn
      Events:
        Login:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /auth/login, Method: GET }
        GuardianLogin:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /auth/guardian, Method: GET }
        Callback:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /auth/callback, Method: GET }
        SessionHandoff:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /auth/session, Method: GET }
        Me:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /me, Method: GET }
        Logout:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /auth/logout, Method: POST }
        GuardianRequest:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /guardian/request, Method: POST }
        GuardianPending:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /guardian/pending, Method: GET }
        GuardianApprove:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /guardian/approve, Method: POST }
        GuardianDeny:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /guardian/deny, Method: POST }
        GuardianStatus:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /guardian/status, Method: GET }
        AssetRatingRegister:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /assets/rating/register, Method: POST }
        AssetRatingGet:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /assets/rating, Method: GET }
        AssetRatingReport:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /assets/rating/report, Method: POST }
        Upload:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /storage/upload, Method: POST }
        Download:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /storage/download, Method: GET }
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /storage/list, Method: GET }
        DeleteAccount:
          Type: HttpApi
          Properties: { ApiId: !Ref AuthApi, Path: /account/delete, Method: POST }
      InlineCode: |
        import base64, boto3, hashlib, json, os, re, secrets, time, urllib.error, urllib.parse, urllib.request, uuid

        ddb = boto3.resource("dynamodb").Table(os.environ["IDENTITY_TABLE"])
        s3 = boto3.client("s3")
        sm = boto3.client("secretsmanager")
        FRONTEND = os.environ["FRONTEND_URL"]
        FRONTEND_ORIGIN = os.environ["FRONTEND_ORIGIN"]
        CLIENT_ID = os.environ["DISCORD_CLIENT_ID"]
        BUCKET = os.environ["STORAGE_BUCKET"]
        SESSION_SECONDS = int(os.environ["SESSION_HOURS"]) * 3600
        DISCORD_USER_AGENT = "ReLiCGameMaster-RIST/1.0"
        CONTENT_POLICY_VERSION = "2026-08-31"
        CONTENT_DESCRIPTORS = {
            "mature-conversation", "violence-gore", "alcohol", "tobacco-smoking",
            "drugs", "gambling", "sexual-themes", "explicit-sexual-content"
        }
        MINOR_DESCRIPTORS = {
            "mature-conversation", "violence-gore", "alcohol", "tobacco-smoking", "drugs", "gambling"
        }
        ALLOWED_TYPES = {
            "application/json", "application/zip", "image/png", "image/jpeg",
            "image/webp", "image/gif", "text/plain", "application/octet-stream"
        }

        def response(status, body=None, location=None):
            headers = {
                "access-control-allow-origin": FRONTEND_ORIGIN.rstrip("/"),
                "access-control-allow-headers": "authorization,content-type",
                "access-control-allow-methods": "GET,POST,OPTIONS",
                "cache-control": "no-store",
                "content-type": "application/json"
            }
            if location:
                headers["location"] = location
            payload = "" if body is None else json.dumps(body, separators=(",", ":"))
            return {"statusCode": status, "headers": headers, "body": payload}

        def frontend_error(code):
            sep = "&" if "?" in FRONTEND else "?"
            return response(302, location=FRONTEND + sep + "rist_auth_error=" + urllib.parse.quote(code))

        def read_secret(secret_arn, names):
            result = sm.get_secret_value(SecretId=secret_arn)
            raw = result.get("SecretString")
            if not raw and result.get("SecretBinary"):
                raw = base64.b64decode(result["SecretBinary"]).decode()
            if not raw:
                raise ValueError("Secret is empty")
            raw = raw.strip()
            try:
                value = json.loads(raw)
            except json.JSONDecodeError:
                return raw
            if isinstance(value, str):
                return value.strip()
            if isinstance(value, dict):
                for name in names:
                    secret = value.get(name)
                    if secret:
                        return str(secret).strip()
            raise ValueError("Secret has an unsupported format")

        def secret_value():
            return read_secret(os.environ["DISCORD_SECRET_ARN"], ("client_secret", "clientSecret", "secret"))

        def api_base(event):
            ctx = event["requestContext"]
            stage = ctx.get("stage", "")
            suffix = "" if stage in ("", "$default") else "/" + stage.strip("/")
            return "https://" + ctx["domainName"] + suffix

        def auth(event):
            header = (event.get("headers") or {}).get("authorization", "")
            if not header.lower().startswith("bearer "):
                return None
            token = header.split(" ", 1)[1].strip()
            digest = hashlib.sha256(token.encode()).hexdigest()
            item = ddb.get_item(Key={"pk": "session#" + digest}).get("Item")
            if not item or int(item.get("expiresAt", 0)) <= int(time.time()):
                return None
            return item

        def safe_key(raw):
            raw = urllib.parse.unquote(raw or "").replace("\\", "/").strip("/")
            if not raw or len(raw) > 512 or ".." in raw.split("/"):
                raise ValueError("Invalid key")
            if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._ /-]*", raw):
                raise ValueError("Invalid key")
            return raw

        def safe_asset_id(raw):
            value = str(raw or "").strip()
            if not value or len(value) > 512:
                raise ValueError("Invalid asset ID")
            return value

        def rating_key(asset_id):
            return "assetrating#" + hashlib.sha256(asset_id.encode()).hexdigest()

        def guardian_key(child_user_id, child_account_id):
            return "guardian#" + child_user_id + "#" + child_account_id

        def sanitize_descriptors(values, allowed=CONTENT_DESCRIPTORS):
            if not isinstance(values, list):
                return []
            return sorted({str(x) for x in values if str(x) in allowed})

        def json_body(event):
            body = event.get("body") or "{}"
            if event.get("isBase64Encoded"):
                body = base64.b64decode(body).decode()
            return json.loads(body)

        def discord_redirect(event, state):
            redirect = api_base(event) + "/auth/callback"
            params = urllib.parse.urlencode({
                "client_id": CLIENT_ID, "redirect_uri": redirect,
                "response_type": "code", "scope": "identify", "state": state,
                "prompt": "consent"
            })
            return response(302, location="https://discord.com/oauth2/authorize?" + params)

        def notification_key(user_id, asset_id, now):
            digest = hashlib.sha256(asset_id.encode()).hexdigest()[:16]
            return "users/{}/account/notifications/{}-asset-rating-{}.json".format(user_id, now, digest)

        def notify_asset_rating_change(uploader_user_id, asset_id, descriptors, report_count, now):
            if not uploader_user_id:
                return
            notice = {
                "type": "asset-rating-auto-restriction",
                "assetId": asset_id,
                "effectiveDescriptors": descriptors,
                "uniqueReporterCount": report_count,
                "createdAt": now,
                "message": "Your asset content restrictions were automatically tightened after more than five different signed-in users reported the rating. The report remains queued for manual review."
            }
            s3.put_object(
                Bucket=BUCKET,
                Key=notification_key(uploader_user_id, asset_id, now),
                Body=json.dumps(notice, separators=(",", ":")).encode(),
                ContentType="application/json"
            )

        def handler(event, context):
            route = event["requestContext"]["http"]["method"] + " " + event["rawPath"]
            query = event.get("queryStringParameters") or {}
            now = int(time.time())

            if route == "GET /auth/login":
                state = secrets.token_urlsafe(32)
                ddb.put_item(Item={"pk": "state#" + state, "expiresAt": now + 600})
                return discord_redirect(event, state)

            if route == "GET /auth/guardian":
                request_token = query.get("request") or ""
                request_item = ddb.get_item(Key={"pk": "guardianreq#" + request_token}).get("Item")
                if not request_item or int(request_item.get("expiresAt", 0)) <= now:
                    return frontend_error("guardian_request_expired")
                state = secrets.token_urlsafe(32)
                ddb.put_item(Item={
                    "pk": "state#" + state,
                    "guardianRequestToken": request_token,
                    "expiresAt": now + 600
                })
                return discord_redirect(event, state)

            if route == "GET /auth/callback":
                code, state = query.get("code"), query.get("state")
                state_key = {"pk": "state#" + (state or "")}
                saved_state = ddb.get_item(Key=state_key).get("Item")
                if not code or not saved_state or int(saved_state.get("expiresAt", 0)) <= now:
                    return frontend_error("invalid_state")
                ddb.delete_item(Key=state_key)
                stage = "token"
                try:
                    redirect = api_base(event) + "/auth/callback"
                    encoded = urllib.parse.urlencode({
                        "client_id": CLIENT_ID, "client_secret": secret_value(),
                        "grant_type": "authorization_code", "code": code,
                        "redirect_uri": redirect
                    }).encode()
                    req = urllib.request.Request(
                        "https://discord.com/api/v10/oauth2/token", data=encoded,
                        headers={
                            "Content-Type": "application/x-www-form-urlencoded",
                            "Accept": "application/json",
                            "User-Agent": DISCORD_USER_AGENT
                        }
                    )
                    with urllib.request.urlopen(req, timeout=8) as r:
                        token_payload = json.loads(r.read())
                    discord_token = token_payload.get("access_token")
                    if not discord_token:
                        raise ValueError("Discord token response did not include access_token")

                    stage = "profile"
                    req = urllib.request.Request(
                        "https://discord.com/api/v10/users/@me",
                        headers={
                            "Authorization": "Bearer " + discord_token,
                            "Accept": "application/json",
                            "User-Agent": DISCORD_USER_AGENT
                        }
                    )
                    with urllib.request.urlopen(req, timeout=8) as r:
                        profile = json.loads(r.read())

                    stage = "session"
                    discord_id = str(profile["id"])
                    user_id = str(uuid.uuid5(uuid.NAMESPACE_URL, "rist:discord:" + discord_id))
                    guardian_request_token = str(saved_state.get("guardianRequestToken") or "")
                    if guardian_request_token:
                        guardian_request = ddb.get_item(Key={"pk": "guardianreq#" + guardian_request_token}).get("Item")
                        if not guardian_request or int(guardian_request.get("expiresAt", 0)) <= now:
                            return frontend_error("guardian_request_expired")
                        if user_id == guardian_request.get("childUserId"):
                            return frontend_error("guardian_must_be_different_account")

                    token = secrets.token_urlsafe(48)
                    digest = hashlib.sha256(token.encode()).hexdigest()
                    session_item = {
                        "pk": "session#" + digest, "userId": user_id,
                        "username": profile.get("global_name") or profile.get("username") or "Discord user",
                        "expiresAt": now + SESSION_SECONDS
                    }
                    if guardian_request_token:
                        session_item["guardianRequestToken"] = guardian_request_token
                    ddb.put_item(Item=session_item)
                    handoff = secrets.token_urlsafe(32)
                    ddb.put_item(Item={
                        "pk": "handoff#" + handoff, "sessionToken": token,
                        "expiresAt": now + 120
                    })
                    target = FRONTEND + "?rist_handoff=" + urllib.parse.quote(handoff)
                    return response(302, location=target)
                except urllib.error.HTTPError as exc:
                    detail = exc.read().decode("utf-8", "replace")[:1000]
                    print("Discord OAuth HTTP error", "stage=" + stage, "status=" + str(exc.code), detail)
                    return frontend_error("discord_" + stage + "_" + str(exc.code))
                except Exception as exc:
                    print("Discord OAuth callback error", "stage=" + stage, type(exc).__name__, str(exc)[:1000])
                    return frontend_error("callback_" + stage)

            if route == "GET /auth/session":
                handoff = query.get("handoff") or ""
                key = {"pk": "handoff#" + handoff}
                saved = ddb.get_item(Key=key).get("Item")
                if saved:
                    ddb.delete_item(Key=key)
                if not saved or int(saved.get("expiresAt", 0)) <= now:
                    return response(400, {"error": "Invalid or expired login handoff"})
                return response(200, {"sessionToken": saved["sessionToken"]})

            session = auth(event)
            if not session:
                return response(401, {"error": "Authentication required"})

            if route == "GET /me":
                return response(200, {
                    "userId": session["userId"],
                    "displayName": session["username"],
                    "storagePrefix": "users/" + session["userId"] + "/",
                    "age21Verified": False,
                    "ageVerificationAvailable": False,
                    "guardianConsentPending": bool(session.get("guardianRequestToken"))
                })

            if route == "POST /auth/logout":
                header = event["headers"]["authorization"].split(" ", 1)[1]
                ddb.delete_item(Key={"pk": "session#" + hashlib.sha256(header.encode()).hexdigest()})
                return response(204)

            if route == "POST /guardian/request":
                body = json_body(event)
                account_id = str(body.get("childAccountId") or "").strip()
                alias = str(body.get("childAlias") or "").strip()[:64]
                version = str(body.get("consentVersion") or "").strip()
                if not re.fullmatch(r"[A-Za-z0-9-]{8,80}", account_id) or not alias or version != CONTENT_POLICY_VERSION:
                    return response(400, {"error": "Invalid guardian consent request"})
                descriptors = sanitize_descriptors(body.get("requestedDescriptors"), MINOR_DESCRIPTORS)
                token = secrets.token_urlsafe(32)
                ddb.delete_item(Key={"pk": guardian_key(session["userId"], account_id)})
                ddb.put_item(Item={
                    "pk": "guardianreq#" + token,
                    "childUserId": session["userId"],
                    "childAccountId": account_id,
                    "childAlias": alias,
                    "requestedDescriptors": descriptors,
                    "requestedAt": now,
                    "consentVersion": version,
                    "expiresAt": now + 1800
                })
                url = api_base(event) + "/auth/guardian?" + urllib.parse.urlencode({"request": token})
                return response(200, {"url": url})

            if route == "GET /guardian/pending":
                token = str(session.get("guardianRequestToken") or "")
                item = ddb.get_item(Key={"pk": "guardianreq#" + token}).get("Item") if token else None
                if not item or int(item.get("expiresAt", 0)) <= now:
                    return response(404, {"error": "Guardian consent request expired"})
                if item.get("childUserId") == session["userId"]:
                    return response(403, {"error": "Guardian must use a different account"})
                return response(200, {
                    "childUserId": item["childUserId"],
                    "childAccountId": item["childAccountId"],
                    "childAlias": item["childAlias"],
                    "requestedDescriptors": item.get("requestedDescriptors", []),
                    "requestedAtUtc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(int(item["requestedAt"]))),
                    "consentVersion": item["consentVersion"]
                })

            if route == "POST /guardian/approve":
                token = str(session.get("guardianRequestToken") or "")
                item = ddb.get_item(Key={"pk": "guardianreq#" + token}).get("Item") if token else None
                if not item or int(item.get("expiresAt", 0)) <= now:
                    return response(404, {"error": "Guardian consent request expired"})
                body = json_body(event)
                if body.get("adultAttested") is not True:
                    return response(400, {"error": "Adult guardian attestation is required"})
                if item.get("childUserId") == session["userId"]:
                    return response(403, {"error": "Guardian must use a different account"})
                descriptors = sanitize_descriptors(item.get("requestedDescriptors"), MINOR_DESCRIPTORS)
                ddb.put_item(Item={
                    "pk": guardian_key(item["childUserId"], item["childAccountId"]),
                    "childUserId": item["childUserId"],
                    "childAccountId": item["childAccountId"],
                    "guardianUserId": session["userId"],
                    "approvedDescriptors": descriptors,
                    "consentedAt": now,
                    "consentVersion": item["consentVersion"]
                })
                ddb.delete_item(Key={"pk": "guardianreq#" + token})
                return response(204)

            if route == "POST /guardian/deny":
                token = str(session.get("guardianRequestToken") or "")
                if token:
                    ddb.delete_item(Key={"pk": "guardianreq#" + token})
                return response(204)

            if route == "GET /guardian/status":
                account_id = str(query.get("accountId") or "").strip()
                if not re.fullmatch(r"[A-Za-z0-9-]{8,80}", account_id):
                    return response(400, {"error": "Invalid account ID"})
                item = ddb.get_item(Key={"pk": guardian_key(session["userId"], account_id)}).get("Item")
                if not item:
                    return response(200, {"approved": False, "childAccountId": account_id, "approvedDescriptors": []})
                return response(200, {
                    "approved": True,
                    "childAccountId": item["childAccountId"],
                    "approvedDescriptors": item.get("approvedDescriptors", []),
                    "consentedAtUtc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(int(item["consentedAt"]))),
                    "consentVersion": item.get("consentVersion")
                })

            if route == "POST /assets/rating/register":
                body = json_body(event)
                asset_id = safe_asset_id(body.get("assetId"))
                descriptors = sanitize_descriptors(body.get("providerDescriptors"))
                explicit_general = body.get("explicitGeneral") is True
                if not descriptors and not explicit_general:
                    return response(400, {"error": "Provider must explicitly rate the asset"})
                key = rating_key(asset_id)
                existing = ddb.get_item(Key={"pk": key}).get("Item")
                if existing and existing.get("uploaderUserId") != session["userId"]:
                    return response(403, {"error": "Only the provider can change the provider rating"})
                ddb.put_item(Item={
                    "pk": key,
                    "assetId": asset_id,
                    "uploaderUserId": session["userId"],
                    "providerDescriptors": descriptors,
                    "effectiveDescriptors": descriptors,
                    "explicitGeneral": explicit_general,
                    "ratingVersion": CONTENT_POLICY_VERSION,
                    "ratedAt": now,
                    "reports": {},
                    "uniqueReportCount": 0,
                    "manualReviewRequired": False,
                    "autoRestricted": False
                })
                return response(200, {
                    "assetId": asset_id, "providerDescriptors": descriptors,
                    "effectiveDescriptors": descriptors, "uniqueReportCount": 0,
                    "manualReviewRequired": False, "autoRestricted": False,
                    "ratingVersion": CONTENT_POLICY_VERSION
                })

            if route == "GET /assets/rating":
                asset_id = safe_asset_id(query.get("assetId"))
                item = ddb.get_item(Key={"pk": rating_key(asset_id)}).get("Item")
                if not item:
                    return response(404, {"error": "Asset rating not found"})
                return response(200, {
                    "assetId": item["assetId"],
                    "providerDescriptors": item.get("providerDescriptors", []),
                    "effectiveDescriptors": item.get("effectiveDescriptors", []),
                    "uniqueReportCount": int(item.get("uniqueReportCount", 0)),
                    "manualReviewRequired": bool(item.get("manualReviewRequired")),
                    "autoRestricted": bool(item.get("autoRestricted")),
                    "ratingVersion": item.get("ratingVersion", CONTENT_POLICY_VERSION)
                })

            if route == "POST /assets/rating/report":
                body = json_body(event)
                asset_id = safe_asset_id(body.get("assetId"))
                suggestions = sanitize_descriptors(body.get("suggestedDescriptors"))
                explicit_general = body.get("explicitGeneral") is True
                if not suggestions and not explicit_general:
                    return response(400, {"error": "A suggested rating is required"})
                key = rating_key(asset_id)
                item = ddb.get_item(Key={"pk": key}).get("Item")
                if not item:
                    return response(404, {"error": "Asset rating not found"})
                reporter = hashlib.sha256((asset_id + ":" + session["userId"]).encode()).hexdigest()
                reports = dict(item.get("reports") or {})
                reports[reporter] = {
                    "suggestedDescriptors": suggestions,
                    "explicitGeneral": explicit_general,
                    "reportedAt": now
                }
                unique_count = len(reports)
                effective = set(item.get("effectiveDescriptors") or [])
                auto_restricted = bool(item.get("autoRestricted"))
                changed = False
                if unique_count > 5:
                    tightened = set(effective)
                    for report in reports.values():
                        tightened.update(sanitize_descriptors(report.get("suggestedDescriptors")))
                    tightened.intersection_update(CONTENT_DESCRIPTORS)
                    if tightened != effective:
                        effective = tightened
                        changed = True
                    auto_restricted = True
                updated = dict(item)
                updated["reports"] = reports
                updated["uniqueReportCount"] = unique_count
                updated["manualReviewRequired"] = True
                updated["autoRestricted"] = auto_restricted
                updated["effectiveDescriptors"] = sorted(effective)
                updated["lastReportedAt"] = now
                if changed:
                    updated["autoRestrictedAt"] = now
                ddb.put_item(Item=updated)
                if changed:
                    notify_asset_rating_change(item.get("uploaderUserId"), asset_id, sorted(effective), unique_count, now)
                return response(200, {
                    "assetId": asset_id,
                    "effectiveDescriptors": sorted(effective),
                    "uniqueReportCount": unique_count,
                    "manualReviewRequired": True,
                    "autoRestricted": auto_restricted,
                    "restrictionChanged": changed
                })

            prefix = "users/" + session["userId"] + "/"

            if route == "POST /account/delete":
                account_id = None
                try:
                    profile_obj = s3.get_object(Bucket=BUCKET, Key=prefix + "account/profile.json")
                    profile = json.loads(profile_obj["Body"].read())
                    account_id = str(profile.get("AccountId") or profile.get("accountId") or "").strip()
                except Exception:
                    pass
                continuation = None
                while True:
                    args = {"Bucket": BUCKET, "Prefix": prefix, "MaxKeys": 1000}
                    if continuation:
                        args["ContinuationToken"] = continuation
                    result = s3.list_objects_v2(**args)
                    objects = [{"Key": item["Key"]} for item in result.get("Contents", [])]
                    if objects:
                        s3.delete_objects(Bucket=BUCKET, Delete={"Objects": objects, "Quiet": True})
                    if not result.get("IsTruncated"):
                        break
                    continuation = result.get("NextContinuationToken")
                if account_id:
                    ddb.delete_item(Key={"pk": guardian_key(session["userId"], account_id)})
                header = event["headers"]["authorization"].split(" ", 1)[1]
                ddb.delete_item(Key={"pk": "session#" + hashlib.sha256(header.encode()).hexdigest()})
                return response(204)

            if route == "POST /storage/upload":
                body = json_body(event)
                key = prefix + safe_key(body.get("key"))
                content_type = body.get("contentType") or "application/octet-stream"
                if content_type not in ALLOWED_TYPES:
                    return response(400, {"error": "Unsupported content type"})
                post = s3.generate_presigned_post(
                    Bucket=BUCKET, Key=key,
                    Fields={"Content-Type": content_type},
                    Conditions=[
                        {"Content-Type": content_type},
                        ["content-length-range", 1, 52428800],
                        ["eq", "$key", key]
                    ], ExpiresIn=300
                )
                return response(200, post)

            if route == "GET /storage/download":
                key = prefix + safe_key(query.get("key"))
                url = s3.generate_presigned_url(
                    "get_object", Params={"Bucket": BUCKET, "Key": key}, ExpiresIn=300
                )
                return response(200, {"url": url})

            if route == "GET /storage/list":
                requested = query.get("prefix") or ""
                clean = "" if not requested else safe_key(requested)
                result = s3.list_objects_v2(Bucket=BUCKET, Prefix=prefix + clean, MaxKeys=250)
                items = [{
                    "key": obj["Key"][len(prefix):], "size": obj["Size"],
                    "lastModified": obj["LastModified"].isoformat()
                } for obj in result.get("Contents", [])]
                return response(200, {"items": items, "truncated": result.get("IsTruncated", False)})

            return response(404, {"error": "Not found"})

Outputs:
  ApiBaseUrl:
    Value: !Sub https://${AuthApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  DiscordCallbackUrl:
    Value: !Sub https://${AuthApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/auth/callback
  GuardianConsentLoginUrl:
    Value: !Sub https://${AuthApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/auth/guardian
  PrivateStorageBucketName:
    Value: !Ref PrivateStorageBucket
