AWSTemplateFormatVersion: '2010-09-09'
Description: RIST production frontend hosting on private S3 + CloudFront + AWS WAF with authenticated Game delivery and bounded public preview

Parameters:
  DomainName:
    Type: String
    Default: ''
    Description: Optional production apex domain such as relicgamemaster.com
  CertificateArn:
    Type: String
    Default: ''
    Description: Optional us-east-1 ACM certificate covering the apex and www host
  AuthApiBaseUrl:
    Type: String
    Description: RIST authentication API base URL used by the Game viewer-request edge gate

Conditions:
  HasCustomDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref CertificateArn, '']]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  FrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub rist-frontend-oac-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub rist-security-${AWS::StackName}
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true

  GameEdgeAuthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: rist-frontend-edge-auth
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: rist-frontend-edge-auth-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  GameEdgeAuthFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: rist-frontend-edge-auth
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt GameEdgeAuthRole.Arn
      Timeout: 5
      MemorySize: 128
      Code:
        ZipFile: !Sub |
          'use strict';
          const https = require('https');
          const AUTH = '${AuthApiBaseUrl}'.replace(/\/$/, '');
          const verified = new Map();
          const TTL_MS = 60000;
          const PUBLIC_PREVIEW = 'Geonaph';

          function redirect(reason) {
            return {
              status: '302',
              statusDescription: 'Found',
              headers: {
                location: [{ key: 'Location', value: '/Play/?reason=' + encodeURIComponent(reason || 'login') }],
                'cache-control': [{ key: 'Cache-Control', value: 'no-store, max-age=0' }],
                'x-rist-auth': [{ key: 'X-RIST-Auth', value: 'required' }]
              }
            };
          }

          function isPublicPreview(request) {
            try {
              const params = new URLSearchParams(String(request.querystring || ''));
              return params.get('preview') === PUBLIC_PREVIEW;
            } catch {
              return false;
            }
          }

          function sessionCookie(request) {
            const rows = request.headers.cookie || [];
            for (const row of rows) {
              const parts = String(row.value || '').split(';');
              for (const part of parts) {
                const i = part.indexOf('=');
                if (i < 0) continue;
                const name = part.slice(0, i).trim();
                if (name !== 'rist_session') continue;
                try { return decodeURIComponent(part.slice(i + 1).trim()); }
                catch { return ''; }
              }
            }
            return '';
          }

          function verify(token) {
            return new Promise(resolve => {
              let url;
              try { url = new URL(AUTH + '/me'); }
              catch { resolve(false); return; }
              const req = https.request({
                protocol: url.protocol,
                hostname: url.hostname,
                port: url.port || 443,
                path: url.pathname + url.search,
                method: 'GET',
                headers: {
                  authorization: 'Bearer ' + token,
                  accept: 'application/json',
                  'user-agent': 'RIST-CloudFront-Auth/1.0'
                },
                timeout: 2200
              }, res => {
                res.resume();
                resolve(res.statusCode === 200);
              });
              req.on('timeout', () => { req.destroy(); resolve(false); });
              req.on('error', () => resolve(false));
              req.end();
            });
          }

          exports.handler = async event => {
            const request = event.Records[0].cf.request;

            // Preview is intentionally public, but only the canonical Geonaph
            // launch URL bypasses account verification. The Blazor runtime still
            // requires the matching one-shot preview intent and grants no logged-in
            // or private-storage authority.
            if (isPublicPreview(request)) return request;

            const token = sessionCookie(request);
            if (!token) return redirect('login');

            const now = Date.now();
            const cachedUntil = verified.get(token) || 0;
            if (cachedUntil > now) return request;

            if (!(await verify(token))) {
              verified.delete(token);
              return redirect('session');
            }

            if (verified.size > 256) verified.clear();
            verified.set(token, now + TTL_MS);
            return request;
          };

  GameEdgeAuthVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref GameEdgeAuthFunction
      Description: !Sub RIST Game authentication and public-preview edge gate for ${AWS::StackName}

  FrontendWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub rist-frontend-${AWS::StackName}
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: ristFrontendWebAcl
        SampledRequestsEnabled: true
      Rules:
        - Name: AWSManagedCommon
          Priority: 10
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: ristCommonRules
            SampledRequestsEnabled: true
        - Name: AWSManagedKnownBadInputs
          Priority: 20
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: ristKnownBadInputs
            SampledRequestsEnabled: true
        - Name: AWSManagedIpReputation
          Priority: 30
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: ristIpReputation
            SampledRequestsEnabled: true
        - Name: PerIpRateLimit
          Priority: 40
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 3000
              AggregateKeyType: IP
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: ristPerIpRateLimit
            SampledRequestsEnabled: true

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: GameEdgeAuthVersion
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If
          - HasCustomDomain
          - [!Ref DomainName, !Sub 'www.${DomainName}']
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        WebACLId: !GetAtt FrontendWebAcl.Arn
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        CacheBehaviors:
          # Only the HTML entry point needs an online session check. The Blazor
          # framework payload is static application code and must be fetchable
          # without invoking Lambda@Edge for every JS/WASM/DLL request during boot.
          - PathPattern: Game/index.html
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref SecurityHeaders
            LambdaFunctionAssociations:
              - EventType: viewer-request
                IncludeBody: false
                LambdaFunctionARN: !Ref GameEdgeAuthVersion
          - PathPattern: Game/*
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref SecurityHeaders
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

Outputs:
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
  FrontendDistributionDomainName:
    Value: !GetAtt FrontendDistribution.DomainName
  FrontendBaseUrl:
    Value: !Sub 'https://${FrontendDistribution.DomainName}/'
  FrontendWebAclArn:
    Value: !GetAtt FrontendWebAcl.Arn
  GameEdgeAuthVersionArn:
    Value: !Ref GameEdgeAuthVersion
  ProductionDomain:
    Condition: HasCustomDomain
    Value: !Sub 'https://${DomainName}/'
