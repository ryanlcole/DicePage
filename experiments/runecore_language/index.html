<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=5,user-scalable=yes"><meta name="theme-color" content="#05080e"><title>RuneCore | Atoms in View</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080e}canvas{width:100%;height:100%;display:block;touch-action:none}*{box-sizing:border-box}</style></head>
<body><canvas id="world" role="img" aria-label="Animated experimental ring patterns for atoms currently in the viewport. Drag to pan and pinch or scroll to zoom."></canvas>
<script>
'use strict';
// This is a view-only, self-contained preview: not a hosted persistent engine or an LLM.
// No offscreen atom is drawn. Symbols are user-supplied experimental labels.
const atoms = Object.freeze([
 {slot:'RAM1', symbol:'H', x:-2.1,y:0.75, rings:[{direction:'CW',seed:'1000'}]},
 {slot:'RAM2', symbol:'H', x:2.1,y:0.75, rings:[{direction:'CW',seed:'1000'}]},
 {slot:'RAM3', symbol:'O', x:0,y:-0.65, rings:[{direction:'CW',seed:'1010'},{direction:'CCW',seed:'11101110'}]},
 {slot:'RAM4', symbol:'H', x:70,y:45, rings:[{direction:'CW',seed:'1000'}]}
]);
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d');
let w=0,h=0,dpr=1,zoom=74,panX=0,panY=0,start=performance.now(),lastFrame=-1;
const pointers = new Map(); let gesture=null;
function resize(){dpr=Math.min(3,devicePixelRatio||1);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
function ringAt(seed,direction,tick){let k=tick%seed.length;return !k?seed:direction==='CW'?seed.slice(-k)+seed.slice(0,-k):seed.slice(k)+seed.slice(0,k)}
function screen(x,y){return [(x-panX)*zoom+w/2,(y-panY)*zoom+h/2]}
function drawAtom(atom,tick){const [cx,cy]=screen(atom.x,atom.y);const maxRadius=(atom.rings.length+0.55)*0.29*zoom;
 if(cx+maxRadius<0||cx-maxRadius>w||cy+maxRadius<0||cy-maxRadius>h)return;
 const haze=ctx.createRadialGradient(cx,cy,0,cx,cy,maxRadius*1.25);haze.addColorStop(0,'rgba(77,138,202,.09)');haze.addColorStop(1,'rgba(77,138,202,0)');ctx.fillStyle=haze;ctx.beginPath();ctx.arc(cx,cy,maxRadius*1.25,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#e6d8ac';ctx.beginPath();ctx.arc(cx,cy,Math.max(2,zoom*.055),0,Math.PI*2);ctx.fill();
 atom.rings.forEach((ring,index)=>{const bits=ringAt(ring.seed,ring.direction,tick),rad=(index+1)*zoom*.29;
 ctx.strokeStyle='rgba(137,166,190,.23)';ctx.lineWidth=Math.max(.6,zoom*.009);ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.stroke();
 for(let i=0;i<bits.length;i++){const angle=-Math.PI/2+2*Math.PI*i/bits.length,px=cx+Math.cos(angle)*rad,py=cy+Math.sin(angle)*rad;
 const dot=Math.max(2.1,Math.min(8,zoom*.067));
 if(bits[i]==='1'){ctx.shadowColor=index?'#8c9fff':'#4dd8e6';ctx.shadowBlur=Math.min(22,zoom*.17);ctx.fillStyle=index?'#97acff':'#59e5e9';ctx.beginPath();ctx.arc(px,py,dot,0,2*Math.PI);ctx.fill();ctx.shadowBlur=0}
 else{ctx.strokeStyle='#d9a05e';ctx.lineWidth=Math.max(1.1,zoom*.025);ctx.beginPath();ctx.arc(px,py,dot*.82,0,2*Math.PI);ctx.stroke()}
 }
 });
}
function paint(now){const tick=Math.floor((now-start)/520);if(tick!==lastFrame){lastFrame=tick;ctx.clearRect(0,0,w,h);for(const a of atoms)drawAtom(a,tick)}requestAnimationFrame(paint)}
function redraw(){lastFrame=-1}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);gesture=null});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;
 const before=[...pointers.values()];pointers.set(e.pointerId,[e.clientX,e.clientY]);const after=[...pointers.values()];
 if(after.length===1){panX-=(after[0][0]-before[0][0])/zoom;panY-=(after[0][1]-before[0][1])/zoom}
 else if(after.length===2){const d0=Math.hypot(before[0][0]-before[1][0],before[0][1]-before[1][1]),d1=Math.hypot(after[0][0]-after[1][0],after[0][1]-after[1][1]);if(d0>0){zoom=Math.max(15,Math.min(250,zoom*d1/d0))}
 panX-=((after[0][0]+after[1][0])-(before[0][0]+before[1][0]))/(2*zoom);panY-=((after[0][1]+after[1][1])-(before[0][1]+before[1][1]))/(2*zoom)}redraw()});
for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,e=>pointers.delete(e.pointerId));
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(15,Math.min(250,zoom*(e.deltaY>0?.9:1.1)));redraw()},{passive:false});
addEventListener('resize',()=>{resize();redraw()});resize();requestAnimationFrame(paint);
</script></body></html>
