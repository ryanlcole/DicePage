canvas.addEventListener('pointermove',e=>{if(lookPointer!==e.pointerId)return;cam.yaw+=(e.clientX-lookXY[0])*.006;cam.pitch=Math.max(-1.36,Math.min(1.36,cam.pitch-(e.clientY-lookXY[1])*.006));lookXY=[e.clientX,e.clientY]});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>{if(lookPointer===e.pointerId){lookPointer=null;lookXY=null}});
function joystick(e){const rect=stick.getBoundingClientRect(),x=(e.clientX-rect.left-rect.width/2)/37,y=(e.clientY-rect.top-rect.height/2)/37;
const length=Math.max(1,Math.hypot(x,y));moveX=x/length;moveZ=y/length;knob.style.transform=`translate(${moveX*30}px,${moveZ*30}px)`}
stick.addEventListener('pointerdown',e=>{stickPointer=e.pointerId;try{stick.setPointerCapture(e.pointerId)}catch(_){/* synthetic test pointer */};joystick(e)});
stick.addEventListener('pointermove',e=>{if(stickPointer===e.pointerId)joystick(e)});
for(const event of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(event,e=>{if(stickPointer!==e.pointerId)return;stickPointer=null;moveX=moveZ=0;knob.style.transform=''});
requestAnimationFrame(tick);
</script></body></html>
