<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DOS AI — Semantic Client Prototype</title>
<style>
:root{color-scheme:dark;--bg:#060806;--fg:#d9ffd9;--muted:#7daa7d;--line:#203620;--panel:#0b100b;--accent:#9dff9d}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:grid;grid-template-rows:auto 1fr auto}header,footer{padding:10px 14px;border-bottom:1px solid var(--line)}footer{border-top:1px solid var(--line);border-bottom:0;padding-bottom:max(10px,env(safe-area-inset-bottom))}main{min-height:0;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.6fr)}#terminal{padding:14px;overflow:auto;white-space:pre-wrap}#side{border-left:1px solid var(--line);background:var(--panel);padding:14px;overflow:auto}.row{display:flex;gap:8px}input{min-width:0;flex:1;background:#020402;color:var(--accent);border:1px solid var(--line);padding:12px;font:inherit;outline:none}button{background:#101810;color:var(--fg);border:1px solid var(--accent);padding:10px 16px;font:inherit;touch-action:manipulation}.k{color:var(--muted)}.v{color:var(--accent)}hr{border:0;border-top:1px solid var(--line);margin:12px 0}.tag{display:inline-block;padding:2px 6px;border:1px solid var(--line);margin:2px 4px 2px 0}.small{font-size:12px;color:var(--muted)}
@media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:minmax(240px,1fr) auto}#side{border-left:0;border-top:1px solid var(--line);max-height:38vh}.row{gap:6px}button{padding-inline:18px}}
</style>
</head>
<body>
<header>DOS AI // semantic thin-client proof <span class="small">isolated HTTPS prototype</span></header>
<main>
<section id="terminal"></section>
<aside id="side">
<div><span class="k">world</span> <span class="v" id="world"></span></div>
<div><span class="k">revision</span> <span class="v" id="rev"></span></div>
<div><span class="k">view</span> <span class="v" id="view"></span></div>
<div><span class="k">selected</span> <span class="v" id="sel"></span></div><hr>
<div class="k">local retained entities</div><div id="entities"></div><hr>
<div class="k">last outbound intent</div><pre id="packet" class="small">none</pre>
</aside>
</main>
<footer><form id="form" class="row"><input id="cmd" autocomplete="off" autocapitalize="none" placeholder='Try: "open geonaph", "show entities", "move dragon west", "status", "help"'><button id="send" type="submit">send</button></form></footer>
<script>
'use strict';
const state={world:'Geonaph',revision:19820,view:'Geonaph/32/19',selected:null,entities:{Dragon_82:{type:'adult_red_dragon',x:432,y:187,z:3,state:'wounded',heading:'west'},Oak_22:{type:'oak_tree',x:418,y:190,z:0,state:'healthy'},Mountain_11:{type:'mountain',x:441,y:201,z:2,state:'stable'}}};
const $=id=>document.getElementById(id),term=$('terminal');
function line(s=''){term.textContent+=s+'\n';term.scrollTop=term.scrollHeight}
function render(){ $('world').textContent=state.world;$('rev').textContent=state.revision;$('view').textContent=state.view;$('sel').textContent=state.selected||'none';$('entities').innerHTML=Object.entries(state.entities).map(([id,e])=>`<div class="tag">${id}: ${e.type}</div>`).join('') }
function packet(obj){$('packet').textContent=JSON.stringify(obj,null,2)}
function applyServerDelta(delta){if(delta.type==='MOVE'){const e=state.entities[delta.entity];if(e){e.x+=delta.dx||0;e.y+=delta.dy||0;e.z+=delta.dz||0}}if(delta.type==='SELECT')state.selected=delta.entity;state.revision++;line(`SERVER> ACK rev=${state.revision}`);line(`SERVER> ${JSON.stringify(delta)}`);render()}
function interpret(raw){const s=raw.trim().toLowerCase();if(!s)return;line(`YOU> ${raw}`);if(s==='help'){line('EI> open geonaph | status | show entities | select dragon | move dragon west/east/north/south | clear');return}if(s==='clear'){term.textContent='';return}if(s.includes('open')&&s.includes('geonaph')){const out={intent:'OPEN_VIEW',world:'Geonaph',view:'Geonaph/32/19',known_revision:state.revision};packet(out);line('EI> intent resolved: OPEN_VIEW Geonaph');line('SERVER> no world payload required; local client already holds current demo state');return}if(s==='status'||s.includes('what changed')){line(`EI> ${state.world}, rev ${state.revision}, view ${state.view}, ${Object.keys(state.entities).length} retained entities.`);return}if(s.includes('show')&&s.includes('entit')){for(const [id,e] of Object.entries(state.entities))line(`EI> ${id} @ (${e.x},${e.y},${e.z}) ${e.state}`);return}if(s.includes('select')&&s.includes('dragon')){const out={intent:'SELECT',entity:'Dragon_82'};packet(out);line('EI> intent resolved: SELECT Dragon_82');applyServerDelta({type:'SELECT',entity:'Dragon_82'});return}const move=s.match(/move\s+(?:the\s+)?dragon\s+(west|east|north|south)/);if(move){const dir=move[1],d={west:[-1,0],east:[1,0],north:[0,-1],south:[0,1]}[dir],out={intent:'MOVE',entity:'Dragon_82',dx:d[0],dy:d[1],known_revision:state.revision};packet(out);line(`EI> "${raw}" -> ${JSON.stringify(out)}`);line('EI> sending semantic intent, not pixels...');applyServerDelta({type:'MOVE',entity:'Dragon_82',dx:d[0],dy:d[1]});return}if(s.includes('dragon')){const e=state.entities.Dragon_82;line(`EI> Dragon_82 is ${e.state} at (${e.x},${e.y},${e.z}), heading ${e.heading}.`);return}packet({intent:'UNRESOLVED_NATURAL_LANGUAGE',text:raw});line('EI> Input received, but this tiny deterministic interpreter has no rule for that intent yet.');line('EI> A small local model could resolve ambiguity into a deterministic command here.')}
$('form').addEventListener('submit',e=>{e.preventDefault();const c=$('cmd');interpret(c.value);c.value='';c.focus()});
line('BOOT> semantic runtime loaded');line('NET > simulated authoritative server connected');line('SYNC> checkpoint 19820 already present');line('EI  > Ready. Type HELP.');line();render();
</script>
</body>
</html>
